<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#ededed"/>
  <!-- bones -->
  <g stroke="#2f2f2f" stroke-width="4" stroke-linecap="round">
    <line x1="20" y1="40" x2="32" y2="26"/>
    <line x1="32" y1="26" x2="46" y2="38"/>
    <line x1="20" y1="40" x2="30" y2="48"/>
  </g>
  <!-- wing -->
  <line x1="32" y1="26" x2="14" y2="14" stroke="#138b91" stroke-width="5" stroke-linecap="round"/>
  <!-- muscles -->
  <line x1="26" y1="33" x2="39" y2="32" stroke="#d98c8c" stroke-width="3" stroke-linecap="round"/>
  <!-- joints -->
  <g fill="#e10000" stroke="#a80000" stroke-width="1.5">
    <circle cx="20" cy="40" r="6"/>
    <circle cx="32" cy="26" r="6"/>
    <circle cx="46" cy="38" r="6"/>
    <circle cx="30" cy="48" r="5"/>
  </g>
</svg>
