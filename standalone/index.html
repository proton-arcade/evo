/*
 * Evolution (Web Edition) — css/style.css
 * A flat light/dark interface based on the original Unity game: restrained
 * surfaces, thin outlines, uppercase labels and red creature joints.
 */


:root,
:root[data-theme='light'] {
  color-scheme: light;
  --evo-bg: #ededed;
  --evo-surface: #f7f7f7;
  --evo-surface-soft: #f4f4f4;
  --evo-raised: #fff;
  --evo-ink: #1b1b1b;
  --evo-ink-soft: #4a4a4a;
  --evo-muted: #6a6a6a;
  --evo-muted-soft: #7a7a7a;
  --evo-muted-faint: #9a9a9a;
  --evo-line: #dcdcdc;
  --evo-line-strong: #cfcfcf;
  --evo-line-soft: #e0e0e0;
  --evo-track: #c4c4c4;
  --evo-scroll-thumb: #b8b8b8;
  --evo-toggle-track: #d5d5d5;
  --evo-toggle-thumb: #fff;
  --evo-primary-hover: #3c3c3c;
  --evo-selected-surface: #f0f5f8;
  --evo-selected-line: #526a78;
  --evo-danger: #b03636;
  --evo-accent: #2f7fbf;
  --evo-focus: #1b8ef2;
  --evo-on-accent: #fff;
  --evo-glass-90: rgba(247, 247, 247, 0.9);
  --evo-glass-92: rgba(247, 247, 247, 0.92);
  --evo-glass-94: rgba(247, 247, 247, 0.94);
  --evo-glass-96: rgba(247, 247, 247, 0.96);
  --evo-glass-97: rgba(247, 247, 247, 0.97);
  --evo-glass-98: rgba(247, 247, 247, 0.98);
  --evo-tooltip-bg: rgba(27, 27, 27, 0.82);
  --evo-tooltip-ink: #f2f2f2;
  --evo-modal-overlay: rgba(20, 20, 20, 0.35);
  --evo-shadow-soft: rgba(0, 0, 0, 0.12);
  --evo-shadow: rgba(0, 0, 0, 0.22);
  --evo-canvas-clear: rgba(237, 237, 237, 0);
  --evo-canvas-fade-76: rgba(237, 237, 237, 0.76);
  --evo-canvas-fade-78: rgba(237, 237, 237, 0.78);
  --evo-surface-clear: rgba(247, 247, 247, 0);
}

:root[data-theme='dark'] {
  color-scheme: dark;
  --evo-bg: #17191c;
  --evo-surface: #22252a;
  --evo-surface-soft: #1d2024;
  --evo-raised: #2b2f35;
  --evo-ink: #f1f2f3;
  --evo-ink-soft: #d0d3d7;
  --evo-muted: #b4b8bd;
  --evo-muted-soft: #969ba2;
  --evo-muted-faint: #747a83;
  --evo-line: #383d44;
  --evo-line-strong: #4a5059;
  --evo-line-soft: #30343a;
  --evo-track: #555c65;
  --evo-scroll-thumb: #626a74;
  --evo-toggle-track: #4b515a;
  --evo-toggle-thumb: #fff;
  --evo-primary-hover: #d7dae0;
  --evo-selected-surface: #25333d;
  --evo-selected-line: #779bad;
  --evo-danger: #e16a6a;
  --evo-accent: #6eb8eb;
  --evo-focus: #65b1ff;
  --evo-on-accent: #fff;
  --evo-glass-90: rgba(34, 37, 42, 0.9);
  --evo-glass-92: rgba(34, 37, 42, 0.92);
  --evo-glass-94: rgba(34, 37, 42, 0.94);
  --evo-glass-96: rgba(34, 37, 42, 0.96);
  --evo-glass-97: rgba(34, 37, 42, 0.97);
  --evo-glass-98: rgba(34, 37, 42, 0.98);
  --evo-tooltip-bg: rgba(7, 9, 12, 0.92);
  --evo-tooltip-ink: #f1f2f3;
  --evo-modal-overlay: rgba(0, 0, 0, 0.62);
  --evo-shadow-soft: rgba(0, 0, 0, 0.28);
  --evo-shadow: rgba(0, 0, 0, 0.48);
  --evo-canvas-clear: rgba(23, 25, 28, 0);
  --evo-canvas-fade-76: rgba(23, 25, 28, 0.76);
  --evo-canvas-fade-78: rgba(23, 25, 28, 0.78);
  --evo-surface-clear: rgba(34, 37, 42, 0);
}

/* ================================================================== *
 * Reset / base
 * ================================================================== */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--evo-bg);
  color: var(--evo-ink);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  cursor: pointer;
}

button,
input,
select,
textarea,
a,
[role='button'] {
  touch-action: manipulation;
}

input,
textarea {
  -webkit-user-select: text;
  user-select: text;
}

input[type='range'] {
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  height: 18px;
  cursor: pointer;
}

input[type='range']::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--evo-track);
}

input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  margin-top: -5px;
  border-radius: 50%;
  background: var(--evo-ink);
}

input[type='range']::-moz-range-track {
  height: 2px;
  background: var(--evo-track);
}

input[type='range']::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: none;
  border-radius: 50%;
  background: var(--evo-ink);
}

.hidden {
  display: none !important;
}

.startup-notice {
  position: fixed;
  z-index: 30;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 28px;
  background: var(--evo-bg);
  color: var(--evo-ink);
  text-align: center;
}

.startup-notice h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: 0.2em;
}

.startup-notice p {
  max-width: 470px;
  margin: 0;
  line-height: 1.5;
}

.startup-notice .startup-note {
  color: var(--evo-muted);
  font-size: 12px;
}

#screens {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100dvh;
}

.screen {
  position: absolute;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

.screen.visible {
  animation: fade-in 0.18s ease-out;
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* ================================================================== *
 * Buttons
 * ================================================================== */
.evo-button,
.back-button,
.hud-button {
  background: var(--evo-surface);
  border: 1px solid var(--evo-ink);
  border-radius: 3px;
  padding: 6px 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 11px;
  transition: background 0.12s ease, color 0.12s ease;
}

@media (hover: hover) {
  .evo-button:hover,
  .back-button:hover,
  .hud-button:hover {
    background: var(--evo-ink);
    color: var(--evo-surface);
  }
}

.evo-button.primary,
.hud-button.primary {
  background: var(--evo-ink);
  color: var(--evo-surface);
  border-color: var(--evo-ink);
}

@media (hover: hover) {
  .evo-button.primary:hover {
    background: var(--evo-primary-hover);
  }
}

.evo-button.danger,
.hud-button.danger {
  border-color: var(--evo-danger);
  color: var(--evo-danger);
}

@media (hover: hover) {
  .evo-button.danger:hover {
    background: var(--evo-danger);
    color: var(--evo-on-accent);
  }
}

.evo-button.accent {
  border-color: var(--evo-accent);
  color: var(--evo-accent);
}

@media (hover: hover) {
  .evo-button.accent:hover {
    background: var(--evo-accent);
    color: var(--evo-on-accent);
  }
}

.evo-button.shock-button {
  border-color: #c99700;
  color: #9a7400;
}

@media (hover: hover) {
  .evo-button.shock-button:hover {
    background: #f5c518;
    border-color: #f5c518;
    color: var(--evo-ink);
  }
}

.evo-button.shock-button:active {
  background: #f5c518;
  border-color: #f5c518;
  color: var(--evo-ink);
}

.evo-button.small,
.hud-button {
  padding: 5px 9px;
  font-size: 10px;
}

.hud-button.disabled,
.hud-button:disabled,
.evo-button:disabled {
  opacity: 0.4;
  pointer-events: none;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.button-row.compact {
  gap: 4px;
}

.button-row.compact .evo-button {
  padding: 5px 9px;
  font-size: 10px;
}

/* ================================================================== *
 * Top bar
 * ================================================================== */
.top-bar {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--evo-bg);
  border-bottom: 1px solid var(--evo-line);
}

.back-button {
  display: flex;
  align-items: center;
  gap: 6px;
}

.back-arrow {
  font-size: 14px;
  line-height: 1;
}

.top-bar-title {
  flex: 1;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  font-size: 12px;
}

.top-bar-right {
  min-width: 90px;
  display: flex;
  justify-content: flex-end;
}

.editor-top-bar .editor-name {
  margin: 0;
}

.editor-top-bar .editor-name .text-input {
  width: 180px;
}

/* ================================================================== *
 * Home screen
 * ================================================================== */
.screen-home {
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
  padding: 40px 20px 20px;
}

.home-header {
  text-align: center;
  margin-bottom: 26px;
}

.home-title {
  margin: 0;
  font-size: 40px;
  letter-spacing: 0.34em;
  font-weight: 300;
}

.home-subtitle {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--evo-muted);
  letter-spacing: 0.08em;
}

.home-content {
  width: 100%;
  max-width: 560px;
}

.home-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.home-button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 5px;
  padding: 16px;
  background: var(--evo-surface);
  border: 1px solid var(--evo-line-strong);
  border-radius: 4px;
  text-align: left;
  transition: border-color 0.12s ease, transform 0.12s ease;
}

@media (hover: hover) {
  .home-button:hover {
    border-color: var(--evo-ink);
    transform: translateY(-1px);
  }
}

.home-button-title {
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 13px;
}

.home-button-sub {
  font-size: 11px;
  color: var(--evo-muted-soft);
  line-height: 1.4;
}

.home-info {
  margin-top: 18px;
  padding: 12px 14px;
  border: 1px solid var(--evo-line);
  border-radius: 4px;
  background: var(--evo-surface-soft);
}

.home-info-title {
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-size: 10px;
  color: var(--evo-muted-soft);
}

.home-info-sub {
  margin-top: 4px;
  font-size: 12px;
}

.home-footer {
  margin-top: 26px;
  max-width: 560px;
  text-align: center;
}

.footer-note {
  font-size: 10px;
  color: var(--evo-muted-faint);
  line-height: 1.6;
}

/* ================================================================== *
 * Ecosystem setup and shared-world simulation
 * ================================================================== */
.screen-ecosystem {
  display: flex;
  flex-direction: column;
}

.ecosystem-top-bar {
  flex: 0 0 auto;
}

.ecosystem-setup-content {
  flex: 1 1 auto;
  min-height: 0;
  width: min(100%, 980px);
  margin: 0 auto;
  padding: 24px 20px 32px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.ecosystem-heading {
  margin: 2px 0 6px;
  font-size: clamp(22px, 4vw, 30px);
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.ecosystem-intro {
  max-width: 720px;
  margin: 0 0 20px;
  color: var(--evo-muted);
  font-size: 13px;
  line-height: 1.5;
}

.ecosystem-setup-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: end;
  gap: 14px 20px;
  padding: 14px;
  background: var(--evo-surface);
  border: 1px solid var(--evo-line-soft);
  border-radius: 4px;
}

.ecosystem-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.ecosystem-objective {
  width: 100%;
  min-height: 36px;
  padding: 6px 8px;
  background: var(--evo-raised);
  border: 1px solid var(--evo-line-strong);
  border-radius: 3px;
  font: inherit;
}

.ecosystem-setup-controls .widget-slider {
  min-width: 0;
}

.ecosystem-selection-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 9px;
}

.ecosystem-selection-heading h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.ecosystem-selection-count {
  color: var(--evo-muted);
  font-size: 11px;
  white-space: nowrap;
}

.ecosystem-creature-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}

.ecosystem-creature-card {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-height: 68px;
  padding: 12px;
  background: var(--evo-surface);
  border: 1px solid var(--evo-line);
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}

.ecosystem-creature-card.selected {
  background: var(--evo-selected-surface);
  border-color: var(--evo-selected-line);
}

.ecosystem-checkbox {
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  margin: 1px 0 0;
  accent-color: var(--evo-ink);
}

.ecosystem-card-content {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}

.ecosystem-card-name {
  overflow-wrap: anywhere;
  font-size: 12px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.ecosystem-card-subtitle {
  color: var(--evo-muted-soft);
  font-size: 10px;
  line-height: 1.35;
}

.ecosystem-selection-note {
  min-height: 18px;
  margin: 12px 0;
  color: var(--evo-muted-soft);
  font-size: 11px;
  line-height: 1.45;
}

.ecosystem-start-button {
  min-height: 42px;
  padding: 10px 18px;
}

.ecosystem-start-button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.ecosystem-canvas-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.ecosystem-canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.ecosystem-run-info,
.ecosystem-run-actions,
.ecosystem-run-status {
  position: absolute;
  z-index: 4;
  background: var(--evo-glass-92);
  border: 1px solid var(--evo-line);
  border-radius: 4px;
}

.ecosystem-run-info {
  top: 14px;
  left: 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  width: min(290px, 40vw);
  padding: 10px 12px;
  pointer-events: none;
}

.ecosystem-run-title {
  font-size: 15px;
  letter-spacing: 0.15em;
}

.ecosystem-run-objective {
  color: var(--evo-muted);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.ecosystem-run-residents {
  overflow: hidden;
  color: var(--evo-ink-soft);
  font-size: 10px;
  line-height: 1.4;
  text-overflow: ellipsis;
}

.ecosystem-run-actions {
  top: 14px;
  right: 14px;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 5px;
  padding: 6px;
}

.ecosystem-run-actions .evo-button {
  white-space: nowrap;
}

.ecosystem-run-status {
  bottom: 14px;
  left: 50%;
  display: flex;
  align-items: center;
  gap: 9px;
  transform: translateX(-50%);
  padding: 7px 10px;
  white-space: nowrap;
}

.ecosystem-elapsed,
.ecosystem-status-label,
.ecosystem-speed-caption,
.ecosystem-speed-value {
  font-size: 10px;
  letter-spacing: 0.06em;
}

.ecosystem-status-label,
.ecosystem-speed-caption {
  color: var(--evo-muted-soft);
  text-transform: uppercase;
}

.ecosystem-speed {
  width: 110px;
  margin: 0;
}

.ecosystem-speed-value {
  min-width: 36px;
  text-align: right;
}

/* ================================================================== *
 * Lists / panels / settings
 * ================================================================== */
.list-content {
  height: calc(100% - 45px);
  overflow-y: auto;
  padding: 18px;
  max-width: 900px;
  margin: 0 auto;
}

.list-content.settings-content {
  max-width: 780px;
}

.list-section-title {
  margin: 16px 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 10px;
  color: var(--evo-muted-soft);
}

.list-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--evo-surface);
  border: 1px solid var(--evo-line-soft);
  border-radius: 4px;
  margin-bottom: 6px;
}

.list-row.compact-row {
  padding: 8px;
}

.list-row-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.list-row-title {
  font-size: 13px;
}

.list-row-sub {
  font-size: 11px;
  color: var(--evo-muted-soft);
}

.empty-note {
  font-size: 12px;
  color: var(--evo-muted-soft);
  padding: 10px 2px;
}

.panel {
  background: var(--evo-surface);
  border: 1px solid var(--evo-line);
  border-radius: 4px;
  margin-bottom: 12px;
}

.panel-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--evo-line-soft);
}

.panel-title {
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-size: 10px;
  color: var(--evo-muted);
}

.panel-body {
  padding: 10px 12px;
}

.panel-note {
  margin: 6px 0 0;
  font-size: 11px;
  color: var(--evo-muted-soft);
  line-height: 1.55;
}

.settings-panels .panel {
  margin-bottom: 0;
}

.settings-panels {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.design-stats {
  font-size: 11px;
  color: var(--evo-muted);
  letter-spacing: 0.04em;
}

/* --- widgets --- */
.widget {
  margin-bottom: 12px;
}

.widget:last-child {
  margin-bottom: 0;
}

.widget-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}

.widget-label {
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 10px;
  color: var(--evo-muted);
}

.widget-value {
  font-size: 11px;
  color: var(--evo-ink);
}

.widget .slider {
  width: 100%;
}

.widget-toggle .toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.widget-toggle input {
  display: none;
}

.toggle-track {
  position: relative;
  width: 34px;
  height: 16px;
  border-radius: 8px;
  background: var(--evo-toggle-track);
  transition: background 0.15s ease;
}

.toggle-track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--evo-toggle-thumb);
  transition: transform 0.15s ease;
}

.widget-toggle input:checked + .toggle-track {
  background: var(--evo-ink);
}

.widget-toggle input:checked + .toggle-track::after {
  transform: translateX(18px);
}

.toggle-label {
  font-size: 12px;
}

.widget-stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stepper-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.stepper-button {
  width: 22px;
  height: 22px;
  border: 1px solid var(--evo-ink);
  background: transparent;
  border-radius: 3px;
  line-height: 1;
}

@media (hover: hover) {
  .stepper-button:hover {
    background: var(--evo-ink);
    color: var(--evo-raised);
  }
}

.stepper-value {
  min-width: 46px;
  text-align: center;
  font-size: 12px;
}

.widget-input .text-input,
.import-textarea,
.widget-dropdown .dropdown {
  width: 100%;
  margin-top: 4px;
  padding: 6px 8px;
  background: var(--evo-raised);
  border: 1px solid var(--evo-line-strong);
  border-radius: 3px;
  font-family: inherit;
  font-size: 12px;
}

.import-textarea {
  height: 160px;
  resize: vertical;
  font-family: 'SF Mono', Menlo, Consolas, monospace;
}

.layer-container {
  padding-left: 6px;
  border-left: 1px solid var(--evo-line-soft);
}

/* ================================================================== *
 * Editor
 * ================================================================== */
.screen-editor .canvas-container,
.simulation-canvas-container,
.gallery-canvas-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.screen-editor .canvas-container {
  top: 46px;
}

.editor-canvas,
.simulation-canvas,
.gallery-canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.toolbar {
  position: absolute;
  z-index: 4;
  left: 14px;
  top: 60px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.tool-button {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 108px;
  padding: 8px 10px;
  background: var(--evo-glass-94);
  border: 1px solid var(--evo-line-strong);
  border-radius: 4px;
  text-align: left;
}

@media (hover: hover) {
  .tool-button:hover {
    border-color: var(--evo-ink);
  }
}

.tool-button.active {
  background: var(--evo-ink);
  color: var(--evo-surface);
  border-color: var(--evo-ink);
}

.tool-icon {
  font-size: 14px;
  width: 16px;
  text-align: center;
}

.tool-label {
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 10px;
}

.decoration-picker {
  position: absolute;
  z-index: 6;
  left: 132px;
  top: 60px;
  width: 220px;
  max-height: 60%;
  overflow-y: auto;
  background: var(--evo-glass-97);
  border: 1px solid var(--evo-line-strong);
  border-radius: 4px;
  padding: 8px;
}

.decoration-picker-body {
  display: grid;
  grid-template-columns: 1fr;
  gap: 3px;
}

.decoration-option {
  padding: 5px 8px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 3px;
  text-align: left;
  font-size: 11px;
}

@media (hover: hover) {
  .decoration-option:hover {
    border-color: var(--evo-line-strong);
  }
}

.decoration-option.active {
  background: var(--evo-ink);
  color: var(--evo-surface);
}

.side-panel.editor-settings {
  position: absolute;
  z-index: 4;
  right: 14px;
  top: 60px;
  width: 250px;
  max-height: calc(100% - 120px);
  overflow-y: auto;
  background: var(--evo-glass-96);
  border: 1px solid var(--evo-line);
  border-radius: 4px;
  padding: 12px;
}

.editor-hint {
  position: absolute;
  z-index: 3;
  left: 50%;
  transform: translateX(-50%);
  bottom: 14px;
  max-width: 60%;
  padding: 8px 12px;
  background: var(--evo-tooltip-bg);
  color: var(--evo-tooltip-ink);
  border-radius: 4px;
  font-size: 11px;
  line-height: 1.45;
  text-align: center;
  pointer-events: none;
}

/* ================================================================== *
 * Simulation HUD
 * ================================================================== */
.screen-simulation,
.screen-gallery {
  display: flex;
  flex-direction: column;
}

.hud {
  position: absolute;
  z-index: 4;
  pointer-events: none;
}

.hud > * {
  pointer-events: auto;
}

.hud-top-left {
  left: 16px;
  top: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 210px;
  padding: 12px 14px;
  background: var(--evo-glass-90);
  border: 1px solid var(--evo-line);
  border-radius: 4px;
}

.hud-generation {
  font-size: 17px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.hud-task {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--evo-muted);
}

.hud-fitness {
  font-size: 13px;
  letter-spacing: 0.08em;
}

.hud-phase {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--evo-muted);
  text-transform: uppercase;
}

.hud-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-row-label {
  width: 64px;
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--evo-muted);
}

.hud-row-value {
  min-width: 42px;
  font-size: 10px;
  text-align: right;
}

.hud-slider {
  flex: 1;
  min-width: 80px;
}

.hud-slider-small {
  width: 90px;
  flex: none;
}

.hud-toggle {
  padding: 3px 10px;
  background: transparent;
  border: 1px solid var(--evo-ink);
  border-radius: 3px;
  font-size: 9px;
  letter-spacing: 0.14em;
}

.hud-toggle.active {
  background: var(--evo-ink);
  color: var(--evo-surface);
}

.hud-top-right {
  right: 16px;
  top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
}

.hud-top-controls {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 6px;
}

.simulation-pause-button {
  white-space: nowrap;
}

.flight-debug-toggle.active {
  background: var(--evo-ink);
  color: var(--evo-surface);
}

.thumbnail-frame {
  position: relative;
  padding: 6px;
  background: #2c2c2c;
  border-radius: 6px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
}

.thumbnail-canvas {
  display: block;
  border-radius: 3px;
}

.thumbnail-caption {
  margin-top: 5px;
  color: #d8d8d8;
  font-size: 9px;
  letter-spacing: 0.16em;
  text-align: center;
}

.flight-debug {
  width: min(340px, 42vw);
  max-height: 190px;
  overflow: auto;
  margin: 0;
  padding: 8px 10px;
  border-left: 2px solid #138b91;
  border-radius: 3px;
  background: rgba(27, 37, 38, 0.9);
  color: #edf6f6;
  font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: pre-wrap;
}

.hud-bottom-left {
  left: 16px;
  bottom: 16px;
  width: 230px;
  padding: 10px 12px;
  background: var(--evo-glass-90);
  border: 1px solid var(--evo-line);
  border-radius: 4px;
}

.hud-stats-title {
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--evo-muted);
  margin-bottom: 6px;
}

.hud-stats-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
}

.hud-stats-gen {
  width: 46px;
  font-size: 9px;
  letter-spacing: 0.06em;
  color: var(--evo-muted);
}

.hud-stats-bar {
  flex: 1;
  height: 5px;
  background: var(--evo-line);
  border-radius: 2px;
  overflow: hidden;
}

.hud-stats-bar-fill {
  height: 100%;
  background: var(--evo-danger);
}

.hud-stats-value {
  width: 48px;
  text-align: right;
  font-size: 9px;
}

.hud-bottom {
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--evo-glass-94);
  border: 1px solid var(--evo-line);
  border-radius: 4px;
}

.play-button {
  width: 34px;
  text-align: center;
}

.seek-slider {
  width: 240px;
}

.hud-recording-label {
  font-size: 10px;
  color: var(--evo-muted);
  letter-spacing: 0.08em;
  min-width: 96px;
}

.hud-speed {
  right: 16px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--evo-glass-90);
  border: 1px solid var(--evo-line);
  border-radius: 4px;
}

.settings-drawer {
  position: absolute;
  z-index: 7;
  right: 16px;
  top: 150px;
  width: 290px;
  max-height: 65%;
  overflow-y: auto;
  padding: 12px;
  background: var(--evo-glass-98);
  border: 1px solid var(--evo-line);
  border-radius: 4px;
  box-shadow: 0 6px 18px var(--evo-shadow-soft);
}

.drawer-title {
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-size: 10px;
  color: var(--evo-muted);
  margin-bottom: 10px;
}

/* ================================================================== *
 * Gallery
 * ================================================================== */
.gallery-content {
  flex: 1;
  display: flex;
  min-height: 0;
}

.gallery-list {
  width: 260px;
  padding: 12px;
  border-right: 1px solid var(--evo-line);
  overflow-y: auto;
  background: var(--evo-surface-soft);
}

.gallery-entry {
  display: flex;
  flex-direction: column;
  gap: 3px;
  width: 100%;
  padding: 9px 10px;
  margin-bottom: 5px;
  background: var(--evo-surface);
  border: 1px solid var(--evo-line-soft);
  border-radius: 4px;
  text-align: left;
}

@media (hover: hover) {
  .gallery-entry:hover {
    border-color: var(--evo-ink);
  }
}

.gallery-entry.active {
  border-color: var(--evo-ink);
  background: var(--evo-raised);
}

.gallery-entry-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.gallery-entry-sub {
  font-size: 10px;
  color: var(--evo-muted-soft);
}

.gallery-player {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.gallery-canvas-container {
  position: relative;
  flex: 1;
  min-height: 0;
}

.gallery-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-top: 1px solid var(--evo-line);
  background: var(--evo-bg);
}

.gallery-info {
  font-size: 10px;
  color: var(--evo-muted);
  letter-spacing: 0.06em;
}

.gallery-player .button-row {
  padding: 0 14px 12px;
}

/* ================================================================== *
 * Modals
 * ================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: var(--evo-modal-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(20px + env(safe-area-inset-top, 0px))
    calc(20px + env(safe-area-inset-right, 0px))
    calc(20px + env(safe-area-inset-bottom, 0px))
    calc(20px + env(safe-area-inset-left, 0px));
}

.modal {
  width: 100%;
  max-width: 440px;
  max-height: 86%;
  overflow-y: auto;
  background: var(--evo-surface);
  border: 1px solid var(--evo-line-strong);
  border-radius: 6px;
  box-shadow: 0 10px 30px var(--evo-shadow);
  animation: fade-in 0.15s ease-out;
}

.modal-title {
  padding: 14px 16px 0;
  font-size: 15px;
  letter-spacing: 0.06em;
}

.modal-body {
  padding: 10px 16px 4px;
}

.modal-message {
  margin: 0;
  font-size: 12px;
  line-height: 1.6;
  color: var(--evo-ink-soft);
}

.modal-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  padding: 14px 16px;
}

.menu-content {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sample-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sample-option {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 10px;
  background: var(--evo-raised);
  border: 1px solid var(--evo-line-soft);
  border-radius: 4px;
  text-align: left;
}

@media (hover: hover) {
  .sample-option:hover {
    border-color: var(--evo-ink);
  }
}

.sample-name {
  font-size: 12px;
  letter-spacing: 0.08em;
}

.sample-details {
  font-size: 10px;
  color: var(--evo-muted-soft);
}

.sample-section-title {
  margin-top: 8px;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--evo-muted-soft);
}

/* ================================================================== *
 * Help
 * ================================================================== */
.list-content.help-content {
  max-width: 920px;
  padding: 24px 20px 48px;
}

.help-intro {
  padding: clamp(22px, 5vw, 42px);
  border: 1px solid var(--evo-line);
  border-radius: 4px;
  background: var(--evo-surface-soft);
}

.help-eyebrow,
.help-search-label {
  color: var(--evo-muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.help-heading {
  max-width: 680px;
  margin: 7px 0 10px;
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 400;
  letter-spacing: -0.025em;
  line-height: 1.08;
}

.help-lead {
  max-width: 650px;
  margin: 0;
  color: var(--evo-ink-soft);
  font-size: 13px;
  line-height: 1.6;
}

.help-quick-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 20px;
}

.help-tools {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 10px 14px;
  margin: 14px 0;
  padding: 14px;
  border: 1px solid var(--evo-line);
  border-radius: 4px;
  background: var(--evo-surface);
}

.help-search {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.help-search-input {
  width: 100%;
  min-height: 38px;
  padding: 8px 10px;
  border: 1px solid var(--evo-line-strong);
  border-radius: 3px;
  outline: none;
  background: var(--evo-raised);
  color: var(--evo-ink);
  font: inherit;
  font-size: 12px;
  -webkit-user-select: text;
  user-select: text;
}

.help-search-input::placeholder {
  color: var(--evo-muted-soft);
}

.help-search-input:focus {
  border-color: var(--evo-focus);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--evo-focus) 22%, transparent);
}

.help-tool-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 5px;
}

.help-tool-actions button[hidden] {
  display: none;
}

.help-result-status {
  grid-column: 1 / -1;
  min-height: 14px;
  color: var(--evo-muted-soft);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.help-topics {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.help-topic {
  border: 1px solid var(--evo-line);
  border-radius: 4px;
  background: var(--evo-surface);
}

.help-topic[hidden] {
  display: none;
}

.help-topic-summary {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) 26px;
  align-items: center;
  gap: 10px;
  min-height: 68px;
  padding: 12px 14px;
  cursor: pointer;
  list-style: none;
}

.help-topic-summary::-webkit-details-marker {
  display: none;
}

.help-topic-summary:focus-visible {
  outline: 2px solid var(--evo-focus);
  outline-offset: -3px;
}

@media (hover: hover) {
  .help-topic-summary:hover {
    background: var(--evo-surface-soft);
  }
}

.help-topic-number {
  align-self: start;
  padding-top: 3px;
  color: var(--evo-muted-soft);
  font: 10px/1.4 'SF Mono', Menlo, Consolas, monospace;
}

.help-topic-summary-copy {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.help-topic-title {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.help-topic-description {
  color: var(--evo-muted);
  font-size: 11px;
  line-height: 1.4;
}

.help-topic-marker {
  color: var(--evo-muted);
  font-size: 20px;
  font-weight: 300;
  text-align: center;
  transition: transform 0.15s ease;
}

.help-topic[open] .help-topic-marker {
  transform: rotate(45deg);
}

.help-topic-body {
  padding: 4px 58px 18px 52px;
  border-top: 1px solid var(--evo-line-soft);
  color: var(--evo-ink-soft);
  font-size: 12px;
  line-height: 1.62;
}

.help-topic-body p {
  margin: 13px 0 0;
}

.help-bullets,
.help-steps {
  margin: 13px 0 0;
  padding-left: 20px;
}

.help-bullets li + li,
.help-steps li + li {
  margin-top: 7px;
}

.help-steps li::marker {
  color: var(--evo-muted-soft);
  font-family: 'SF Mono', Menlo, Consolas, monospace;
}

.help-tip {
  padding: 10px 12px;
  border-left: 3px solid var(--evo-accent);
  background: var(--evo-surface-soft);
}

.help-shortcuts {
  margin: 13px 0 0;
}

.help-shortcut-row {
  display: grid;
  grid-template-columns: minmax(110px, 0.35fr) 1fr;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--evo-line-soft);
}

.help-shortcut-row:last-child {
  border-bottom: 0;
}

.help-shortcut-row dt {
  color: var(--evo-ink);
  font-weight: 600;
}

.help-shortcut-row dd {
  margin: 0;
}

.help-no-results {
  padding: 28px 18px;
  border: 1px dashed var(--evo-line-strong);
  border-radius: 4px;
  color: var(--evo-muted);
  text-align: center;
}

.help-no-results[hidden] {
  display: none;
}

.help-no-results p {
  margin: 6px 0 0;
  font-size: 12px;
}

.theme-setting-note {
  margin: -2px 0 14px;
}

@media (max-width: 600px) {
  .list-content.help-content {
    padding: 12px 10px 32px;
  }

  .help-intro {
    padding: 22px 16px;
  }

  .help-quick-actions .evo-button {
    flex: 1 1 130px;
  }

  .help-tools {
    grid-template-columns: 1fr;
    padding: 12px;
  }

  .help-tool-actions {
    justify-content: flex-start;
  }

  .help-topic-summary {
    grid-template-columns: 24px minmax(0, 1fr) 22px;
    gap: 7px;
    padding: 12px 10px;
  }

  .help-topic-body {

      /* Source: js/core/network.js */
/*
 * Evolution (Web Edition) — core/network.js
 * ---------------------------------------------------------------
 * Port of the neural network of the original Unity project:
 *   Assets/Scripts/Data/FeedForwardNetwork.cs
 *   Assets/Scripts/Data/NeuralNetworkSettings.cs
 *   Assets/Scripts/Util/MatrixUtils.cs
 *   Assets/Scripts/Util/ConversionUtils.cs
 *
 * A feed forward network with sigmoid activation functions.  The chromosome
 * (also called "genome") of a creature is the flattened list of all weights,
 * stored layer by layer, row by row.
 */
(function (global) {
  'use strict';

  var EVO = (global.EVO = global.EVO || {});
  var Utils = EVO.Utils;
  var Store = EVO.Store;

  var MIN_WEIGHT = -3.0;
  var MAX_WEIGHT = 3.0;

  /* ------------------------------------------------------------------ *
   * NeuralNetworkSettings
   * ------------------------------------------------------------------ */
  var NeuralNetworkSettings = {
    MAX_LAYERS: 10,
    MAX_NODES_PER_LAYER: 100,

    /** Creates the setting struct: only the intermediate layer sizes. */
    create: function (nodesPerIntermediateLayer) {
      return {
        NodesPerIntermediateLayer:
          nodesPerIntermediateLayer && nodesPerIntermediateLayer.length
            ? nodesPerIntermediateLayer.slice()
            : [10],
      };
    },

    /** The default network: 10 nodes in a single hidden layer. */
    defaultSettings: function () {
      return NeuralNetworkSettings.create([10]);
    },

    encode: function (settings) {
      return { NodesPerIntermediateLayer: settings.NodesPerIntermediateLayer.slice() };
    },

    decode: function (json) {
      if (!json) return NeuralNetworkSettings.defaultSettings();
      if (typeof json === 'string') {
        json = JSON.parse(json);
      }
      var nodes = json.NodesPerIntermediateLayer;
      if (!nodes || !nodes.length) return NeuralNetworkSettings.defaultSettings();
      return NeuralNetworkSettings.create(
        nodes.map(function (n) {
          return Utils.clamp(Math.round(n), 1, NeuralNetworkSettings.MAX_NODES_PER_LAYER);
        })
      );
    },

    /** Serializes the settings the same way the original v3 save file does. */
    encodeString: function (settings) {
      return JSON.stringify(settings.NodesPerIntermediateLayer.slice(0, NeuralNetworkSettings.MAX_LAYERS));
    },

    decodeString: function (encoded) {
      if (!encoded) return NeuralNetworkSettings.defaultSettings();
      try {
        if (encoded.charAt(0) === '[') {
          return NeuralNetworkSettings.create(JSON.parse(encoded));
        }
        if (encoded.charAt(0) === '{') {
          return NeuralNetworkSettings.decode(JSON.parse(encoded));
        }
        // Legacy v1 format: "10#10#..."
        return NeuralNetworkSettings.create(
          encoded.split('#').map(function (value) {
            return parseInt(value, 10);
          })
        );
      } catch (e) {
        return NeuralNetworkSettings.defaultSettings();
      }
    },

    /** The number of intermediate layers, clamped to the maximum. */
    numberOfIntermediateLayers: function (settings) {
      return Math.min(settings.NodesPerIntermediateLayer.length, NeuralNetworkSettings.MAX_LAYERS);
    },
  };

  /* ------------------------------------------------------------------ *
   * FeedForwardNetwork
   * ------------------------------------------------------------------ */
  function FeedForwardNetwork(inputCount, outputCount, settings, chromosome) {
    var layerCount = NeuralNetworkSettings.numberOfIntermediateLayers(settings) + 2;
    this.layerSizes = new Array(layerCount);
    this.layerSizes[0] = inputCount;
    this.layerSizes[layerCount - 1] = outputCount;
    for (var i = 1; i < layerCount - 1; i++) {
      this.layerSizes[i] = settings.NodesPerIntermediateLayer[i - 1];
    }

    this.inputs = new Float64Array(inputCount);

    var weightCount = this.getTotalWeightCount();
    this.weightCount = weightCount;

    if (chromosome && chromosome.length >= weightCount && weightCount > 0) {
      this.weights = this.weightsFromFlatArray(chromosome);
    } else {
      this.weights = this.setupRandomWeights();
    }

    // Scratch buffers to avoid allocations in the hot loop.
    this.tempResults = [];
    for (var layer = 0; layer < this.weights.length; layer++) {
      this.tempResults.push(new Float64Array(this.layerSizes[layer + 1]));
    }
    this._outputBuffer = new Float64Array(outputCount);

  FeedForwardNetwork.MAX_WEIGHT = MAX_WEIGHT;

  FeedForwardNetwork.prototype.getTotalWeightCount = function () {
    var total = 0;
    for (var i = 0; i < this.layerSizes.length - 1; i++) {
      total += this.layerSizes[i] * this.layerSizes[i + 1];
    }
    return total;
  };

  FeedForwardNetwork.prototype.setupRandomWeights = function () {
    var weights = [];
    for (var i = 0; i < this.layerSizes.length - 1; i++) {
      var rows = this.layerSizes[i];
      var cols = this.layerSizes[i + 1];
      var matrix = new Float64Array(rows * cols);
      for (var index = 0; index < matrix.length; index++) {
        matrix[index] = Utils.randomRange(MIN_WEIGHT, MAX_WEIGHT);
      }
      weights.push(matrix);
    }
    return weights;
  };

  FeedForwardNetwork.prototype.weightsFromFlatArray = function (flat) {
    var weights = [];
    var offset = 0;
    for (var i = 0; i < this.layerSizes.length - 1; i++) {
      var count = this.layerSizes[i] * this.layerSizes[i + 1];
      var matrix = new Float64Array(count);
      for (var index = 0; index < count; index++) {
        matrix[index] = flat[offset + index] || 0;
      }
      offset += count;
      weights.push(matrix);
    }
    return weights;
  };

  /** Flattens the weights into a chromosome (row-major, layer by layer). */
  FeedForwardNetwork.prototype.toFloatArray = function () {
    var result = new Array(this.getTotalWeightCount());
    var index = 0;
    for (var layer = 0; layer < this.weights.length; layer++) {
      var matrix = this.weights[layer];
      for (var i = 0; i < matrix.length; i++) {
        result[index++] = matrix[i];
      }
    }
    return result;
  };

  FeedForwardNetwork.prototype.numberOfInputs = function () {
    return this.layerSizes[0];
  };

  FeedForwardNetwork.prototype.numberOfOutputs = function () {
    return this.layerSizes[this.layerSizes.length - 1];
  };

  /** The activations of the input layer. */
  FeedForwardNetwork.prototype.getInputs = function () {
    return this.inputs;
  };

  FeedForwardNetwork.prototype.calculateOutputs = function () {
    var result = this.inputs;
    for (var layer = 0; layer < this.weights.length; layer++) {
      var rows = this.layerSizes[layer];
      var cols = this.layerSizes[layer + 1];
      var matrix = this.weights[layer];
      var output = this.tempResults[layer];

      for (var col = 0; col < cols; col++) {
        var sum = 0;
        for (var row = 0; row < rows; row++) {
          sum += matrix[row * cols + col] * result[row];
        }
        // Sigmoid activation
        output[col] = 1 / (1 + Math.exp(-sum));
      }

      // The output of this layer is the input of the next one.
      result = output;
    }
    return result;
  };

  FeedForwardNetwork.sigmoid = function (x) {
    return 1 / (1 + Math.exp(-x));
  };

  /* --- Encoding helpers matching the original binary string format ------- */

  FeedForwardNetwork.prototype.toBinaryString = function () {
    if (this.numberOfOutputs() === 0) return '';
    var builder = '';
    var floats = this.toFloatArray();
    for (var i = 0; i < floats.length; i++) {
      builder += floatToBinaryString(floats[i]);
    }
    return builder;
  };

  FeedForwardNetwork.fromBinaryString = function (inputCount, outputCount, settings, encoded) {
    var size = 0;
    var layerSizes = [inputCount];
    var intermediates = NeuralNetworkSettings.numberOfIntermediateLayers(settings);
    for (var i = 0; i < intermediates; i++) {
      layerSizes.push(settings.NodesPerIntermediateLayer[i]);
    }
    layerSizes.push(outputCount);
    for (var l = 0; l < layerSizes.length - 1; l++) {
      size += layerSizes[l] * layerSizes[l + 1];
    }
    var floats = new Array(size);
    for (var index = 0; index < size; index++) {
      floats[index] = binaryStringToFloat(encoded.substr(index * 32, 32));
    }
    return new FeedForwardNetwork(inputCount, outputCount, settings, floats);
  };

  function floatToBinaryString(value) {
    var buffer = new ArrayBuffer(4);
    new DataView(buffer).setFloat32(0, value, true);
    var view = new Uint8Array(buffer);
    var result = '';
    for (var i = 0; i < 4; i++) {
      for (var bit = 7; bit >= 0; bit--) {
        result += (view[i] >> bit) & 1 ? '1' : '0';
      }
    }
    return result;
  }

  function binaryStringToFloat(binary) {
    if (!binary || binary.length < 32) return 0;
    var bytes = new Uint8Array(4);
    for (var i = 0; i < 4; i++) {
      bytes[i] = parseInt(binary.substr(i * 8, 8), 2) & 0xff;
    }
    return new DataView(bytes.buffer).getFloat32(0, true);
  }

  FeedForwardNetwork._floatToBinaryString = floatToBinaryString;
  FeedForwardNetwork._binaryStringToFloat = binaryStringToFloat;

  /** Populates an array with random weights (used to seed a population). */
  FeedForwardNetwork.populateRandomWeights = function (weights) {
    for (var i = 0; i < weights.length; i++) {
      weights[i] = Utils.randomRange(MIN_WEIGHT, MAX_WEIGHT);
    }
    return weights;
  };

  /**
   * Computes the length of a chromosome for the given layer configuration —
   * the port of Evolution.CalculateChromosomeLengthForBrainType.
   */
  FeedForwardNetwork.chromosomeLength = function (numberOfInputs, numberOfOutputs, settings) {
    var intermediates = NeuralNetworkSettings.numberOfIntermediateLayers(settings);
    var totalLayerCount = intermediates + 2;
    var total = 0;
    for (var i = 0; i < totalLayerCount - 1; i++) {
      var inputNodes = i === 0 ? numberOfInputs : settings.NodesPerIntermediateLayer[i - 1];
      var outputNodes = i === totalLayerCount - 2 ? numberOfOutputs : settings.NodesPerIntermediateLayer[i];
      total += inputNodes * outputNodes;
    }
    return total;
  };

  EVO.NeuralNetworkSettings = NeuralNetworkSettings;
  EVO.FeedForwardNetwork = FeedForwardNetwork;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = EVO;
  }
})(typeof window !== 'undefined' ? window : globalThis);

/*
 * Evolution (Web Edition) — core/algorithms.js
 * ---------------------------------------------------------------
 * Port of the evolutionary operators of the original Unity project:
 *   Assets/Scripts/Util/Mutation.cs
 *   Assets/Scripts/Util/Recombination.cs
 *   Assets/Scripts/Util/Selection.cs
 *   Assets/Scripts/Data/Objective.cs

(function (global) {
  'use strict';

  var EVO = (global.EVO = global.EVO || {});
  var Utils = EVO.Utils;
  var RandomPicker = EVO.RandomPicker;

  /* ------------------------------------------------------------------ *
   * Objectives (Data/Objective.cs)
   * ------------------------------------------------------------------ */
  var Objective = {
    Running: 0,
    Jumping: 1,
    ObstacleJump: 2,
    Climbing: 3,
    Flying: 4,
  };

  var ObjectiveUtil = {
    ALL_OBJECTIVES: [
      Objective.Running,
      Objective.Jumping,
      Objective.ObstacleJump,
      Objective.Climbing,
      Objective.Flying,
    ],

    stringRepresentation: function (objective) {
      switch (objective) {
        case Objective.Running:
          return 'Running';
        case Objective.Jumping:
          return 'Jumping';
        case Objective.ObstacleJump:
          return 'Obstacle Jump';
        case Objective.Climbing:
          return 'Climbing';
        case Objective.Flying:
          return 'Flying';
      }
      return 'Running';
    },

    objectiveFromString: function (string) {
      switch (String(string).toUpperCase()) {
        case 'RUNNING':
          return Objective.Running;
        case 'JUMPING':
          return Objective.Jumping;
        case 'OBSTACLE JUMP':
          return Objective.ObstacleJump;
        case 'CLIMBING':
          return Objective.Climbing;
        case 'FLYING':
          return Objective.Flying;
      }
      return Objective.Running;
    },

    getAllObjectiveNames: function () {
      return this.ALL_OBJECTIVES.map(this.stringRepresentation);
    },
  };

  /* ------------------------------------------------------------------ *
   * Mutation (Util/Mutation.cs)
   * ------------------------------------------------------------------ */
  var MutationAlgorithm = {
    /** Changes a random number of values at consecutive indices. */
    Chunk: 0,
    /** Changes the value at each index with a random probability. */
    Global: 1,
    /** Chooses a random start and end index and inverts the order of values inbetween. */
    Inversion: 2,
  };

  var mutationRandom = new EVO.GaussianPRNG();

  var Mutation = {
    /** Mutation of a single float value: nonlocal gaussian offset. */
    mutateValue: function (x) {
      return x + mutationRandom.next();
    },

    /** Mutation of a single binary character. */
    mutateChar: function (c) {
      if (c === '0') return '1';
      if (c === '1') return '0';
      throw new Error("Invalid input. Only '0' and '1' are supported");
    },

    /**
     * Mutates a float array in place and returns it.
     * The chromosome of a creature is the flattened list of all connection weights.
     */
    mutate: function (chromosome, mode) {
      switch (mode) {
        case MutationAlgorithm.Chunk:
          return this.mutateChunk(chromosome);
        case MutationAlgorithm.Inversion:
          return this.mutateInversion(chromosome);
        case MutationAlgorithm.Global:
        default:
          return this.mutateGlobal(chromosome);
      }
    },

    /**
     * Changes a contiguous chunk of 2-15 values at a random position.
     */
    mutateChunk: function (chromosome) {
      var length = chromosome.length;
      if (length === 0) return chromosome;

      var start = Utils.randomInt(0, length);
      var maxChunkLength = Utils.clamp(length - start, 1, 15);
      var chunkLength = Math.min(maxChunkLength, Utils.randomInt(2, 16));

      for (var i = start; i < start + chunkLength && i < length; i++) {
        chromosome[i] = this.mutateValue(chromosome[i]);
      }
      return chromosome;
    },

    /**
     * The value at each index is mutated with a 75% probability.
     */
    mutateGlobal: function (chromosome) {
      for (var i = 0; i < chromosome.length; i++) {
        if (Utils.randomInt(1, 100) > 25) {

        }
      }
      return chromosome;
    },

    /**
     * Inverts the order of a random subrange of the chromosome.
     */
    mutateInversion: function (chromosome) {
      var length = chromosome.length;
      if (length < 2) return chromosome;

      var start = Utils.randomInt(0, length);
      var end = Utils.randomInt(start, length);
      var mid = Math.floor((start + end) / 2);

      for (var i = start; i <= mid; i++) {
        var swapIndex = end - i + start;

   * Recombination (Util/Recombination.cs)
   * ------------------------------------------------------------------ */

  CreatureRecordingPlayer.prototype.updateInterpolatedValues = function () {
    var timestamps = this.movementData.sampleTimestamps;
    var count = timestamps.length;
    if (count === 0) return;

    var time = this.playbackTime;
    // The recording can be shorter than the simulation time — then we hold
    // the last sample, just like the original recording player does.
    if (time >= timestamps[count - 1]) {
      this.sampleAt(count - 1, 1, count - 1);
      return;
    }
    if (time <= timestamps[0]) {
      this.sampleAt(0, 0, 0);

/*
 * Evolution (Web Edition) — sim/physics.js
 * ---------------------------------------------------------------
 * A rigid body physics engine written for the 2D flatland world of
 * Evolution.  The original game used Unity's internal 3D physics engine
 * with everything constrained to the XY-plane (rigid bodies with Z-locked
 * constraints, hinge joints around the z-axis and spring joints as muscles).
 *
 * The web edition simulates the exact same model:
 *
 *   • "Joints" are spheres (here: circles) with a mass and a frictionless
 *     surface that collide with the static scene geometry.
 *   • "Bones" are rigid rods that keep the distance between their two
 *     joints constant (hinge joints in the original).
 *   • "Muscles" are springs between two bone centres (Unity's SpringJoint)
 *     plus an active force that contracts or expands the muscle.
 *
 * The solver is a position based (PBD) solver using substeps, which is very
 * stable for the stiff springs and rigid links that the creatures consist of.
 */
(function (global) {
  'use strict';

  var EVO = (global.EVO = global.EVO || {});
  var Utils = EVO.Utils;

  /* ------------------------------------------------------------------ *
   * Body — a point mass with a radius (a "Joint" in the game)
   * ------------------------------------------------------------------ */
  function PhysicsBody(options) {
    this.x = options.x || 0;
    this.y = options.y || 0;
    this.vx = 0;
    this.vy = 0;
    this._prevX = this.x;
    this._prevY = this.y;

    this.mass = options.mass === undefined ? 1 : options.mass;
    this.invMass = this.mass > 0 ? 1 / this.mass : 0;
    this.radius = options.radius === undefined ? 0.5 : options.radius;
    this.collides = options.collides !== false;
    this.friction = options.friction === undefined ? 1.0 : options.friction;
    this.fixed = false;

    // External force applied in the current substep.
    this.fx = 0;
    this.fy = 0;

    // Contact state for the brain inputs and the objective trackers.
    this.touchingGround = false;
    this.touchingObstacle = false;
    this.contactNormalX = 0;
    this.contactNormalY = 0;
    this.normalCorrection = 0;

    // Arbitrary payload of the owning creature.
    this.owner = null;
    this.index = 0;
  }

  PhysicsBody.prototype.addForce = function (fx, fy) {
    this.fx += fx;
    this.fy += fy;
  };

  /**
   * Applies a force at the given world position.  The body is a point mass,
   * so the offset only matters for the lever arm in 3D — in the 2D
   * simulation a rigid rod distributes the force equally onto both
   * endpoints, which is what `Creature` does explicitly.
   */
  PhysicsBody.prototype.addForceAtPosition = function (fx, fy, px, py) {
    this.addForce(fx, fy);
  };

  /* ------------------------------------------------------------------ *
   * Distance constraint (a "Bone")
   * ------------------------------------------------------------------ */
  function DistanceConstraint(a, b, restLength, stiffness) {
    this.a = a;
    this.b = b;
    this.restLength = restLength;
    this.stiffness = stiffness === undefined ? 1 : stiffness;
    this.enabled = true;
  }

  /* ------------------------------------------------------------------ *
   * Static geometry
   * ------------------------------------------------------------------ */
  function StaticBox(cx, cy, halfWidth, halfHeight, angle, options) {
    options = options || {};
    this.cx = cx;
    this.cy = cy;
    this.hx = halfWidth;
    this.hy = halfHeight;
    this.angle = angle || 0;
    this.cos = Math.cos(-this.angle);
    this.sin = Math.sin(-this.angle);
    this.tag = options.tag || 'Scenery';
    this.friction = options.friction === undefined ? 1.0 : options.friction;
    this.layer = options.layer || 'StaticForeground';
    var extent = Math.sqrt(this.hx * this.hx + this.hy * this.hy);
    this.boundingRadius = extent;
  }

  StaticBox.prototype.toLocal = function (px, py) {
    var dx = px - this.cx;
    var dy = py - this.cy;
    return {
      x: dx * this.cos - dy * this.sin,
      y: dx * this.sin + dy * this.cos,
    };
  };

  StaticBox.prototype.toWorldDirection = function (lx, ly) {
    // inverse of the rotation used in toLocal
    var c = Math.cos(this.angle);
    var s = Math.sin(this.angle);
    return { x: lx * c - ly * s, y: lx * s + ly * c };
  };

  /** Rotates a direction into the local frame (no translation). */
  StaticBox.prototype.toLocalDirection = function (dx, dy) {
    return {
      x: dx * this.cos - dy * this.sin,
      y: dx * this.sin + dy * this.cos,
    };
  };

  function StaticCircle(x, y, radius, options) {
    options = options || {};
    this.x = x;
    this.y = y;
    this.radius = radius;
    this.tag = options.tag || 'Obstacle';
    this.friction = options.friction === undefined ? 1.0 : options.friction;
    this.layer = options.layer || 'DynamicForeground';
  }

  /* ------------------------------------------------------------------ *
   * PhysicsWorld
   * ------------------------------------------------------------------ */
  function PhysicsWorld() {
    // The original game configures the physics scenes with a gravity of
    // -50 m/s² (see ScenePhysicsConfiguration.cs).  Scenes can override this.
    this.gravity = -50;
    this.bodies = [];
    this.constraints = [];
    this.staticBoxes = [];
    this.staticCircles = [];
    this.forceCallbacks = [];
    this.time = 0;
    // Optional cross-creature contacts are used by the shared ecosystem world.
    this.interCreatureCollisions = false;
    // Velocity damping (loss) per second; a very small value keeps the
    // simulation from gaining energy.
    this.linearDamping = 0.0;

    // Uniform grid broad phase for the static geometry.
    this.gridCellSize = 12;
    this.grid = new Map();
    this.hugeBoxes = [];
    this.hugeCircles = [];
    this.gridDirty = true;
    this._queryResult = [];
  }

  PhysicsWorld.prototype.addBody = function (options) {
    var body = new PhysicsBody(options);
    body.index = this.bodies.length;
    this.bodies.push(body);
    return body;
  };

  PhysicsWorld.prototype.removeBody = function (body) {
    var index = this.bodies.indexOf(body);
    if (index >= 0) this.bodies.splice(index, 1);
  };

  PhysicsWorld.prototype.addConstraint = function (a, b, restLength, stiffness) {
    var constraint = new DistanceConstraint(a, b, restLength, stiffness);
    this.constraints.push(constraint);
    return constraint;
  };

  PhysicsWorld.prototype.addBox = function (cx, cy, halfWidth, halfHeight, angle, options) {
    var box = new StaticBox(cx, cy, halfWidth, halfHeight, angle, options);
    this.staticBoxes.push(box);
    this.gridDirty = true;
    return box;
  };

  PhysicsWorld.prototype.addCircle = function (x, y, radius, options) {
    var circle = new StaticCircle(x, y, radius, options);
    this.staticCircles.push(circle);
    this.gridDirty = true;
    return circle;
  };

  PhysicsWorld.prototype.removeCircle = function (circle) {
    var index = this.staticCircles.indexOf(circle);
    if (index >= 0) {
      this.staticCircles.splice(index, 1);
      this.gridDirty = true;
    }
  };

  PhysicsWorld.prototype._gridKey = function (cx, cy) {
    return cx + ':' + cy;
  };

  /** Builds (or rebuilds) the uniform grid used for the static broad phase. */
  PhysicsWorld.prototype.rebuildGrid = function () {
    this.grid = new Map();
    this.hugeBoxes = [];
    this.hugeCircles = [];

    var cell = this.gridCellSize;
    for (var i = 0; i < this.staticBoxes.length; i++) {
      var box = this.staticBoxes[i];
      if (box.boundingRadius > 40) {
        this.hugeBoxes.push(box);
        continue;
      }
      var minX = Math.floor((box.cx - box.boundingRadius) / cell);
      var maxX = Math.floor((box.cx + box.boundingRadius) / cell);
      var minY = Math.floor((box.cy - box.boundingRadius) / cell);
      var maxY = Math.floor((box.cy + box.boundingRadius) / cell);
      for (var gx = minX; gx <= maxX; gx++) {
        for (var gy = minY; gy <= maxY; gy++) {
          var key = this._gridKey(gx, gy);
          var list = this.grid.get(key);
          if (!list) {
            list = [];
            this.grid.set(key, list);
          }
          list.push(box);
        }
      }
    }

    for (var c = 0; c < this.staticCircles.length; c++) {
      var circle = this.staticCircles[c];
      if (circle.radius > 40) {
        this.hugeCircles.push(circle);
        continue;
      }
      var key2 = this._gridKey(Math.floor(circle.x / cell), Math.floor(circle.y / cell));
      var list2 = this.grid.get(key2);
      if (!list2) {
        list2 = [];
        this.grid.set(key2, list2);
      }
      list2.push(circle);
    }

    this.gridDirty = false;
  };

  /**
   * Returns a reusable array with all static shapes that could touch a circle
   * at (x, y) with the given radius.
   */
  PhysicsWorld.prototype.queryStatic = function (x, y, radius) {
    if (this.gridDirty) this.rebuildGrid();
    var result = this._queryResult;
    result.length = 0;

    var cell = this.gridCellSize;
    var minX = Math.floor((x - radius) / cell);
    var maxX = Math.floor((x + radius) / cell);
    var minY = Math.floor((y - radius) / cell);
    var maxY = Math.floor((y + radius) / cell);

    for (var gx = minX; gx <= maxX; gx++) {
      for (var gy = minY; gy <= maxY; gy++) {
        var list = this.grid.get(this._gridKey(gx, gy));
        if (!list) continue;
        for (var i = 0; i < list.length; i++) {
          if (result.indexOf(list[i]) < 0) result.push(list[i]);
        }
      }
    }

    for (var h = 0; h < this.hugeBoxes.length; h++) {
      result.push(this.hugeBoxes[h]);
    }
    for (var hc = 0; hc < this.hugeCircles.length; hc++) {
      result.push(this.hugeCircles[hc]);
    }
    return result;
  };

  /**
   * Returns how deeply a circle at (x, y) with the given radius penetrates the
   * static geometry (0 when it does not overlap anything).  Used to place
   * creatures without spawning them inside the ground.
   */
  PhysicsWorld.prototype.staticPenetration = function (x, y, radius) {
    var candidates = this.queryStatic(x, y, radius);
    var deepest = 0;
    for (var i = 0; i < candidates.length; i++) {
      var candidate = candidates[i];
      if (candidate instanceof StaticBox) {
        var local = candidate.toLocal(x, y);
        var dx = Math.abs(local.x) - candidate.hx;
        var dy = Math.abs(local.y) - candidate.hy;
        if (dx <= 0 && dy <= 0) {
          // The centre is inside the box — the way out is the nearest side.
          var overlapX = -dx;
          var overlapY = -dy;
          var depth = Math.min(overlapX, overlapY) + radius;
          if (depth > deepest) deepest = depth;
        } else if (dx < 0 || dy < 0) {
          // Only one axis overlaps: the circle is beside the box.
          var distance = Math.sqrt(Math.max(dx, 0) * Math.max(dx, 0) + Math.max(dy, 0) * Math.max(dy, 0));
          var depth2 = radius - distance;
          if (depth2 > deepest) deepest = depth2;
        } else {
          var outsideDistance = Math.sqrt(dx * dx + dy * dy);
          var depth3 = radius - outsideDistance;
          if (depth3 > deepest) deepest = depth3;
        }
      } else {
        var cdx = x - candidate.x;
        var cdy = y - candidate.y;
        var minDistance = candidate.radius + radius;
        var distanceSq = cdx * cdx + cdy * cdy;
        if (distanceSq < minDistance * minDistance) {
          var depth4 = minDistance - Math.sqrt(distanceSq);
          if (depth4 > deepest) deepest = depth4;
        }
      }
    }
    return deepest;
  };

  PhysicsWorld.prototype.addForceCallback = function (callback) {
    this.forceCallbacks.push(callback);
  };

  PhysicsWorld.prototype.clear = function () {
    this.bodies.length = 0;
    this.constraints.length = 0;
    this.staticBoxes.length = 0;
    this.staticCircles.length = 0;
    this.forceCallbacks.length = 0;
    this.grid = new Map();
    this.hugeBoxes = [];
    this.hugeCircles = [];
    this.gridDirty = true;
  };

  PhysicsWorld.prototype.simulate = function (dt, substeps, iterations) {
    substeps = substeps || 3;
    iterations = iterations || 4;
    var subDt = dt / substeps;

    for (var substep = 0; substep < substeps; substep++) {
      this.simulateSubstep(subDt, iterations);
      this.time += subDt;
    }
  };

  PhysicsWorld.prototype.simulateSubstep = function (dt, iterations) {
    var bodies = this.bodies;
    var i, body;

    // --- 1. Apply all external forces -------------------------------
    for (i = 0; i < bodies.length; i++) {
      bodies[i].fx = 0;
      bodies[i].fy = 0;
    }
    for (i = 0; i < this.forceCallbacks.length; i++) {
      this.forceCallbacks[i](this, dt);
    }

    // --- 2. Integrate velocities and predict positions --------------
    var gravity = this.gravity;
    for (i = 0; i < bodies.length; i++) {
      body = bodies[i];
      if (body.fixed) {
        body._prevX = body.x;
        body._prevY = body.y;
        continue;
      }
      body.vx += (body.fx * body.invMass) * dt;
      body.vy += (gravity + body.fy * body.invMass) * dt;

      if (this.linearDamping > 0) {
        var damp = Math.max(0, 1 - this.linearDamping * dt);
        body.vx *= damp;
        body.vy *= damp;
      }

      body._prevX = body.x;
      body._prevY = body.y;
      body.x += body.vx * dt;
      body.y += body.vy * dt;

      body.touchingGround = false;
      body.touchingObstacle = false;
      body.contactNormalX = 0;
      body.contactNormalY = 0;
      body.normalCorrection = 0;
    }

    // --- 3. Solve constraints ---------------------------------------
    for (var iteration = 0; iteration < iterations; iteration++) {
      this.solveConstraints();
      if (this.interCreatureCollisions) this.solveInterCreatureCollisions(dt);
      this.solveCollisions(iteration === iterations - 1);
    }

    // --- 4. Derive velocities from the corrected positions ----------
    var invDt = 1 / dt;
    for (i = 0; i < bodies.length; i++) {
      body = bodies[i];
      if (body.fixed) {
        body.vx = 0;
        body.vy = 0;
        continue;
      }
      body.vx = (body.x - body._prevX) * invDt;
      body.vy = (body.y - body._prevY) * invDt;
      body._prevX = body.x;
      body._prevY = body.y;
    }
  };

  PhysicsWorld.prototype.solveConstraints = function () {
    var constraints = this.constraints;
    for (var i = 0; i < constraints.length; i++) {
      var constraint = constraints[i];
      if (!constraint.enabled) continue;

      var a = constraint.a;
      var b = constraint.b;
      var dx = b.x - a.x;
      var dy = b.y - a.y;
      var distance = Math.sqrt(dx * dx + dy * dy);
      if (distance < 1e-9) continue;

      var difference = (distance - constraint.restLength) / distance;
      var totalInvMass = a.invMass + b.invMass;
      if (totalInvMass <= 0) continue;

      var correction = difference * constraint.stiffness / totalInvMass;
      if (!a.fixed) {
        a.x += dx * correction * a.invMass;
        a.y += dy * correction * a.invMass;
      }
      if (!b.fixed) {
        b.x -= dx * correction * b.invMass;
        b.y -= dy * correction * b.invMass;
      }
    }
  };

  /** Resolves circle contacts between different creatures in an ecosystem. */
  PhysicsWorld.prototype.solveInterCreatureCollisions = function (dt) {
    var bodies = this.bodies;
    for (var i = 0; i < bodies.length; i++) {
      var a = bodies[i];
      if (!a.collides || !a.owner || a.fixed) continue;
      for (var j = i + 1; j < bodies.length; j++) {
        var b = bodies[j];
        if (!b.collides || !b.owner || b.fixed || a.owner === b.owner) continue;

        var invMassA = a.fixed ? 0 : a.invMass;
        var invMassB = b.fixed ? 0 : b.invMass;
        var totalInvMass = invMassA + invMassB;
        if (totalInvMass <= 0) continue;

        var dx = b.x - a.x;
        var dy = b.y - a.y;
        var minDistance = a.radius + b.radius;
        var distanceSq = dx * dx + dy * dy;
        if (distanceSq >= minDistance * minDistance) continue;

        var distance = Math.sqrt(distanceSq);
        var nx = distance > 1e-9 ? dx / distance : 1;
        var ny = distance > 1e-9 ? dy / distance : 0;
        var correction = (minDistance - distance) / totalInvMass;
        var correctionAX = nx * correction * invMassA;
        var correctionAY = ny * correction * invMassA;
        var correctionBX = nx * correction * invMassB;
        var correctionBY = ny * correction * invMassB;
        a.x -= correctionAX;
        a.y -= correctionAY;
        a._prevX -= correctionAX;
        a._prevY -= correctionAY;
        b.x += correctionBX;
        b.y += correctionBY;
        b._prevX += correctionBX;
        b._prevY += correctionBY;

        // Positional depenetration must not create artificial velocity. Also
        // remove the approaching component so two creatures cannot push
        // straight through one another at the next substep.
        if (dt > 0) {
          var relativeVelocityX = (b.x - b._prevX - (a.x - a._prevX)) / dt;
          var relativeVelocityY = (b.y - b._prevY - (a.y - a._prevY)) / dt;
          var approachingVelocity = relativeVelocityX * nx + relativeVelocityY * ny;
          if (approachingVelocity < 0) {
            var impulse = -approachingVelocity / totalInvMass;
            a._prevX += impulse * invMassA * nx * dt;
            a._prevY += impulse * invMassA * ny * dt;
            b._prevX -= impulse * invMassB * nx * dt;
            b._prevY -= impulse * invMassB * ny * dt;
          }
        }
      }
    }
  };

  /**
   * Resolves the collisions of all bodies with the static geometry.
   * `lastIteration` controls the friction pass (which is applied on the
   * accumulated normal corrections of this substep).
   */
  PhysicsWorld.prototype.solveCollisions = function (lastIteration) {
    var bodies = this.bodies;

    for (var i = 0; i < bodies.length; i++) {
      var body = bodies[i];
      if (body.fixed || !body.collides) continue;

      var candidates = this.queryStatic(body.x, body.y, body.radius);

      for (var b = 0; b < candidates.length; b++) {
        var candidate = candidates[b];
        if (candidate instanceof StaticBox) {
          var dxb = body.x - candidate.cx;
          var dyb = body.y - candidate.cy;
          var reach = candidate.boundingRadius + body.radius;
          if (dxb * dxb + dyb * dyb > reach * reach) continue;
          this.resolveBoxCollision(body, candidate);
        } else {
          var dxc = body.x - candidate.x;
          var dyc = body.y - candidate.y;
          var reachC = candidate.radius + body.radius;
          if (dxc * dxc + dyc * dyc > reachC * reachC) continue;
          this.resolveCircleCollision(body, candidate);
        }
      }

      // Friction: the tangential displacement of this substep is limited
      // by the Coulomb friction cone derived from the normal correction.
      if (lastIteration && body.normalCorrection > 0) {
        this.applyFriction(body);
      }
    }
  };

  PhysicsWorld.prototype.resolveBoxCollision = function (body, box) {
    var local = box.toLocal(body.x, body.y);
    var inside = Math.abs(local.x) <= box.hx && Math.abs(local.y) <= box.hy;

    var closestX, closestY, penetration, normalLocalX, normalLocalY;

    if (inside) {
      // Push out along the axis of the least penetration.
      var overlapX = box.hx - Math.abs(local.x);
      var overlapY = box.hy - Math.abs(local.y);
      if (overlapX < overlapY) {
        closestX = local.x < 0 ? -box.hx : box.hx;
        closestY = local.y;
        penetration = overlapX + body.radius;
        normalLocalX = local.x < 0 ? -1 : 1;
        normalLocalY = 0;
      } else {
        closestX = local.x;
        closestY = local.y < 0 ? -box.hy : box.hy;
        penetration = overlapY + body.radius;
        normalLocalX = 0;
        normalLocalY = local.y < 0 ? -1 : 1;
      }
    } else {
      closestX = Utils.clamp(local.x, -box.hx, box.hx);
      closestY = Utils.clamp(local.y, -box.hy, box.hy);
      var ddx = local.x - closestX;
      var ddy = local.y - closestY;
      var distanceSq = ddx * ddx + ddy * ddy;
      if (distanceSq > body.radius * body.radius) return;
      var distance = Math.sqrt(distanceSq);
      penetration = body.radius - distance;
      if (distance > 1e-9) {
        normalLocalX = ddx / distance;
        normalLocalY = ddy / distance;
      } else {
        normalLocalX = 0;
        normalLocalY = 1;
      }
    }

    if (penetration <= 0) return;

    var normal = box.toWorldDirection(normalLocalX, normalLocalY);
    body.x += normal.x * penetration;
    body.y += normal.y * penetration;

    body.contactNormalX += normal.x * penetration;
    body.contactNormalY += normal.y * penetration;
    body.normalCorrection += penetration;
    this.registerContact(body, box.tag, box.friction);
  };

  PhysicsWorld.prototype.resolveCircleCollision = function (body, circle) {
    var dx = body.x - circle.x;
    var dy = body.y - circle.y;
    var distance = Math.sqrt(dx * dx + dy * dy);
    var minDistance = circle.radius + body.radius;
    if (distance >= minDistance) return;

    var penetration = minDistance - distance;
    var nx, ny;
    if (distance > 1e-9) {
      nx = dx / distance;
      ny = dy / distance;
    } else {
      nx = 0;
      ny = 1;
    }

    body.x += nx * penetration;
    body.y += ny * penetration;

    body.contactNormalX += nx * penetration;
    body.contactNormalY += ny * penetration;
    body.normalCorrection += penetration;
    this.registerContact(body, circle.tag, circle.friction);
  };

  PhysicsWorld.prototype.registerContact = function (body, tag, friction) {
    if (tag === 'Ground' || tag === 'StaticForeground') {
      body.touchingGround = true;
    } else {
      body.touchingObstacle = true;
    }
    if (body.frictionOverride !== undefined && body.frictionOverride !== null) {
      friction = body.frictionOverride;
    }
    body.contactFriction = friction;
  };

  PhysicsWorld.prototype.applyFriction = function (body) {
    var correctionLength = Math.sqrt(
      body.contactNormalX * body.contactNormalX + body.contactNormalY * body.contactNormalY
    );
    if (correctionLength < 1e-12) return;

    var nx = body.contactNormalX / correctionLength;
    var ny = body.contactNormalY / correctionLength;

    var dx = body.x - body._prevX;
    var dy = body.y - body._prevY;
    var normalDisplacement = dx * nx + dy * ny;

    var tangentX = dx - normalDisplacement * nx;
    var tangentY = dy - normalDisplacement * ny;
    var tangentLength = Math.sqrt(tangentX * tangentX + tangentY * tangentY);
    if (tangentLength < 1e-12) return;

    var friction = body.contactFriction === undefined ? 1.0 : body.contactFriction;
    var maxTangent = Math.max(0, friction) * body.normalCorrection * 1.5;
    // Static friction cancels low-speed slip entirely; kinetic friction removes
    // at most the available tangential correction. Leaving the low-speed
    // displacement untouched creates a terminal slide that never comes to rest.
    var remainingTangent = Math.max(0, tangentLength - maxTangent);
    var scale = remainingTangent / tangentLength;
    var newTangentX = tangentX * scale;
    var newTangentY = tangentY * scale;

    body.x = body._prevX + normalDisplacement * nx + newTangentX;
    body.y = body._prevY + normalDisplacement * ny + newTangentY;
  };

  /* ------------------------------------------------------------------ *
   * Raycasting — used by the universal brain
   * ------------------------------------------------------------------ */
  PhysicsWorld.prototype.raycast = function (ox, oy, dx, dy, maxDistance, mask) {
    var length = Math.sqrt(dx * dx + dy * dy);
    if (length < 1e-9) return null;
    dx /= length;
    dy /= length;
    if (maxDistance === undefined || maxDistance === null) maxDistance = Infinity;

    var best = null;

    var includeStatic = mask === undefined || mask === null || mask.indexOf('static') >= 0;
    var includeObstacles = mask === undefined || mask === null || mask.indexOf('obstacle') >= 0;

    var limit = maxDistance === Infinity ? 1e9 : maxDistance;

    if (includeStatic) {
      for (var i = 0; i < this.staticBoxes.length; i++) {
        var box = this.staticBoxes[i];
        // Axis aligned bounding box reject of the ray segment.
        if (!segmentIntersectsAABB(ox, oy, dx * limit, dy * limit, box)) continue;
        var hit = this.raycastBox(box, ox, oy, dx, dy, maxDistance);
        if (hit && (!best || hit.distance < best.distance)) best = hit;
      }
    }

    if (includeObstacles) {
      for (var c = 0; c < this.staticCircles.length; c++) {
        var circle = this.staticCircles[c];
        if (
          !segmentIntersectsCircleAABB(ox, oy, dx * limit, dy * limit, circle.x, circle.y, circle.radius)
        ) {
          continue;
        }
        var hitCircle = this.raycastCircle(circle, ox, oy, dx, dy, maxDistance);
        if (hitCircle && (!best || hitCircle.distance < best.distance)) best = hitCircle;
      }
    }

    return best;
  };

  PhysicsWorld.prototype.raycastBox = function (box, ox, oy, dx, dy, maxDistance) {
    var localOrigin = box.toLocal(ox, oy);
    var localDirection = box.toLocalDirection(dx, dy);

    var tmin = 0;
    var tmax = maxDistance;

    var axes = [
      { o: localOrigin.x, d: localDirection.x, h: box.hx },
      { o: localOrigin.y, d: localDirection.y, h: box.hy },
    ];

    for (var i = 0; i < 2; i++) {
      var axis = axes[i];
      if (Math.abs(axis.d) < 1e-9) {
        if (axis.o < -axis.h || axis.o > axis.h) return null;
      } else {
        var t1 = (-axis.h - axis.o) / axis.d;
        var t2 = (axis.h - axis.o) / axis.d;
        if (t1 > t2) {
          var temp = t1;
          t1 = t2;
          t2 = temp;
        }
        if (t1 > tmin) tmin = t1;
        if (t2 < tmax) tmax = t2;
        if (tmin > tmax) return null;
      }
    }

    if (tmin < 0 || tmin > maxDistance) return null;

    var localPointX = localOrigin.x + localDirection.x * tmin;
    var localPointY = localOrigin.y + localDirection.y * tmin;
    var insideX = Math.abs(Math.abs(localPointX) - box.hx) < 1e-6;
    var normalLocalX = insideX ? (localPointX < 0 ? -1 : 1) : 0;
    var normalLocalY = insideX ? 0 : localPointY < 0 ? -1 : 1;
    var normal = box.toWorldDirection(normalLocalX, normalLocalY);

    return {
      distance: tmin,
      x: ox + dx * tmin,
      y: oy + dy * tmin,
      normalX: normal.x,
      normalY: normal.y,
      tag: box.tag,
      shape: box,
    };
  };

  PhysicsWorld.prototype.raycastCircle = function (circle, ox, oy, dx, dy, maxDistance) {
    var mx = ox - circle.x;
    var my = oy - circle.y;
    var b = mx * dx + my * dy;
    var c = mx * mx + my * my - circle.radius * circle.radius;
    if (c > 0 && b > 0) return null;
    var disc = b * b - c;
    if (disc < 0) return null;
    var t = -b - Math.sqrt(disc);
    if (t < 0) t = -b + Math.sqrt(disc);
    if (t < 0 || t > maxDistance) return null;
    var px = ox + dx * t;
    var py = oy + dy * t;
    var nx = px - circle.x;
    var ny = py - circle.y;
    var len = Math.sqrt(nx * nx + ny * ny);
    if (len > 1e-9) {
      nx /= len;
      ny /= len;

 *   Assets/Scripts/Creature/Creature.cs
 *   Assets/Scripts/Creature/Body/Joint.cs
 *   Assets/Scripts/Creature/Body/Bone.cs
 *   Assets/Scripts/Creature/Body/Muscle.cs
 *   Assets/Scripts/Controllers/CreatureBuilder.cs

    this.joints = [];
    this.bones = [];
    this.muscles = [];
    this.decorations = [];
    this.brain = null;
    this.alive = false;
    this.usesLegacyRotationCalculation = false;
    this.initialPosition = { x: 0, y: 0 };
    this.maxJumpingHeight = 0;
    this.simulationTimeOverride = 0;
    this.jointIdsWithPenalty = Object.create(null);
    this.containsPenaltyJoints = false;
    this.recordingPlayer = null;
    this.recorder = null;
    this.creatureIndex = options.creatureIndex || 0;
    this.visible = true;
    this.opacity = 1;
    this.wingSpriteVisible = false;
    this.currentTime = 0;
    this.objectiveTracker = null;
    this.scene = options.scene || null;

    // to flap while they are airborne or falling. Can be disabled per
    // creature (the simulation HUD exposes a global toggle).
    this.autoFlap = options.autoFlap !== false;
    this.flapPhase = 0;
    this.flapHold = 0;

    // its brain and reflexes stop, its muscles relax and its motion decays,
    // interrupting whatever it was doing.
    this.shockTimer = 0;

    this._buildBones();
    this._buildMuscles();
    this._buildDecorations();

  Creature.JOINT_RADIUS = JOINT_RADIUS;
  Creature.CONNECTION_WIDTH = CONNECTION_WIDTH;
  Creature.MUSCLE_SPRING_STRENGTH = MUSCLE_SPRING_STRENGTH;
  Creature.MAX_MUSCLE_FORCE = MAX_MUSCLE_FORCE;
  // Game-scale 2D wing tuning. Area is wing length × editable chord width;
  // the force scale can be calibrated without changing creature mass units.
  Creature.WING_AIR_DENSITY = 1.0;
  Creature.WING_FORCE_SCALE = 36.0;
  Creature.WING_DRAG_COEFFICIENT = 0.9;
  Creature.WING_MAX_LIFT_COEFFICIENT = 1.2;
  Creature.WING_FLAP_LIFT_COEFFICIENT = 0.75;
  Creature.WING_MAX_FORCE = 1800;
  Creature.WING_MIN_SPEED = 0.1;
  // Muscles attach to the centre of the simplified two-point bones. Give a
  // wing-connected muscle a bounded opposing endpoint force as well, so it
  // can actually rotate the wing through a powered downstroke/upstroke.
  Creature.WING_STROKE_TORQUE_SCALE = 0.08;
  Creature.WING_MAX_STROKE_FORCE = 220;
  Creature.WING_AERO_CENTER_FRACTION = 0.72;
  Creature.WING_MAX_ANGLE_OF_ATTACK = 80 * Utils.Deg2Rad;
