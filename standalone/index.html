    refreshSimulationPauseButton: function () {
      var button = this.pauseButton;
      if (!button) return;

      var available = this.state === 'simulating' && !!this.evolution;
      var paused = available && !!this.evolution.paused;
      button.classList.toggle('hidden', !available);
      button.classList.toggle('primary', paused);
      button.textContent = paused ? 'Resume' : 'Pause';
      button.title = paused ? 'Resume the simulation' : 'Pause the simulation';
      button.setAttribute('aria-label', paused ? 'Resume simulation' : 'Pause simulation');
    },

    refreshShockButton: function () {
      var button = this.shockButton;
      if (!button) return;
      var available =
        this.state === 'simulating' && !!this.evolution && !this.evolution.paused;
      button.classList.toggle('hidden', !available);
    },

    /** Startles the whole current batch, stopping each creature mid-action. */
    shockCreatures: function () {
      if (this.state !== 'simulating' || !this.evolution || this.evolution.paused) return;
      this.evolution.shock();
    },

    /** Toggles the built-in wing reflex for current and future creatures. */
    setAutoFlap: function (enabled) {
      enabled = !!enabled;
      if (Settings) Settings.AutoFlapEnabled = enabled;
      if (this.evolution) {
        this.evolution.currentCreatureBatch.forEach(function (creature) {
          creature.autoFlap = enabled;
          if (!enabled) {
            creature.flapPhase = 0;
            creature.flapHold = 0;
          }
        });
      }
      this.refreshHud();
    },

    exitSimulation: function () {
      App.show('home');
    },

    setSkipRecap: function (skip) {
      this.skipRecap = !!skip;
      if (Settings) Settings.SkipGenerationRecap = this.skipRecap;
      // Turning the option on during a recap skips the current recap too.
      if (this.skipRecap && this.state === 'playback') {
        this.continueToNextGeneration();
      } else {
        this.refreshHud();
      }
    },

    setSettingsVisible: function (visible) {
      this.settingsVisible = !!visible;
      if (this.settingsDrawer) {
        this.settingsDrawer.classList.toggle('hidden', !this.settingsVisible);
      }
    },

    handleSettingsOutsideClick: function (event) {
      if (!this.settingsVisible) return;
      var target = event && event.target;
      if (
        (target && this.settingsDrawer && this.settingsDrawer.contains(target)) ||
        (target && this.settingsButton && this.settingsButton.contains(target))
      ) {
        return;
      }
      this.setSettingsVisible(false);
    },

    buildSettingsDrawer: function (element) {
      var self = this;
      this.settingsDrawer = UI.el('div', 'settings-drawer hidden');
      this.settingsDrawer.appendChild(UI.el('div', 'drawer-title', 'Simulation settings'));
      this.simulationSettingsPanel = EVO.SimulationSettingsPanel.create(
        this.settings,
        this.networkSettings,
        function (settings, networkSettings) {
          self.settings = settings;
          self.networkSettings = networkSettings;
          if (self.evolution) {
            self.evolution.SettingsForNextGeneration = settings;
            self.evolution.NetworkSettingsForNextGeneration = networkSettings;
            self.evolution.SceneDescriptionForNextGeneration =
              EVO.DefaultSimulationScenes.defaultSceneForObjective(settings.Objective);
            if (self.evolution.playbackPending) self.evolution.reconfigurePendingGeneration();
          }
          self.refreshHud();
          self.saveStateToSettings();
        }
      );
      this.settingsDrawer.appendChild(this.simulationSettingsPanel);
      this.settingsDrawer.appendChild(
        UI.el(
          'p',
          'panel-note',
          'Changes apply from the next generation onwards. The scene is rebuilt for every batch.'
        )
      );
      element.appendChild(this.settingsDrawer);
    },

    /* ================================================================ *
     * Simulation control
     * ================================================================ */
    createCameras: function () {
      var controlPoints = this.data.SceneDescription
        ? this.data.SceneDescription.CameraControlPoints
        : [];
      // The tracked camera follows the creatures; the render camera is the
      // screen space projection that the 2D renderer draws with.
      this.trackedCamera = new EVO.TrackedCamera({
        orthographicSize: 12.24,
        controlPoints: controlPoints,
      });
      this.camera = new EVO.Camera({ orthographicSize: 12.24 });
    },

    startSimulation: function () {
      var self = this;
      this.evolution = new EVO.Evolution({
        data: this.data,
        onEvent: function (name, payload) {
          if (name === 'newGenerationDidBegin') {
            self.onGenerationBegin(payload);
          } else if (name === 'generationDidEnd') {
            self.onGenerationEnd(payload);
          } else if (name === 'newBatchDidBegin') {
            self.onBatchBegin(payload);
          }
        },
      });
      // The settings drawer was built just before the evolution engine. Keep
      // its models as the editable next-generation settings, while the engine
      // snapshots an independent active copy as soon as start() begins.
      Object.assign(this.settings, this.evolution.SettingsForNextGeneration);
      Object.assign(this.networkSettings, this.evolution.NetworkSettingsForNextGeneration);
      this.evolution.SettingsForNextGeneration = this.settings;
      this.evolution.NetworkSettingsForNextGeneration = this.networkSettings;

      this.evolution.start();
      this.refreshHud();
    },

    onGenerationBegin: function (generation) {
      this.currentGeneration = generation;
      if (this.awaitingPlayback) {
        // The next population is already prepared, but playback remains visible.
        this.awaitingPlayback = false;
        this.flushPendingAutosave();
        this.refreshHud();
        return;
      }
      if (this.pendingAutosaveGeneration !== null && this.pendingAutosaveGeneration !== undefined) {
        this.flushPendingAutosave();
        // In skip-recap mode the engine has already prepared the next
        // population, so release the completed generation immediately.
        if (this.evolution) {
          this.evolution.playbackPending = false;
          this.evolution.completedSolutions = null;
        }
      }
      this.syncCameraControlPoints();
      this.state = 'simulating';
      this.playback = null;
      this.playbackPlaying = true;
      this.playbackTime = 0;
      this.refreshHud();
    },

    syncCameraControlPoints: function () {
      if (!this.trackedCamera) return;
      var description = this.evolution && this.evolution.SceneDescription;
      this.trackedCamera.controlPoints =
        description && description.CameraControlPoints ? description.CameraControlPoints : [];
      this.trackedCamera.lastControlSegmentIndex = 0;
    },

    onBatchBegin: function () {
      this.watchingIndex = 0;
      this.resetCamera();
    },

    onGenerationEnd: function (payload) {
      this.pendingAutosaveGeneration = payload.generation;
      this.playbackGeneration = payload.generation;
      this.playbackObjective = this.evolution.Settings.Objective;
      this.recording = payload.recording;
      this.evolvedChromosome =
        payload.best && payload.best.chromosome ? payload.best.chromosome : null;
      this.bestStats = payload.best ? payload.best.stats : null;
      this.ghost = payload.recording ? new EVO.PlaybackCreature(payload.recording) : null;
      this.ghostTime = 0;

      var generation = payload.generation;
      this.thumbnailCaption.textContent = 'GENERATION ' + generation;
      this.recordingLabel.textContent =
        'GEN ' + generation + (this.bestStats ? ' · ' + percent(this.bestStats.fitness) : '');

      if (this.skipRecap) {
        // Keep the champion as the next generation's comparison ghost, but
        // don't pause evolution or enter the recap/playback state.
        this.awaitingPlayback = false;
        this.state = 'simulating';
        this.playbackScene = null;
        this.playbackTarget = null;
        this.playback = null;
        this.playbackPlaying = false;
        this.playbackFinished = false;
        this.playbackTime = 0;
        this.playbackDuration = 0;
        this.waitTimer = 0;
        this.refreshHud();
        this.refreshStats();
        return;
      }

      this.awaitingPlayback = true;
      // Rebuild a clean render scene from the completed generation's descriptor.
      // The live scene may contain obstacles at their end-of-batch positions.
      this.playbackScene = new EVO.Scene(new EVO.PhysicsWorld(), this.evolution.SceneDescription);
      this.evolution.pause();
      this.state = 'playback';
      this.playbackFinished = false;

      if (payload.recording) {
        this.playback = new EVO.PlaybackCreature(payload.recording);
        this.playback.seek(0);
        this.playbackDuration = Math.max(0.1, this.playback.getDuration());
        this.playbackTime = 0;
        this.playbackPlaying = true;
        this.waitTimer = 1.2;
        this.playback.seek(0);
      } else {
        this.playback = null;
        this.playbackPlaying = false;
        this.playbackTime = 0;
        this.playbackDuration = 0;
      }

      this.refreshHud();
      this.refreshStats();

      if (!this.playback) {
        // Nothing to play back — continue straight away.
        this.waitTimer = this.autoplay ? 0.4 : 0;
      }
    },

    togglePlayback: function () {
      if (this.state === 'simulating') {
        if (this.evolution.paused) this.evolution.resume();
        else this.evolution.pause();
        this.refreshHud();
        return;
      }
      if (!this.playback) {
        this.continueToNextGeneration();
        return;
      }
      if (this.playbackPlaying) {
        this.playbackPlaying = false;
      } else {
        if (this.playbackTime >= this.playbackDuration - 0.001) {
          this.playbackTime = 0;
          this.playbackFinished = false;
        }
        this.playbackPlaying = true;
      }
      this.refreshHud();
    },

    continueToNextGeneration: function () {
      this.waitTimer = 0;
      this.playbackPlaying = false;
      this.playbackFinished = false;
      this.playback = null;
      this.playbackTarget = null;
      this.playbackScene = null;
      this.watchingIndex = 0;
      this.state = 'simulating';
      this.syncCameraControlPoints();
      this.resetCamera();
      if (this.evolution) {
        this.evolution.playbackPending = false;
        this.evolution.completedSolutions = null;
        this.evolution.resume();
      }
      this.refreshHud();
    },

    pauseSimulation: function () {
      this.togglePlayback();
    },

    resetCamera: function () {
      this.trackedCamera.freeX = null;
      this.trackedCamera.freeY = null;
      this.trackedCamera.orthographicSize = this.trackedCamera.initialZoom;
    },

    ensureFreeCamera: function () {
      if (this.trackedCamera.freeX === null || this.trackedCamera.freeX === undefined) {
        this.trackedCamera.freeX = this.trackedCamera.x;
        this.trackedCamera.freeY = this.trackedCamera.y;
      }
    },

    panCameraByScreenDelta: function (dx, dy) {
      this.ensureFreeCamera();
      var height = this.camera ? this.camera.height : 0;
      var pixelsPerUnit = height / (2 * this.trackedCamera.orthographicSize);
      if (!isFinite(pixelsPerUnit) || pixelsPerUnit <= 0) {
        pixelsPerUnit = this.camera.pixelsPerUnit();
      }
      this.trackedCamera.freeX -= dx / pixelsPerUnit;
      this.trackedCamera.freeY += dy / pixelsPerUnit;
    },

    batchElapsed: function () {
      return this.evolution ? this.evolution.batchElapsed : 0;
    },

    /* ================================================================ *
     * Main loop
     * ================================================================ */
    loop: function () {
      var self = this;
      var lastTime = performance.now ? performance.now() : Date.now();

      var step = function (now) {
        var dt = Math.min(0.1, (now - lastTime) / 1000 || 0);
        lastTime = now;
        self.update(dt);
        self.draw();
        self.animationFrame = global.requestAnimationFrame(step);
      };
      this.animationFrame = global.requestAnimationFrame(step);
    },

    update: function (dt) {
      if (!this.evolution) return;
      var scaled = dt * this.speed;

      if (this.state === 'simulating') {
        this.ghostTime += scaled;
        this.evolution.update(scaled);
      } else if (this.state === 'playback') {
        if (this.waitTimer > 0) {
          // A short pause before the playback starts (and after it ends).
          this.waitTimer = Math.max(0, this.waitTimer - dt);
        } else if (!this.playback) {
          if (this.autoplay) this.continueToNextGeneration();
        } else if (this.playbackPlaying) {
          this.playbackTime += scaled;
          if (this.playbackTime >= this.playbackDuration) {
            this.playbackTime = this.playbackDuration;
            this.playbackPlaying = false;
            this.playbackFinished = true;
            this.waitTimer = this.autoplay ? 1.0 : 0;
          }
          this.playback.seek(this.playbackTime);
        } else if (this.playbackFinished && this.autoplay) {
          this.continueToNextGeneration();
        }
      }

      this.updateFlightDiagnostics();
      this.refreshTimeLabels();
    },

    draw: function () {
      var ctx = this.canvas.getContext('2d');
      if (!ctx) return;
      var ratio = this.pixelRatio || 1;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

      Renderer.drawBackground(ctx, this.camera);

      var activeObjective =
        this.state === 'playback'
          ? this.playbackObjective
          : this.evolution.Settings.Objective;
      var gridVisibility =
        activeObjective === EVO.Objective.Flying
          ? Settings.FlyingGridVisibility
          : Settings.DefaultGridVisibility;
      Renderer.drawGrid(ctx, this.camera, gridVisibility, Settings.GridSize || 1);

      // Camera target
      var target = null;
      if (this.state === 'playback' && this.playback) {
        if (!this.playbackTarget) {
          var self = this;
          this.playbackTarget = {
            getXPosition: function () {
              return self.playbackCenter().x;
            },
            getYPosition: function () {
              return self.playbackCenter().y;
            },
          };
        }
        target = this.playbackTarget;
      } else {
        target = this.evolution.getWatchingCreature(this.watchingIndex);
      }
      if (target) {
        this.trackedCamera.target = target;
      }
      this.trackedCamera.update();
      this.camera.x = this.trackedCamera.x;
      this.camera.y = this.trackedCamera.y;
      this.camera.orthographicSize = this.trackedCamera.orthographicSize;

      // Playback must keep the just-finished generation's scene visible; the
      // evolution engine prepares the next scene while the recording plays.
      var scene =
        this.state === 'playback' && this.playbackScene ? this.playbackScene : this.evolution.scene;
      // Recreate the same open-ended obstacle course while a recording is
      // playing, otherwise a champion that clears the initial stretch appears
      // to run through empty space in its recap.
      if (
        scene &&
        this.state === 'playback' &&
        this.playback &&
        scene.extendObstacleBlocksAhead
      ) {
        var playbackLeadingX = -Infinity;
        (this.playback.joints || []).forEach(function (joint) {
          playbackLeadingX = Math.max(playbackLeadingX, joint.x);
        });
        scene.extendObstacleBlocksAhead(playbackLeadingX);
      }
      if (scene) {
        Renderer.drawScene(ctx, scene, this.camera);
        Renderer.drawDistanceMarkers(ctx, scene, this.camera);
      }

      // Creatures
      if (this.state === 'playback' && this.playback) {
        Renderer.drawPlaybackCreature(ctx, this.playback, this.camera, {
          opacity: 1,
          showMuscles: Settings.ShowMuscles,
          showContraction: Settings.ShowMuscleContraction,
        });
      } else {
        this.drawCreaturePopulation(ctx);
      }

      this.frameCount++;
      if (this.frameCount % 4 === 0) {
        this.drawThumbnail();
      }
    },

    drawCreaturePopulation: function (ctx) {
      var hasPreviousBest =
        this.state === 'simulating' && this.ghost && this.ghost.getDuration() > 0;
      var focusPreviousBest = !this.showAllCreatures && hasPreviousBest;
      var batch = this.evolution.currentCreatureBatch || [];
      var ghostOpacity = Settings.HiddenCreatureOpacity;

      if (hasPreviousBest && !focusPreviousBest) {
        this.ghost.seek(this.ghostTime % Math.max(0.001, this.ghost.getDuration()));
        Renderer.drawPlaybackCreature(ctx, this.ghost, this.camera, {
          opacity: ghostOpacity,
          showMuscles: Settings.ShowMuscles,
          showContraction: Settings.ShowMuscleContraction,
        });
      }

      for (var i = 0; i < batch.length; i++) {
        var watched = i === this.watchingIndex;
        var opacity;
        if (this.showAllCreatures) {
          opacity = 1;
        } else if (focusPreviousBest) {
          // Fade the evaluated population so the former generation's champion
          // can be inspected without the silhouettes blending together.
          opacity = ghostOpacity;
        } else {
          opacity = watched ? 1 : ghostOpacity;
        }
        Renderer.drawCreature(ctx, batch[i], this.camera, {
          opacity: opacity,
          showMuscles: Settings.ShowMuscles,
          showContraction: Settings.ShowMuscleContraction,
          showWingDebug: this.showFlightDebug && watched,
        });
      }

      if (focusPreviousBest) {
        this.ghost.seek(this.ghostTime % Math.max(0.001, this.ghost.getDuration()));
        // Draw last at full opacity: Visibility now brings the previous
        // generation's best creature to the foreground.
        Renderer.drawPlaybackCreature(ctx, this.ghost, this.camera, {
          opacity: 1,
          highlight: true,
          showMuscles: Settings.ShowMuscles,
          showContraction: Settings.ShowMuscleContraction,
        });
      }
    },

    playbackCenter: function () {
      var joints = this.playback.joints;
      var x = 0,
        y = 0;
      for (var i = 0; i < joints.length; i++) {
        x += joints[i].x;
        y += joints[i].y;
      }
      return { x: x / joints.length, y: y / joints.length };
    },

    drawThumbnail: function () {
      if (!this.thumbnailCanvas) return;
      var ctx = this.thumbnailCanvas.getContext('2d');
      if (!ctx) return;
      var ratio = this.pixelRatio || 1;
      var size = this.thumbnailCanvas.width / ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, size, size);

      var creature = this.playback;
      if (!creature && this.ghost) creature = this.ghost;
      if (!creature) {
        ctx.fillStyle = Renderer.COLORS.background;
        ctx.fillRect(0, 0, size, size);
        return;
      }

      var bounds = creature.getBounds();
      var padding = 1.6;
      var width = Math.max(1, bounds.maxX - bounds.minX) + padding * 2;
      var height = Math.max(1, bounds.maxY - bounds.minY) + padding * 2;
      var ortho = Math.max(width, height) / 2;
      var camera = {
        x: (bounds.minX + bounds.maxX) / 2,
        y: (bounds.minY + bounds.maxY) / 2,
        width: size,
        height: size,
        orthographicSize: ortho,
      };
      camera.pixelsPerUnit = function () {
        return this.height / (2 * this.orthographicSize);
      };
      camera.worldToScreenX = function (x) {
        return (x - this.x) * this.pixelsPerUnit() + this.width / 2;
      };
      camera.worldToScreenY = function (y) {
        return this.height / 2 - (y - this.y) * this.pixelsPerUnit();
      };
      camera.visibleBounds = function () {
        var hw = this.width / 2 / this.pixelsPerUnit();
        var hh = this.height / 2 / this.pixelsPerUnit();
        return { minX: this.x - hw, maxX: this.x + hw, minY: this.y - hh, maxY: this.y + hh };
      };

      ctx.save();
      ctx.fillStyle = '#2c2c2c';
      ctx.fillRect(0, 0, size, size);
      Renderer.drawPlaybackCreature(ctx, creature, camera, {
        opacity: 1,
        showMuscles: Settings.ShowMuscles,
        showContraction: Settings.ShowMuscleContraction,
      });
      ctx.restore();
    },

    /* ================================================================ *
     * HUD
     * ================================================================ */
    refreshHud: function () {
      if (!this.generationLabel) return;
      var generation =
        this.state === 'playback' && this.playbackGeneration !== null
          ? this.playbackGeneration
          : this.currentGeneration || (this.evolution ? this.evolution.currentGenerationNumber : 1);
      this.generationLabel.textContent = 'GENERATION ' + generation;
      var activeObjective =
        this.state === 'playback'
          ? this.playbackObjective
          : this.evolution && this.evolution.Settings
            ? this.evolution.Settings.Objective
            : this.settings.Objective;
      this.taskLabel.textContent = objectiveName(activeObjective);
      var isFlyingTask = !!EVO.Objective && activeObjective === EVO.Objective.Flying;
      if (this.flightDebugToggle) {
        this.flightDebugToggle.classList.toggle('hidden', !isFlyingTask);
        this.flightDebugToggle.classList.toggle('active', !!this.showFlightDebug);
        this.flightDebugToggle.textContent = this.showFlightDebug ? 'Wing Debug: On' : 'Wing Debug';
        this.flightDebugToggle.setAttribute(
          'aria-pressed',
          this.showFlightDebug ? 'true' : 'false'
        );
      }
      if (this.flightDebugPanel) {
        this.flightDebugPanel.classList.toggle(
          'hidden',
          !isFlyingTask || !this.showFlightDebug || this.state !== 'simulating'
        );
        this.updateFlightDiagnostics();
      }

      var fitness = this.currentFitness();
      this.fitnessLabel.textContent = 'FITNESS: ' + percent(fitness);

      var paused = this.evolution ? this.evolution.paused : false;
      if (this.state === 'playback') {
        this.phaseLabel.textContent = 'PLAYBACK';
      } else if (paused) {
        this.phaseLabel.textContent = 'PAUSED';
      } else {
        this.phaseLabel.textContent = 'SIMULATING';
      }
      this.refreshSimulationPauseButton();
      this.refreshShockButton();

      var inPlayback = this.state === 'playback';
      var hasRecording = inPlayback && !!this.playback;
      this.playbackBar.classList.toggle('hidden', !inPlayback);
      this.playButton.classList.toggle('hidden', !hasRecording);
      this.seekSlider.classList.toggle('hidden', !hasRecording);
      this.seekLabel.classList.toggle('hidden', !hasRecording);
      this.saveCreatureButton.classList.toggle('hidden', !hasRecording);
      this.saveRecordingButton.classList.toggle('hidden', !hasRecording);
      this.saveCreatureButton.disabled =
        !this.libraryCreatureId || !this.recording || !this.evolvedChromosome || !this.evolvedChromosome.length;
      this.saveCreatureButton.title = !this.libraryCreatureId
        ? 'Start this simulation from a saved My Creatures entry to overwrite its brain'
        : 'Overwrite this action brain and update its best-generation replay';
      if (hasRecording) {
        this.playButton.textContent = this.playbackPlaying ? '\u2016' : '\u25B6';
        this.seekSlider.value = String(
          this.playbackDuration > 0 ? Utils.clamp(this.playbackTime / this.playbackDuration, 0, 1) : 0
        );
      } else if (inPlayback) {
        this.recordingLabel.textContent = 'GEN ' + generation + ' · NO RECORDING';
      }
      if (inPlayback) {
        var nextDisabled = this.autoplay && this.playbackPlaying;
        this.nextButton.classList.toggle('disabled', nextDisabled);
      }

      var batchCount = this.evolution ? this.evolution.currentCreatureBatch.length : 0;
      if (this.creatureLabel) {
        var index = batchCount ? Math.min(this.watchingIndex, batchCount - 1) + 1 : 0;
        this.creatureLabel.textContent = index + '/' + Math.max(1, batchCount);
        this.previousCreatureButton.classList.toggle('disabled', index <= 1);
        this.nextCreatureButton.classList.toggle('disabled', index >= batchCount);
      }

      this.autoplayToggle.textContent = this.autoplay ? 'ON' : 'OFF';
      this.autoplayToggle.classList.toggle('active', this.autoplay);
      if (this.skipRecapToggle) {
        this.skipRecapToggle.textContent = this.skipRecap ? 'ON' : 'OFF';
        this.skipRecapToggle.classList.toggle('active', this.skipRecap);
        this.skipRecapToggle.setAttribute('aria-pressed', this.skipRecap ? 'true' : 'false');
      }
      if (this.autoFlapToggle) {
        var autoFlap = !Settings || Settings.AutoFlapEnabled !== false;
        this.autoFlapToggle.textContent = autoFlap ? 'ON' : 'OFF';
        this.autoFlapToggle.classList.toggle('active', autoFlap);
        this.autoFlapToggle.setAttribute('aria-pressed', autoFlap ? 'true' : 'false');
      }
      this.durationSlider.value = String(this.settings.SimulationTime);
      this.durationValue.textContent = this.settings.SimulationTime + 'S';
      var activeDuration = this.evolution && this.evolution.Settings
        ? this.evolution.Settings.SimulationTime
        : this.settings.SimulationTime;
      if (this.state === 'playback' && !this.playback) {
        this.timeLabel.textContent = 'NO RECORDING';
      } else {
        this.timeLabel.textContent =
          this.formatTime(this.state === 'playback' ? this.playbackTime : this.batchElapsed()) +
          ' / ' +
          (this.state === 'playback' ? this.playbackDuration : activeDuration).toFixed(1) +
          's';
      }
    },

    refreshTimeLabels: function () {
      if (!this.timeLabel) return;
      if (this.state === 'playback' && this.playback) {
        this.timeLabel.textContent = this.formatTime(this.playbackTime) + ' / ' + this.playbackDuration.toFixed(1) + 's';
        this.seekLabel.textContent = this.formatTime(this.playbackTime);
        if (this.playbackDuration > 0) {
          this.seekSlider.value = String(Utils.clamp(this.playbackTime / this.playbackDuration, 0, 1));
        }
      } else if (this.state === 'playback') {
        this.timeLabel.textContent = 'NO RECORDING';
      } else {
        var activeDuration = this.evolution && this.evolution.Settings
          ? this.evolution.Settings.SimulationTime
          : this.settings.SimulationTime;
        this.timeLabel.textContent = this.formatTime(this.batchElapsed()) + ' / ' + activeDuration + 's';
        var fitness = this.currentFitness();
        this.fitnessLabel.textContent = 'FITNESS: ' + percent(fitness);
      }
    },

    formatTime: function (time) {
      if (!isFinite(time)) time = 0;
      return time.toFixed(1) + 's';
    },

    updateFlightDiagnostics: function () {
      if (!this.flightDebugPanel || !this.showFlightDebug) return;
      var creature =
        this.state === 'simulating' && this.evolution
          ? this.evolution.getWatchingCreature(this.watchingIndex)
          : null;
      if (!creature) {
        this.flightDebugPanel.textContent = 'Live wing diagnostics appear while a generation is simulating.';
        return;
      }

      var wings = (creature.bones || []).filter(function (bone) { return bone.isWing; });
      if (!wings.length) {
        this.flightDebugPanel.textContent = 'No wing bones are marked on this creature.';
        return;
      }

      var lines = ['WING FLIGHT DIAGNOSTICS'];
      var totalUpwardLift = 0;
      var totalUpwardWingForce = 0;
      var unpoweredWingCount = 0;
      wings.forEach(function (bone, index) {
        var debug = bone.wingDebug || {};
        var angle = (debug.angleOfAttack || 0) * Utils.Rad2Deg;
        var hasWingMuscle = !!(bone.connectedMuscles && bone.connectedMuscles.length);
        if (!hasWingMuscle) unpoweredWingCount++;
        totalUpwardLift += Math.max(0, debug.liftY || 0);
        totalUpwardWingForce += debug.forceY || 0;
        lines.push(
          'Wing ' + (index + 1) + ': ' + (debug.speed || 0).toFixed(2) + ' u/s · AoA ' +
            angle.toFixed(0) + '° · lift ' + (debug.lift || 0).toFixed(0) + ' · drag ' +
            (debug.drag || 0).toFixed(0) + ' · drive ' + Math.abs(debug.strokeForce || 0).toFixed(0)
        );
      });
      if (unpoweredWingCount) {
        lines.push(
          unpoweredWingCount === wings.length
            ? 'Add a muscle between a wing and a body bone to power a flap.'
            : unpoweredWingCount + ' wing(s) have no attached muscle and cannot flap.'
        );
      }

      var mass = 0;
      (creature.joints || []).forEach(function (joint) {
        mass += joint.data ? joint.data.weight : joint.body && joint.body.mass || 0;
      });
      (creature.bones || []).forEach(function (bone) {
        mass += bone.data ? bone.data.weight : bone.mass || 0;
      });
      var gravity = this.evolution.scene && this.evolution.scene.world
        ? Math.abs(this.evolution.scene.world.gravity)
        : 50;
      var tracker = creature.objectiveTracker || {};
      var groundContacts = creature.getNumberOfPointsTouchingGround
        ? creature.getNumberOfPointsTouchingGround()
        : 0;
      lines.push(
        'Upward lift: ' + totalUpwardLift.toFixed(0) + ' · net upward wing force: ' +
          totalUpwardWingForce.toFixed(0) + ' / estimated weight: ' + (mass * gravity).toFixed(0)
      );
      lines.push(
        'Ground contacts: ' + groundContacts + ' · airborne: ' +
          (tracker.currentAirborneTime || 0).toFixed(2) + 's · total: ' +
          (tracker.totalAirborneTime || 0).toFixed(2) + 's'
      );
      this.flightDebugPanel.textContent = lines.join('\n');
    },

    /** The fitness that is displayed: live best of the current generation. */
    currentFitness: function () {
      var solutions = this.evolution ? this.evolution.solutions : null;
      if (solutions) {
        var best = 0;
        for (var i = 0; i < solutions.length; i++) {
          if (solutions[i] && solutions[i].stats && solutions[i].stats.fitness > best) {
            best = solutions[i].stats.fitness;
          }
        }
        if (best > 0) return best;
      }
      var history = this.evolution ? this.evolution.generationFitness : null;
      if (history && history.length) return history[history.length - 1];
      return 0;
    },

    refreshStats: function () {
      var history = this.evolution.generationFitness;
      UI.clear(this.statsList);
      var start = Math.max(0, history.length - 8);
      for (var i = start; i < history.length; i++) {
        var row = UI.el('div', 'hud-stats-row');
        row.appendChild(UI.el('span', 'hud-stats-gen', 'GEN ' + (i + 1)));
        var bar = UI.el('div', 'hud-stats-bar');
        var fill = UI.el('div', 'hud-stats-bar-fill');
        fill.style.width = Math.round(Utils.clamp(history[i], 0, 1) * 100) + '%';
        bar.appendChild(fill);
        row.appendChild(bar);
        row.appendChild(UI.el('span', 'hud-stats-value', percent(history[i])));
        this.statsList.appendChild(row);
      }
    },

    /* ================================================================ *
     * Saving / loading
     * ================================================================ */
    showSaveMenu: function () {
      var self = this;
      var content = UI.el('div', 'menu-content');
      var suggestedName = this.data && this.data.CreatureDesign
        ? this.data.CreatureDesign.name || 'Evolution'
        : 'Evolution';
      if (this.recording && this.recording.generation) {
        suggestedName += ' · Gen ' + this.recording.generation;
      }
      var nameField = Widgets.textInput({
        label: 'Replay / run name',
        value: suggestedName,
        maxLength: 60,
      });
      content.appendChild(nameField.element);
      var creatureSnapshot = this.getEvolvedCreatureSnapshot();
      content.appendChild(
        UI.el(
          'p',
          'panel-note',
          'Save a replay or run checkpoint, or overwrite this creature’s brain for the current action. Saving the brain also replaces that action’s best-generation replay in the Gallery. Brain saving requires a simulation launched from a saved My Creatures entry.'
        )
      );

      Modal.open({
        title: 'Save run',
        content: content,
        actions: [
          { label: 'Cancel' },
          {
            label: 'Save replay',
            disabled: !this.recording,
            onClick: function () {
              self.saveRecording(nameField.input.value);
            },
          },
          {
            label: 'Save run',
            onClick: function () {
              self.saveRun(nameField.input.value);
            },
          },
          {
            label: 'Save creature brain',
            disabled: !creatureSnapshot || !this.libraryCreatureId,
            onClick: function () {
              self.saveCreatureBrain(creatureSnapshot);
            },
          },
          {
            label: 'Download run',
            primary: true,
            onClick: function () {
              self.exportFile(nameField.input.value || 'Evolution');
            },
          },
        ],
      });
    },

    saveRun: function (name) {
      try {
        Storage.saveSimulation(name || 'Evolution', this.data);
        Modal.alert('The simulation run was saved in this browser.', 'Run saved');
      } catch (error) {
        Modal.alert('The run could not be saved: ' + error.message, 'Save failed');
      }
    },

    exportFile: function (name) {
      var json = JSON.stringify(EVO.SimulationData.encode(this.data), null, 2);
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = name.replace(/[^\w\-]+/g, '_') + '.evolution.json';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    },

    showLoadMenu: function () {
      var self = this;
      var content = UI.el('div', 'menu-content');

    importFile: function (file) {

    saveRecording: function (customName) {

    attachEvents: function () {

          case 'ArrowRight':

              self.playbackTime = Math.min(self.playbackDuration, self.playbackTime + 1);
              self.playback.seek(self.playbackTime);
            } else {
              self.watchingIndex = Math.min(
                Math.max(0, self.evolution.currentCreatureBatch.length - 1),
                self.watchingIndex + 1
              );
            }
            break;
          case 'ArrowUp':
            self.watchingIndex = Math.min(
              Math.max(0, self.evolution.currentCreatureBatch.length - 1),
              self.watchingIndex + 1
            );
            break;
          case 'ArrowDown':
            self.watchingIndex = Math.max(0, self.watchingIndex - 1);

        onGestureStart: function () {

        onPinch: function (scale) {

        onPan: function (dx, dy) {

        self.dragging = null;
        self.activePointerId = null;

    <script>
      /* Source: js/ui/ecosystem.js */
/*
 * Evolution (Web Edition) — ui/ecosystem.js
 * ---------------------------------------------------------------
 * Creature selection and the shared-world ecosystem screen.
 */
(function (global) {
  'use strict';

  var EVO = (global.EVO = global.EVO || {});
  var UI = EVO.UI;
  var Widgets = EVO.Widgets;
  var App = EVO.App;
  var Storage = EVO.Storage;
  var Utils = EVO.Utils;
  var Renderer = EVO.Renderer;
  var Settings = EVO.Settings;
  var MAX_ECOSYSTEM_CREATURES = 6;

  function topBar(title, onBack) {
    var bar = UI.el('div', 'top-bar ecosystem-top-bar');
    var back = UI.el('button', 'back-button');
    back.appendChild(UI.el('span', 'back-arrow', '\u2190'));
    back.appendChild(UI.el('span', null, 'Back'));
    back.addEventListener('click', onBack);
    bar.appendChild(back);
    bar.appendChild(UI.el('div', 'top-bar-title', title));
    bar.appendChild(UI.el('div', 'top-bar-right'));
    return bar;
  }

  function savedEntries() {
    var entries = Storage.getDesigns().map(function (entry) {
      return {
        id: 'saved:' + entry.id,
        name: entry.name || 'Unnamed',
        design: entry.design,
        evolvedCreature: entry.evolvedCreature || null,
        evolvedBrains: entry.evolvedBrains || null,
        source: 'Your library',
      };
    });
    EVO.DefaultCreatures.forEach(function (sample, index) {
      entries.push({
        id: 'sample:' + index,
        name: sample.name,
        design: sample.design,
        evolvedCreature: null,
        source: 'Sample creature',
      });
    });
    return entries;
  }

  var EcosystemScreen = {
    show: function () {
      this.availableEntries = savedEntries();
      this.selectedIds = [];
      this.objective = EVO.Objective.Running;
      this.duration = 30;
      this.speed = 1;
      this.manualCamera = false;
      this.buildSetup();
    },

    hide: function () {
      if (this.animationFrame) {
        global.cancelAnimationFrame(this.animationFrame);
        this.animationFrame = null;
      }
      this.detachRunEvents();
      if (this.simulation) this.simulation.stop();
      this.simulation = null;
      this.canvas = null;
      this.canvasContainer = null;
      this.camera = null;
      this.availableEntries = [];
      this.selectedEntries = [];
      this.selectionList = null;
    },

    buildSetup: function () {
      var self = this;
      var element = this.element;
      UI.clear(element);
      element.appendChild(topBar('Ecosystem', function () { App.show('home'); }));

      var content = UI.el('main', 'ecosystem-setup-content');
      content.appendChild(UI.el('h1', 'ecosystem-heading', 'Build an ecosystem'));
      content.appendChild(
        UI.el(
          'p',
          'ecosystem-intro',
          'Choose two to six creatures to share one world. Each library creature reuses its saved brain for the selected action when available.'
        )
      );

      var controls = UI.el('div', 'ecosystem-setup-controls');
      var objectiveRow = UI.el('label', 'ecosystem-field');
      objectiveRow.appendChild(UI.el('span', 'widget-label', 'Shared environment'));
      var objectiveSelect = UI.el('select', 'dropdown ecosystem-objective');
      EVO.ObjectiveUtil.ALL_OBJECTIVES.forEach(function (objective) {
        var option = UI.el('option', null, EVO.ObjectiveUtil.stringRepresentation(objective));
        option.value = String(objective);
        objectiveSelect.appendChild(option);
      });
      objectiveSelect.value = String(this.objective);
      objectiveSelect.addEventListener('change', function () {
        self.objective = parseInt(objectiveSelect.value, 10);
        self.refreshChoices();
      });
      objectiveRow.appendChild(objectiveSelect);
      controls.appendChild(objectiveRow);

      var durationWidget = Widgets.slider({
        label: 'Run length',
        min: 10,
        max: 60,
        step: 10,
        value: this.duration,
        format: function (value) { return value + ' seconds'; },
        onInput: function (value) { self.duration = value; },
      });
      controls.appendChild(durationWidget.element);
      content.appendChild(controls);

      var selectionHeading = UI.el('div', 'ecosystem-selection-heading');
      selectionHeading.appendChild(UI.el('h2', null, 'Choose residents'));
      this.selectionCount = UI.el('span', 'ecosystem-selection-count', '0 / ' + MAX_ECOSYSTEM_CREATURES + ' selected');
      selectionHeading.appendChild(this.selectionCount);
      content.appendChild(selectionHeading);

      this.selectionList = UI.el('div', 'ecosystem-creature-grid');
      this.availableEntries.forEach(function (entry) {
        self.selectionList.appendChild(self.createChoice(entry));
      });
      content.appendChild(this.selectionList);

      this.setupMessage = UI.el(
        'p',
        'ecosystem-selection-note',
        'Tip: save an evolved creature from Simulate to bring its learned movement into the ecosystem.'
      );
      content.appendChild(this.setupMessage);

      this.startButton = UI.el('button', 'evo-button primary ecosystem-start-button', 'Start ecosystem');
      this.startButton.disabled = true;
      this.startButton.addEventListener('click', function () {
        self.startEcosystem();
      });
      content.appendChild(this.startButton);
      element.appendChild(content);
      this.refreshChoices();
    },

    createChoice: function (entry) {
      var self = this;
      var card = UI.el('label', 'ecosystem-creature-card');
      var checkbox = UI.el('input', 'ecosystem-checkbox');
      checkbox.type = 'checkbox';
      checkbox.value = entry.id;
      checkbox.addEventListener('change', function () {
        var index = self.selectedIds.indexOf(entry.id);
        if (checkbox.checked && index === -1) self.selectedIds.push(entry.id);
        if (!checkbox.checked && index !== -1) self.selectedIds.splice(index, 1);
        self.refreshChoices();
      });
      card.appendChild(checkbox);

      var description = UI.el('span', 'ecosystem-card-content');
      description.appendChild(UI.el('span', 'ecosystem-card-name', entry.name));
      var subtitle = entry.source + ' · ' + entry.design.joints.length + ' joints';
      var brainTasks = Object.keys(entry.evolvedBrains || {}).map(function (key) {
        return EVO.ObjectiveUtil.stringRepresentation(entry.evolvedBrains[key].task);
      });
      if (!brainTasks.length && entry.evolvedCreature) {
        brainTasks.push(EVO.ObjectiveUtil.stringRepresentation(entry.evolvedCreature.task));
      }
      if (brainTasks.length) subtitle += ' · brains: ' + brainTasks.join(', ');
      description.appendChild(UI.el('span', 'ecosystem-card-subtitle', subtitle));
      card.appendChild(description);
      return card;
    },

    refreshChoices: function () {
      var self = this;
      var count = this.selectedIds.length;
      this.selectionCount.textContent = count + ' / ' + MAX_ECOSYSTEM_CREATURES + ' selected';
      this.startButton.disabled = count < 2 || count > MAX_ECOSYSTEM_CREATURES;
      var cards = this.selectionList.querySelectorAll('.ecosystem-creature-card');
      Array.prototype.forEach.call(cards, function (card) {
        var checkbox = card.querySelector('input');
        var selected = self.selectedIds.indexOf(checkbox.value) !== -1;
        checkbox.checked = selected;
        checkbox.disabled = count >= MAX_ECOSYSTEM_CREATURES && !selected;
        card.classList.toggle('selected', selected);
      });
      var selectedAction = EVO.ObjectiveUtil.stringRepresentation(this.objective);
      if (count < 2) {
        this.setupMessage.textContent = 'Select at least two creatures. Matching saved ' + selectedAction + ' brains are reused.';
      } else if (count >= MAX_ECOSYSTEM_CREATURES) {
        this.setupMessage.textContent = 'Six residents selected — uncheck one to make room for another.';
      } else {
        this.setupMessage.textContent = 'Saved brains matching ' + selectedAction + ' are reused; creatures without one get a fresh exploratory brain.';
      }
    },

    startEcosystem: function () {
      var self = this;
      this.selectedEntries = this.availableEntries.filter(function (entry) {
        return self.selectedIds.indexOf(entry.id) !== -1;
      });
      if (this.selectedEntries.length < 2 || this.selectedEntries.length > MAX_ECOSYSTEM_CREATURES) return;

      this.simulation = new EVO.EcosystemSimulation();
      try {
        this.simulation.start(this.selectedEntries, this.objective, null, this.duration);
      } catch (error) {
        this.simulation.stop();
        this.simulation = null;
        this.setupMessage.textContent = error.message;
        return;
      }
      this.manualCamera = false;
      this.speed = 1;
      this.buildRun();
      this.resize();
      this.attachRunEvents();
      this.loop();
    },

    buildRun: function () {
      var self = this;
      var element = this.element;
      UI.clear(element);
      this.canvasContainer = UI.el('div', 'ecosystem-canvas-container');
      this.canvas = UI.el('canvas', 'ecosystem-canvas');
      this.canvasContainer.appendChild(this.canvas);
      element.appendChild(this.canvasContainer);

      var topLeft = UI.el('div', 'ecosystem-run-info');
      topLeft.appendChild(UI.el('div', 'ecosystem-run-title', 'ECOSYSTEM'));
      this.objectiveLabel = UI.el('div', 'ecosystem-run-objective', EVO.ObjectiveUtil.stringRepresentation(this.objective));
      topLeft.appendChild(this.objectiveLabel);
      this.residentLabel = UI.el(
        'div',
        'ecosystem-run-residents',
        this.selectedEntries.map(function (entry) { return entry.name; }).join(' · ')
      );
      topLeft.appendChild(this.residentLabel);
      element.appendChild(topLeft);

      var actions = UI.el('div', 'ecosystem-run-actions');
      this.pauseButton = UI.el('button', 'evo-button small', 'Pause');
      this.pauseButton.type = 'button';
      this.pauseButton.setAttribute('aria-label', 'Pause ecosystem simulation');
      this.pauseButton.addEventListener('click', function () {
        if (self.simulation.complete) {
          self.simulation.start(self.selectedEntries, self.objective, null, self.duration);
          self.manualCamera = false;
          self.cameraNeedsFit = true;
          self.fitCamera();
          self.pauseButton.textContent = 'Pause';
          self.pauseButton.setAttribute('aria-label', 'Pause ecosystem simulation');
          return;
        }
        var paused = self.simulation.togglePaused();
        self.pauseButton.textContent = paused ? 'Resume' : 'Pause';
        self.pauseButton.setAttribute('aria-label', paused ? 'Resume ecosystem simulation' : 'Pause ecosystem simulation');
      });
      actions.appendChild(this.pauseButton);

      this.shockButton = UI.el('button', 'evo-button small shock-button', '\u26A1 Shock');
      this.shockButton.type = 'button';
      this.shockButton.title = 'Shock the residents: interrupts whatever they are doing right now';
      this.shockButton.setAttribute('aria-label', 'Shock the ecosystem residents');
      this.shockButton.addEventListener('click', function () {
        if (self.simulation && !self.simulation.complete && !self.simulation.paused) {
          self.simulation.shock();
        }
      });
      actions.appendChild(this.shockButton);

      var fitButton = UI.el('button', 'evo-button small', 'Fit');
      fitButton.addEventListener('click', function () {
        self.manualCamera = false;
        self.fitCamera();
      });
      actions.appendChild(fitButton);

      var chooseButton = UI.el('button', 'evo-button small', 'Residents');
      chooseButton.addEventListener('click', function () {
        if (self.simulation) self.simulation.stop();
        self.simulation = null;
        if (self.animationFrame) global.cancelAnimationFrame(self.animationFrame);
        self.animationFrame = null;
        self.detachRunEvents();
        self.buildSetup();
      });
      actions.appendChild(chooseButton);

      var exitButton = UI.el('button', 'evo-button small', 'Exit');
      exitButton.addEventListener('click', function () { App.show('home'); });
      actions.appendChild(exitButton);
      element.appendChild(actions);

      var status = UI.el('div', 'ecosystem-run-status');
      this.elapsedLabel = UI.el('span', 'ecosystem-elapsed', '0.0s');
      status.appendChild(this.elapsedLabel);
      status.appendChild(UI.el('span', 'ecosystem-status-divider', '·'));
      this.pausedLabel = UI.el('span', 'ecosystem-status-label', 'RUNNING');
      status.appendChild(this.pausedLabel);

      var speedLabel = UI.el('span', 'ecosystem-speed-caption', 'SPEED');
      status.appendChild(speedLabel);
      this.speedSlider = UI.el('input', 'hud-slider ecosystem-speed');
      this.speedSlider.type = 'range';
      this.speedSlider.min = '0.25';
      this.speedSlider.max = '3';
      this.speedSlider.step = '0.25';
      this.speedSlider.value = '1';
      this.speedSlider.addEventListener('input', function () {
        self.speed = parseFloat(self.speedSlider.value);
      });
      status.appendChild(this.speedSlider);
      this.speedValue = UI.el('span', 'ecosystem-speed-value', '1.00x');
      status.appendChild(this.speedValue);
      element.appendChild(status);

      this.camera = new EVO.Camera({ orthographicSize: 18 });
      this.cameraNeedsFit = true;
    },

    resize: function () {
      if (!this.canvas || !this.canvasContainer || !this.camera) return;
      var width = this.canvasContainer.clientWidth || global.innerWidth || 800;
      var height = this.canvasContainer.clientHeight || global.innerHeight || 600;
      var ratio = Utils.displayPixelRatio ? Utils.displayPixelRatio() : Math.min(global.devicePixelRatio || 1, 2);
      this.canvas.width = Math.floor(width * ratio);
      this.canvas.height = Math.floor(height * ratio);
      this.canvas.style.width = width + 'px';
      this.canvas.style.height = height + 'px';
      this.pixelRatio = ratio;
      this.camera.resize(width, height);
      if (this.cameraNeedsFit) this.fitCamera();
    },

    fitCamera: function () {
      if (!this.camera || !this.simulation || !this.simulation.creatures.length) return;
      var minX = Infinity;
      var maxX = -Infinity;
      var minY = Infinity;
      var maxY = -Infinity;
      this.simulation.creatures.forEach(function (creature) {
        creature.joints.forEach(function (joint) {
          minX = Math.min(minX, joint.body.x);
          maxX = Math.max(maxX, joint.body.x);
          minY = Math.min(minY, joint.body.y);
          maxY = Math.max(maxY, joint.body.y);
        });
      });
      if (!isFinite(minX)) return;
      var aspect = this.camera.width / Math.max(1, this.camera.height);
      this.camera.x = (minX + maxX) / 2;
      this.camera.y = (minY + maxY) / 2;
      this.camera.orthographicSize = Utils.clamp(
        Math.max(8, (maxY - minY + 4) / 2, (maxX - minX + 6) / (2 * Math.max(0.4, aspect))),
        this.camera.minZoom,
        this.camera.maxZoom
      );
      this.cameraNeedsFit = false;
    },

    loop: function () {
      var self = this;
      var lastTime = global.performance && global.performance.now ? global.performance.now() : Date.now();
      var step = function (now) {
        var dt = Math.min(0.1, (now - lastTime) / 1000 || 0);
        lastTime = now;
        self.update(dt);
        self.draw();
        self.animationFrame = global.requestAnimationFrame(step);
      };
      this.animationFrame = global.requestAnimationFrame(step);
    },

    update: function (dt) {
      if (!this.simulation) return;
      this.simulation.update(dt, this.speed);
      this.elapsedLabel.textContent =
        this.simulation.elapsed.toFixed(1) + 's / ' + this.duration + 's';
      this.speedValue.textContent = this.speed.toFixed(2) + 'x';
      this.pausedLabel.textContent = this.simulation.complete
        ? 'COMPLETE'
        : this.simulation.paused
          ? 'PAUSED'
          : 'RUNNING';
      this.pauseButton.textContent = this.simulation.complete
        ? 'Restart'
        : this.simulation.paused
          ? 'Resume'
          : 'Pause';
      if (this.shockButton) {
        this.shockButton.disabled = this.simulation.complete || this.simulation.paused;
      }
      if (!this.manualCamera) this.followCreatures();
    },

    followCreatures: function () {
      var creatures = this.simulation.creatures;
      if (!creatures.length) return;
      var x = 0;
      var y = 0;
      for (var i = 0; i < creatures.length; i++) {
        x += creatures[i].getXPosition();
        y += creatures[i].getYPosition();
      }
      x /= creatures.length;
      y /= creatures.length;
      this.camera.x += (x - this.camera.x) * 0.035;
      this.camera.y += (y - this.camera.y) * 0.035;
    },

    draw: function () {
      if (!this.canvas || !this.camera || !this.simulation) return;
      var ctx = this.canvas.getContext('2d');
      if (!ctx) return;
      var ratio = this.pixelRatio || 1;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      Renderer.drawBackground(ctx, this.camera);
      var gridVisibility = this.objective === EVO.Objective.Flying
        ? Settings.FlyingGridVisibility
        : Settings.DefaultGridVisibility;
      Renderer.drawGrid(ctx, this.camera, gridVisibility, Settings.GridSize || 1);
      Renderer.drawScene(ctx, this.simulation.scene, this.camera);
      Renderer.drawDistanceMarkers(ctx, this.simulation.scene, this.camera);
      for (var i = 0; i < this.simulation.creatures.length; i++) {
        Renderer.drawCreature(ctx, this.simulation.creatures[i], this.camera, {
          showMuscles: Settings.ShowMuscles,
          showContraction: Settings.ShowMuscleContraction,
        });
      }
    },

    attachRunEvents: function () {
      var self = this;
      if (!this.canvas) return;
      this.gestures = Utils.addTouchGestures(this.canvas, {
        onGestureStart: function () { self.dragging = null; },
        onPinch: function (scale, x, y) { self.zoomAt(x, y, scale); },
        onPan: function (dx, dy) {
          self.manualCamera = true;
          self.camera.panByScreenDelta(dx, dy);
        },
        onGestureEnd: function () { self.dragging = null; },
      });
      this.onPointerDown = function (event) {
        if (event.pointerType === 'touch' || event.target !== self.canvas || (self.gestures && self.gestures.active)) return;
        self.manualCamera = true;
        self.dragging = { x: event.clientX, y: event.clientY, id: event.pointerId };
        try { self.canvas.setPointerCapture(event.pointerId); } catch (error) { /* Optional API. */ }
      };
      this.onPointerMove = function (event) {
        if (!self.dragging || event.pointerId !== self.dragging.id || (self.gestures && self.gestures.active)) return;
        var dx = event.clientX - self.dragging.x;
        var dy = event.clientY - self.dragging.y;
        self.dragging = { x: event.clientX, y: event.clientY, id: event.pointerId };
        self.camera.panByScreenDelta(dx, dy);
      };
      this.onPointerEnd = function (event) {
        if (self.dragging && (!event || event.pointerId === self.dragging.id)) self.dragging = null;
      };
      this.onWheel = function (event) {
        event.preventDefault();
        self.manualCamera = true;
        var rect = self.canvas.getBoundingClientRect();
        self.zoomAt(event.clientX - rect.left, event.clientY - rect.top, Math.exp(-event.deltaY * 0.001));
      };
      this.canvas.addEventListener('pointerdown', this.onPointerDown);
      global.addEventListener('pointermove', this.onPointerMove);
      global.addEventListener('pointerup', this.onPointerEnd);
      global.addEventListener('pointercancel', this.onPointerEnd);
      this.canvas.addEventListener('wheel', this.onWheel, { passive: false });
    },

    zoomAt: function (x, y, scale) {
      if (!this.camera) return;
      this.manualCamera = true;
      this.camera.zoomAt(x, y, 1 / scale);
    },

    detachRunEvents: function () {
      if (this.gestures) {
        this.gestures.detach();
        this.gestures = null;
      }
      if (this.canvas) {
        this.canvas.removeEventListener('pointerdown', this.onPointerDown);
        this.canvas.removeEventListener('wheel', this.onWheel);
      }
      if (this.onPointerMove) global.removeEventListener('pointermove', this.onPointerMove);
      if (this.onPointerEnd) {
        global.removeEventListener('pointerup', this.onPointerEnd);
        global.removeEventListener('pointercancel', this.onPointerEnd);
      }
      this.dragging = null;
      this.onPointerDown = null;
      this.onPointerMove = null;
      this.onPointerEnd = null;
      this.onWheel = null;
    },
  };

  EVO.EcosystemScreen = EcosystemScreen;
  EVO.Screens = EVO.Screens || {};
  EVO.Screens.ecosystem = EcosystemScreen;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = EVO;
  }
})(typeof window !== 'undefined' ? window : globalThis);

    <script>
      /* Source: js/ui/gallery.js */
/*
 * Evolution (Web Edition) — ui/gallery.js
 * ---------------------------------------------------------------
 * The gallery of saved creature recordings.  Port of the original
 * best-creatures gallery: pick a recording of a generation and watch it
 * again, export it or load its design back into the editor.
 */
(function (global) {
  'use strict';

  var EVO = (global.EVO = global.EVO || {});
  var UI = EVO.UI;
  var Widgets = EVO.Widgets;
  var Modal = EVO.Modal;
  var Storage = EVO.Storage;
  var App = EVO.App;
  var Utils = EVO.Utils;
  var Renderer = EVO.Renderer;

  function percent(value) {
    return (Utils.clamp(value || 0, 0, 1) * 100).toFixed(2) + '%';
  }

  var GalleryScreen = {
    show: function (params) {
      params = params || {};
      this.recordings = Storage.getRecordings();
      this.selectedId = params.id || (this.recordings[0] ? this.recordings[0].id : null);
      this.playbackTime = 0;
      this.playbackPlaying = true;
      this.speed = 1;
      this.playback = null;
      this.manualCamera = false;
      this.gestures = null;

      this.buildLayout();
      this.resize();
      this.attachEvents();
      this.selectRecording(this.selectedId);
      this.loop();
    },

    hide: function () {
      if (this.animationFrame) {
        cancelAnimationFrame(this.animationFrame);
        this.animationFrame = null;
      }
      this.detachEvents();
      // Gallery is a singleton screen; release decoded recordings on navigation.
      this.playback = null;
      this.recordings = [];
      this.bounds = null;
      this.canvas = null;
      this.canvasContainer = null;
      this.listElement = null;
      this.playButton = null;
      this.seekSlider = null;
      this.timeLabel = null;
      this.infoLabel = null;
    },

    buildLayout: function () {
      var self = this;
      var element = this.element;

      var bar = UI.el('div', 'top-bar');
      var back = UI.el('button', 'back-button');
      back.appendChild(UI.el('span', 'back-arrow', '\u2190'));
      back.appendChild(UI.el('span', null, 'Back'));
      back.addEventListener('click', function () {
        App.show('home');
      });
      bar.appendChild(back);
      bar.appendChild(UI.el('div', 'top-bar-title', 'Gallery'));
      bar.appendChild(UI.el('div', 'top-bar-right'));
      element.appendChild(bar);

      var content = UI.el('div', 'gallery-content');

      /* Left: the list of recordings */
      this.listElement = UI.el('div', 'gallery-list');
      content.appendChild(this.listElement);

      /* Right: the player */
      var player = UI.el('div', 'gallery-player');
      var canvasContainer = UI.el('div', 'gallery-canvas-container');
      this.canvas = UI.el('canvas', 'gallery-canvas');
      canvasContainer.appendChild(this.canvas);
      player.appendChild(canvasContainer);
      this.canvasContainer = canvasContainer;

      var controls = UI.el('div', 'gallery-controls');
      this.playButton = UI.el('button', 'hud-button play-button', '\u25B6');
      this.playButton.addEventListener('click', function () {
        self.togglePlayback();
      });
      controls.appendChild(this.playButton);

      this.seekSlider = UI.el('input', 'hud-slider seek-slider');
      this.seekSlider.type = 'range';
      this.seekSlider.min = '0';
      this.seekSlider.max = '1';
      this.seekSlider.step = '0.001';
      this.seekSlider.addEventListener('input', function () {
        if (!self.playback) return;
        self.playbackPlaying = false;
        self.playbackTime = parseFloat(self.seekSlider.value) * self.duration();
        self.playback.seek(self.playbackTime);
        self.refreshPlayButton();
      });
      controls.appendChild(this.seekSlider);

      this.timeLabel = UI.el('span', 'hud-row-value', '0.0s');
      controls.appendChild(this.timeLabel);

      this.infoLabel = UI.el('span', 'gallery-info', '');
      controls.appendChild(this.infoLabel);
      player.appendChild(controls);

      var actions = Widgets.buttonRow(
        [
          {
            label: 'Load design',
            onClick: function () {
              if (!self.playback) return;
              App.show('editor', { design: self.currentRecording().creatureDesign });
            },
          },
          {
            label: 'Export',
            onClick: function () {
              self.exportRecording();
            },
          },
          {
            label: 'Save as simulation',
            onClick: function () {
              self.saveAsSimulation();
            },
          },
          {
            label: 'Delete',
            className: 'danger',
            onClick: function () {
              if (!self.selectedId) return;
              Modal.confirm('Delete this recording?', function () {
                Storage.deleteRecording(self.selectedId);
                App.show('gallery');
              });
            },
          },
        ],
        'compact'
      );
      player.appendChild(actions);
      content.appendChild(player);

      element.appendChild(content);
    },

    resize: function () {
      if (!this.canvas) return;
      var width = this.canvasContainer.clientWidth || 600;
      var height = this.canvasContainer.clientHeight || 400;
      var ratio = Utils.displayPixelRatio ? Utils.displayPixelRatio() : Math.min(global.devicePixelRatio || 1, 2);
      this.canvas.width = Math.floor(width * ratio);
      this.canvas.height = Math.floor(height * ratio);
      this.canvas.style.width = width + 'px';
      this.canvas.style.height = height + 'px';
      this.pixelRatio = ratio;
      if (!this.camera) this.camera = new EVO.Camera({ orthographicSize: 12.24 });
      this.camera.resize(width, height);
    },

    refreshList: function () {
      var self = this;
      UI.clear(this.listElement);
      this.recordings = Storage.getRecordings();
      if (!this.recordings.length) {
        this.listElement.appendChild(
          UI.el(
            'p',
            'empty-note',
            'No recordings yet. During a simulation you can save the best creature of a generation ' +
              'with the SAVE button.'
          )
        );
        return;
      }
      this.recordings.forEach(function (entry) {
        var button = UI.el('button', 'gallery-entry');
        button.classList.toggle('active', entry.id === self.selectedId);
        button.appendChild(
          UI.el('span', 'gallery-entry-title', entry.name || 'Generation ' + entry.generation)
        );
        button.appendChild(
          UI.el(
            'span',
            'gallery-entry-sub',
            EVO.ObjectiveUtil.stringRepresentation(entry.task) +
              ' · ' +
              percent(entry.fitness) +
              ' · ' +
              new Date(entry.date).toLocaleDateString()
          )
        );
        button.addEventListener('click', function () {
          self.selectRecording(entry.id);
        });
        self.listElement.appendChild(button);
      });
    },

    currentEntry: function () {
      for (var i = 0; i < this.recordings.length; i++) {
        if (this.recordings[i].id === this.selectedId) return this.recordings[i];
      }
      return null;
    },

    currentRecording: function () {
      var entry = this.currentEntry();
      return entry ? entry.recording : null;
    },

    selectRecording: function (id) {
      this.selectedId = id;
      this.manualCamera = false;
      this.playbackTime = 0;
      this.playbackPlaying = true;
      var recording = this.currentRecording();
      this.playback = recording ? new EVO.PlaybackCreature(recording) : null;
      this.bounds = this.playback ? this.playback.getBounds() : null;
      this.refreshList();

      if (this.playback) {
        var stats = recording.stats;
        this.infoLabel.textContent =
          'GEN ' + recording.generation + ' · ' + percent(stats.fitness) + ' · ' +
          stats.numberOfBones + ' bones · ' + stats.numberOfMuscles + ' muscles';
      } else {
        this.infoLabel.textContent = '';
      }
      this.refreshPlayButton();
    },

    duration: function () {
      return this.playback ? Math.max(0.1, this.playback.getDuration()) : 0.1;
    },

    refreshPlayButton: function () {
      this.playButton.textContent = this.playback && this.playbackPlaying ? '\u2016' : '\u25B6';
      this.playButton.disabled = !this.playback;
    },

    togglePlayback: function () {
      if (!this.playback) return;
      if (this.playbackPlaying) {
        this.playbackPlaying = false;
      } else {
        if (this.playbackTime >= this.duration() - 0.001) this.playbackTime = 0;
        this.playbackPlaying = true;
        this.playback.seek(this.playbackTime);
      }
      this.refreshPlayButton();
    },

    loop: function () {
      var self = this;
      var lastTime = performance.now ? performance.now() : Date.now();
      var step = function (now) {
        var dt = Math.min(0.1, (now - lastTime) / 1000 || 0);
        lastTime = now;
        self.update(dt);
        self.draw();
        self.animationFrame = global.requestAnimationFrame(step);
      };
      this.animationFrame = global.requestAnimationFrame(step);
    },

    update: function (dt) {
      if (!this.playback || !this.playbackPlaying) return;
      this.playbackTime += dt * this.speed;
      var duration = this.duration();
      if (this.playbackTime >= duration) {
        this.playbackTime = duration;
        this.playbackPlaying = false;
      }
      this.playback.seek(this.playbackTime);
      this.refreshPlayButton();
    },

    draw: function () {
      if (!this.camera) return;
      var ctx = this.canvas.getContext('2d');
      if (!ctx) return;
      var ratio = this.pixelRatio || 1;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      Renderer.drawBackground(ctx, this.camera);

      if (!this.playback) {
        ctx.fillStyle = Renderer.COLORS.marker;
        ctx.font = '16px "Helvetica Neue", Helvetica, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No recording selected', this.camera.width / 2, this.camera.height / 2);
        return;
      }

      if (this.bounds && !this.manualCamera) {
        this.camera.x = (this.bounds.minX + this.bounds.maxX) / 2;
        this.camera.y = (this.bounds.minY + this.bounds.maxY) / 2;
        var width = Math.max(6, this.bounds.maxX - this.bounds.minX);
        var height = Math.max(6, this.bounds.maxY - this.bounds.minY);
        this.camera.orthographicSize = Utils.clamp(Math.max(width * 0.6, height), 3, 60);
      }

      Renderer.drawPlaybackCreature(ctx, this.playback, this.camera, {
        opacity: 1,
        showMuscles: EVO.Settings.ShowMuscles,
        showContraction: EVO.Settings.ShowMuscleContraction,
      });

      this.seekSlider.value = String(Utils.clamp(this.playbackTime / this.duration(), 0, 1));
      this.timeLabel.textContent = this.playbackTime.toFixed(1) + 's / ' + this.duration().toFixed(1) + 's';
      this.refreshPlayButton();
    },

    exportRecording: function () {
      var recording = this.currentRecording();
      if (!recording) return;
      var entry = this.currentEntry();
      var name = entry && entry.name ? entry.name : 'generation-' + recording.generation;
      var safeName = name.replace(/[^\w-]+/g, '_');
      var json = JSON.stringify(EVO.CreatureRecording.encode(recording), null, 2);
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = safeName + '-recording.json';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    },

    saveAsSimulation: function () {
      var recording = this.currentRecording();
      if (!recording) return;
      var settings = EVO.SimulationSettings.decode(EVO.Settings.SimulationSettings);
      settings.Objective = recording.task;
      var networkSettings = recording.networkSettings
        ? EVO.NeuralNetworkSettings.decode(recording.networkSettings)
        : EVO.NeuralNetworkSettings.decode(EVO.Settings.NetworkSettings);
      var scene =
        recording.sceneDescription ||
        EVO.DefaultSimulationScenes.defaultSceneForObjective(recording.task);
      var data = EVO.SimulationData.create(
        settings,
        networkSettings,
        EVO.CreatureDesign.clone(recording.creatureDesign),
        scene
      );
      App.show('simulation', { data: data });
    },

    attachEvents: function () {
      var self = this;
      this.gestures = Utils.addTouchGestures(this.canvas, {
        onPinch: function (scale, cx, cy) {
          if (!self.camera) return;
          self.manualCamera = true;
          self.camera.zoomAt(cx, cy, 1 / scale);
        },
        onPan: function (dx, dy) {
          if (!self.camera) return;
          self.manualCamera = true;
          self.camera.panByScreenDelta(dx, dy);
        },
      });
      this.onResize = function () {
        self.resize();
      };
      this.onKeyDown = function (event) {
        if (event.target && /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
        if (event.key === ' ') {
          event.preventDefault();
          self.togglePlayback();
        }
      };
      global.addEventListener('resize', this.onResize);
      global.addEventListener('keydown', this.onKeyDown);
    },

    detachEvents: function () {
      if (this.gestures) {
        this.gestures.detach();
        this.gestures = null;
      }
      global.removeEventListener('resize', this.onResize);
      global.removeEventListener('keydown', this.onKeyDown);
    },
  };

  EVO.GalleryScreen = GalleryScreen;
  EVO.Screens.gallery = GalleryScreen;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = EVO;
  }
})(typeof window !== 'undefined' ? window : globalThis);

    </script>

    <script>
      /* Source: js/boot.js */
/*
 * Evolution (Web Edition) — js/boot.js
 * ---------------------------------------------------------------
 * Starts the application.  This is the last script that is loaded.
 */
(function (global) {
  'use strict';

  var EVO = global.EVO;
  var UI = EVO.UI;

  /** Keeps local-file previews from becoming an unexplained blank screen. */
  function setStartupNoticeState(failed) {
    var notice = document.getElementById('startup-notice');
    if (!notice) return;
    if (!failed) {
      notice.classList.add('hidden');
      notice.setAttribute('aria-hidden', 'true');
      return;
    }
    notice.classList.remove('hidden');
    notice.setAttribute('role', 'alert');
    var status = notice.querySelector('p');
    if (status) status.textContent = 'Evolution could not start from this page.';
  }

  /** Shows a readable message if something goes wrong. */
  function showFatalError(message, details) {
    setStartupNoticeState(true);
    var overlay = UI.el('div', 'modal-overlay');
    var dialog = UI.el('div', 'modal');
    dialog.appendChild(UI.el('div', 'modal-title', 'Something went wrong'));
    var body = UI.el('div', 'modal-body');
    body.appendChild(UI.el('p', 'modal-message', message));
    if (details) {
      var pre = UI.el('pre', 'error-details', String(details));
      body.appendChild(pre);
    }
    dialog.appendChild(body);
    var actions = UI.el('div', 'modal-actions');
    var button = UI.el('button', 'evo-button primary', 'Reload');
    button.addEventListener('click', function () {
      global.location.reload();
    });
    actions.appendChild(button);
    dialog.appendChild(actions);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);
  }

  global.addEventListener('error', function (event) {
    if (event && event.message) {
      showFatalError('An unexpected error occurred.', event.message);
    }
  });

  function showOnboarding() {
    var content = UI.el('div', 'onboarding');
    var paragraphs = [
      'Design a creature out of joints, bones and muscles — then let evolution teach it how to move.',
      'Start with one of the sample creatures in the editor, or place joints with the joint tool and connect them with bones.',
      'Add muscles between two bones. Each muscle contracts or expands depending on the output of the creature\'s brain.',
      'Choose a task in the simulation (running, jumping, obstacle jumping, climbing or flying), press play and watch the population evolve.',
      'The best creature of every generation is recorded. Use Save Run to save a named replay, run checkpoint, or creature with its brain; turn on Skip Recap to move straight to the next generation.'
    ];
    paragraphs.forEach(function (text) {
      content.appendChild(UI.el('p', 'modal-message', text));
    });

    var toggle = EVO.Widgets.toggle({
      label: 'Show this message on startup',
      value: true,
      onChange: function (value) {
        EVO.Settings.ShowOnboarding = value;
      },
    });

    EVO.Modal.open({
      title: 'Welcome to Evolution',
      content: content,
      actions: [{ label: 'Let\'s go', primary: true }],
    });
    EVO.Modal.root.querySelector('.modal-body').appendChild(toggle.element);
  }

  function start() {
    try {
      EVO.App.start();
      setStartupNoticeState(false);

      if (EVO.Settings.ShowOnboarding) {
        showOnboarding();
      }

      if (!EVO.Store.available) {
        EVO.Modal.open({
          title: 'Storage unavailable',
          message:
            'This browser does not allow local storage for pages that are opened from the file system, ' +
            'so your creatures and simulations can only be saved as files. Everything else works normally.',
          actions: [{ label: 'OK', primary: true }],
        });
      }
    } catch (error) {
      showFatalError('The application could not be started.', error && error.stack ? error.stack : error);
    }
  }

  global.EVO.boot = start;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})(typeof window !== 'undefined' ? window : globalThis);

    </script>

  <body>
    <!-- Single-file variant: no external stylesheets, scripts, or data files. -->
    <div id="startup-notice" class="startup-notice" role="status" aria-live="polite">
      <h1>EVOLUTION</h1>
      <p>Loading the interactive simulator…</p>
      <p class="startup-note">
        If this message remains, this browser preview may not run JavaScript. Open this file in a modern browser or use a hosted web address.
        This edition already contains its styles and scripts; no companion folders are required.
      </p>
    </div>
    <div id="screens"></div>
    <noscript>
      <p style="padding: 20px">Evolution needs JavaScript to run. Please enable JavaScript and reload the page.</p>
    </noscript>
  </body>
</html>
