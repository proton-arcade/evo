  // rhythmic oscillator (downstroke first) whenever the creature is
  // airborne or falling, so a winged creature flaps without waiting for
  // evolution to discover the behaviour.

  Creature.AUTO_FLAP_FALL_SPEED = -0.25;

  /* ------------------------------------------------------------------ *
   * Construction
   * ------------------------------------------------------------------ */
  Creature.prototype._buildJoints = function () {
    var self = this;

      var body = self.world.addBody({
        x: data.x,
        y: data.y,
        mass: data.weight,
        radius: JOINT_RADIUS,

        body: body,
        center: { x: data.x, y: data.y },

  Creature.prototype._findBone = function (id) {

  Creature.prototype._buildBones = function () {
    var self = this;
    this.design.bones.forEach(function (data) {
      var startJoint = self._findJoint(data.startJointID);
      var endJoint = self._findJoint(data.endJointID);
      if (!startJoint || !endJoint) return;

      var restLength = Utils.distance(
        startJoint.body.x,
        startJoint.body.y,
        endJoint.body.x,
        endJoint.body.y

      var constraint = self.world.addConstraint(startJoint.body, endJoint.body, restLength, 1);

        data: data,
        startJoint: startJoint,
        endJoint: endJoint,

        mass: data.weight,

        strokeTangentSign: endJoint.body.x < startJoint.body.x ? 1 : -1,

      var halfMass = data.weight / 2;
      startJoint.body.mass += halfMass;
      endJoint.body.mass += halfMass;

      endJoint.body.invMass = 1 / endJoint.body.mass;

  Creature.prototype._buildMuscles = function () {
    var self = this;

      var endBone = self._findBone(data.endBoneID);

      self.updateBoneGeometry(endBone);

        startBone.center.y,
        endBone.center.x,

        endBone: endBone,

        bone: bone,
        offset: data.offset,

      var velStartY = bone.startJoint.body.vy;
      var velEndX = bone.endJoint.body.vx;
      var velEndY = bone.endJoint.body.vy;

   * Simulation

    if (!muscle.living) return;

    var startBone = muscle.startBone;
    var endBone = muscle.endBone;

    var dx = endBone.center.x - startBone.center.x;
    var dy = endBone.center.y - startBone.center.y;
    var distance = Math.sqrt(dx * dx + dy * dy);
    if (distance < 1e-6) return;

    var nx = dx / distance;
    var ny = dy / distance;

    // `force` is the scalar force that is applied to the START bone along +n
    // (the END bone receives the opposite force).  A positive value therefore
    // pulls the two bones towards each other.

    // --- Passive spring (Unity's SpringJoint between the two bone centres) ---
    var extension = distance - muscle.restLength;
    var force = MUSCLE_SPRING_STRENGTH * extension;

    // Damping along the muscle axis: relative movement of the two bone
    // centres along the axis of the muscle.
    var relativeVelocityX = (endBone.centerVelocityX || 0) - (startBone.centerVelocityX || 0);
    var relativeVelocityY = (endBone.centerVelocityY || 0) - (startBone.centerVelocityY || 0);
    var axialVelocity = relativeVelocityX * nx + relativeVelocityY * ny;
    force += MUSCLE_SPRING_DAMPER * axialVelocity;

    // --- Active force (Muscle.Contract / Muscle.Expand) ---
    if (muscle.muscleAction === MuscleAction.CONTRACT) {
      // Pull the two bones towards each other.
      force += muscle.currentForce;
    } else if (muscle.data.canExpand) {
      // Push the two bones apart.
      force -= muscle.currentForce;
    }

    // The force acts on both bones, along the muscle axis, distributed
    // equally onto the two joints of each bone (no net torque).
    applyBoneForce(startBone, nx * force * 0.5, ny * force * 0.5);
    applyBoneForce(endBone, -nx * force * 0.5, -ny * force * 0.5);
  };

  /**
   * Turns the action of muscles attached to a wing into a bounded internal
   * torque. The base muscle force is applied at bone centres, which is
   * deliberately torque-free in this two-point solver; without this endpoint
   * pair a marked wing can remain almost motionless even while its muscle is
   * firing. The equal-and-opposite forces add no free linear lift — lift still
   * comes exclusively from `applyWingForce` once the wing moves through air.
   */
  Creature.prototype.applyWingStrokeTorque = function (bone) {
    if (!bone.isWing || !bone.connectedMuscles || !bone.connectedMuscles.length) {
      bone.wingStrokeForce = 0;
      return;
    }

    var signedMuscleForce = 0;
    for (var i = 0; i < bone.connectedMuscles.length; i++) {
      var muscle = bone.connectedMuscles[i];
      if (!muscle || !muscle.living || !(muscle.currentForce > 0)) continue;
      var direction = muscle.muscleAction === MuscleAction.EXPAND ? -1 : 1;
      signedMuscleForce += direction * muscle.currentForce;
    }
    if (bone.inverted) signedMuscleForce *= -1;

    var force = Utils.clamp(
      signedMuscleForce * Creature.WING_STROKE_TORQUE_SCALE,
      -Creature.WING_MAX_STROKE_FORCE,
      Creature.WING_MAX_STROKE_FORCE
    );
    bone.wingStrokeForce = force;
    if (Math.abs(force) < 1e-6) return;

    // Tangent points counter-clockwise around the bone. `strokeTangentSign`
    // gives a downward tip stroke for either a left- or right-facing wing.
    var tangentX = -bone.direction.y;
    var tangentY = bone.direction.x;
    var directedForce = force * bone.strokeTangentSign;
    var forceX = tangentX * directedForce;
    var forceY = tangentY * directedForce;
    bone.endJoint.body.fx += forceX;
    bone.endJoint.body.fy += forceY;
    bone.startJoint.body.fx -= forceX;
    bone.startJoint.body.fy -= forceY;
  };

  /**
   * Applies a bounded game-scale aerodynamic force at a wing's aerodynamic
   * center. The endpoint average misses the velocity caused by flapping, so
   * the local point velocity includes omega × radius from the wing root.
   */
  Creature.prototype.applyWingForce = function (bone) {
    if (!bone.isWing) return;

    var root = bone.startJoint.body;
    var direction = bone.direction;
    var length = Math.max(0.01, bone.length || bone.halfLength * 2 || 0.01);
    var centerFraction = Creature.WING_AERO_CENTER_FRACTION;
    var radiusX = direction.x * length * centerFraction;
    var radiusY = direction.y * length * centerFraction;
    var angularVelocity = bone.angularVelocity || 0;

    // Velocity at a rotating wing point: v(root) + angular velocity × radius.
    var pointVelocityX = root.vx - angularVelocity * radiusY;
    var pointVelocityY = root.vy + angularVelocity * radiusX;
    var airflowX = -pointVelocityX;
    var airflowY = -pointVelocityY;
    var speed = Math.sqrt(airflowX * airflowX + airflowY * airflowY);
    var chord = Math.max(0.1, bone.wingChord || (bone.data && bone.data.wingChord) || 1);
    var area = length * chord;
    var centerX = root.x + radiusX;
    var centerY = root.y + radiusY;

    var aerodynamicCenter = bone.aerodynamicCenter || (bone.aerodynamicCenter = { x: 0, y: 0 });
    aerodynamicCenter.x = centerX;
    aerodynamicCenter.y = centerY;
    var debug = bone.wingDebug;
    if (!debug) {
      debug = bone.wingDebug = {
        speed: 0,
        angleOfAttack: 0,
        area: 0,
        lift: 0,
        flapLift: 0,
        drag: 0,
        liftX: 0,
        liftY: 0,
        dragX: 0,
        dragY: 0,
        forceX: 0,
        forceY: 0,
        strokeForce: 0,
        activeStroke: false,
      };
    }
    debug.speed = speed;
    debug.angleOfAttack = 0;
    debug.area = area;
    debug.lift = 0;
    debug.flapLift = 0;
    debug.drag = 0;
    debug.liftX = 0;
    debug.liftY = 0;
    debug.dragX = 0;
    debug.dragY = 0;
    debug.forceX = 0;
    debug.forceY = 0;
    debug.strokeForce = bone.wingStrokeForce || 0;
    debug.activeStroke = false;
    if (speed < Creature.WING_MIN_SPEED) return;

    var inverted = bone.inverted === undefined ? !!bone.data.inverted : !!bone.inverted;
    // Only the powered half of the flap produces force. Invert selects which
    // vertical stroke is powered; this avoids symmetric up/down drag cancelling
    // all lift at a stationary takeoff.
    var activeStroke = Math.abs(pointVelocityY) < 0.05 ||
      (inverted ? pointVelocityY > 0 : pointVelocityY < 0);
    debug.activeStroke = activeStroke;
    if (!activeStroke) return;

    var flowDirectionX = airflowX / speed;
    var flowDirectionY = airflowY / speed;
    var spanX = direction.x;
    var spanY = direction.y;
    var dot = spanX * airflowX + spanY * airflowY;
    var cross = spanX * airflowY - spanY * airflowX;
    var angleOfAttack = Math.atan2(cross, dot);
    angleOfAttack = Utils.clamp(
      angleOfAttack,
      -Creature.WING_MAX_ANGLE_OF_ATTACK,
      Creature.WING_MAX_ANGLE_OF_ATTACK
    );

    var dynamicPressure =
      0.5 * Creature.WING_AIR_DENSITY * area * speed * speed * Creature.WING_FORCE_SCALE;
    var angleFactor = Math.abs(Math.sin(angleOfAttack));
    var liftCoefficient = Utils.clamp(
      Creature.WING_MAX_LIFT_COEFFICIENT * angleFactor,
      0,
      Creature.WING_MAX_LIFT_COEFFICIENT
    );
    var aerodynamicLiftMagnitude = dynamicPressure * liftCoefficient;
    var dragMagnitude = dynamicPressure * Creature.WING_DRAG_COEFFICIENT;

    // Aerodynamic lift is perpendicular to relative airflow; pitch determines
    // its sign. A bounded vertical flap-lift component lets a stationary
    // downstroke support takeoff in this 2D game model.
    var liftSign = angleOfAttack < 0 ? -1 : 1;
    if (inverted) liftSign *= -1;
    var liftX = -flowDirectionY * liftSign * aerodynamicLiftMagnitude;
    var liftY = flowDirectionX * liftSign * aerodynamicLiftMagnitude;
    var flapLiftMagnitude =
      dynamicPressure * Creature.WING_FLAP_LIFT_COEFFICIENT *
      Utils.clamp(Math.abs(pointVelocityY) / speed, 0, 1) * angleFactor;
    liftY += flapLiftMagnitude;
    var liftMagnitude = Math.sqrt(liftX * liftX + liftY * liftY);

    // Drag points with the relative airflow (opposite the wing's motion).
    var dragX = flowDirectionX * dragMagnitude;
    var dragY = flowDirectionY * dragMagnitude;
    var forceX = liftX + dragX;
    var forceY = liftY + dragY;

    var forceMagnitude = Math.sqrt(forceX * forceX + forceY * forceY);
    if (forceMagnitude > Creature.WING_MAX_FORCE) {
      var forceScale = Creature.WING_MAX_FORCE / forceMagnitude;
      liftX *= forceScale;
      liftY *= forceScale;
      dragX *= forceScale;
      dragY *= forceScale;
      forceX *= forceScale;
      forceY *= forceScale;
      liftMagnitude *= forceScale;
      flapLiftMagnitude *= forceScale;
      dragMagnitude *= forceScale;
    }

    debug.angleOfAttack = angleOfAttack;
    debug.lift = liftMagnitude;
    debug.flapLift = flapLiftMagnitude;
    debug.drag = dragMagnitude;
    debug.liftX = liftX;
    debug.liftY = liftY;
    debug.dragX = dragX;
    debug.dragY = dragY;
    debug.forceX = forceX;
    debug.forceY = forceY;

    applyWingForceAtPoint(bone, forceX, forceY, centerFraction);
  };

  /** Distributes the force at the wing center to its two endpoint masses. */
  function applyWingForceAtPoint(bone, fx, fy, fraction) {
    var root = bone.startJoint.body;
    var tip = bone.endJoint.body;
    root.fx += fx * (1 - fraction);
    root.fy += fy * (1 - fraction);
    tip.fx += fx * fraction;
    tip.fy += fy * fraction;
  }

  /** Distributes a force (already halved) onto both joints of a bone. */
  function applyBoneForce(bone, fx, fy) {
    bone.startJoint.body.fx += fx;
    bone.startJoint.body.fy += fy;
    bone.endJoint.body.fx += fx;
    bone.endJoint.body.fy += fy;
  }

  /**
   * Updates the velocities of the bone centres (used for the muscle damping).
   * Called once per simulation tick after the physics substeps.
   */
  Creature.prototype.updateBoneVelocities = function () {
    for (var i = 0; i < this.bones.length; i++) {
      var bone = this.bones[i];
      bone.centerVelocityX = (bone.startJoint.body.vx + bone.endJoint.body.vx) / 2;
      bone.centerVelocityY = (bone.startJoint.body.vy + bone.endJoint.body.vy) / 2;
    }
  };

  /* ------------------------------------------------------------------ *
   * Brain interface
   * ------------------------------------------------------------------ */
  Creature.prototype.updateBrain = function (dt) {
    if (!this.alive || this.recordingPlayer) return;

    // A shocked creature drops everything: no brain signals, no reflexes —
    // its muscles simply relax until the stun wears off.
    if (this.shockTimer > 0) {
      this.relaxMuscles();
      return;
    }

    if (this.brain) {
      this.brain.update(dt);
    }
    // The wing reflex runs after the network so a winged creature always
    // knows to flap while it is off the ground, regardless of its brain.
    if (this.autoFlap) {
      this.applyAutoFlap(dt);
    }
  };

  /**
   * Startles the creature, interrupting whatever it is currently doing.
   * While the stun lasts the brain and the wing reflex are suspended, all
   * muscles relax and the creature's motion decays (see `update`).
   * Returns true when the creature was actually shocked.
   */
  Creature.prototype.shock = function (duration) {
    if (!this.alive || this.recordingPlayer) return false;
    var stun = duration === undefined ? Creature.SHOCK_DURATION : duration;
    if (!(stun > 0)) return false;
    this.shockTimer = Math.max(this.shockTimer || 0, stun);
    this.flapPhase = 0;
    this.flapHold = 0;
    this.relaxMuscles();
    return true;
  };

  /** Lets every muscle go limp (used while a creature is shocked). */
  Creature.prototype.relaxMuscles = function () {
    for (var i = 0; i < this.muscles.length; i++) {
      this.muscles[i].currentForce = 0;
    }
  };

  /* ------------------------------------------------------------------ *
   * Automatic wing-flap reflex
   * ------------------------------------------------------------------ */
  /**
   * A creature "knows" it should flap when it has no ground contact or is
   * falling — those are exactly the moments a wing stroke can help.
   */
  Creature.prototype.shouldFlapWings = function () {
    var joints = this.joints;
    if (!joints.length) return false;
    var touchingGround = 0;
    var velocityY = 0;
    for (var i = 0; i < joints.length; i++) {
      if (joints[i].isCollidingWithGround) touchingGround++;
      velocityY += joints[i].body.vy;
    }
    if (touchingGround === 0) return true;
    return velocityY / joints.length < Creature.AUTO_FLAP_FALL_SPEED;
  };

  /**
   * Drives the wing-connected muscles with a rhythmic oscillator whenever
   * the creature is airborne or falling. The downstroke comes first so the
   * reflex produces lift as early as possible after leaving the ground.
   * On the ground the brain keeps full control of the wing muscles.
   */
  Creature.prototype.applyAutoFlap = function (dt) {
    if (!this.wingMuscles || !this.wingMuscles.length) return;

    if (this.shouldFlapWings()) {
      this.flapHold = Creature.AUTO_FLAP_HOLD;
    } else if (this.flapHold > 0) {
      this.flapHold -= dt;
    } else {
      // Resting: leave the wing muscles to the brain and restart the next
      // flap burst with a clean downstroke.
      this.flapPhase = 0;
      return;
    }

    this.flapPhase += 2 * Math.PI * Creature.AUTO_FLAP_FREQUENCY * dt;
    // Negative first: a contraction drives the wing tip downward (powered
    // downstroke), an expansion recovers for the next stroke.
    var drive = -Math.sin(this.flapPhase);
    for (var i = 0; i < this.wingMuscles.length; i++) {
      var muscle = this.wingMuscles[i];
      if (!muscle.living) continue;
      muscle.muscleAction =
        drive < 0 ? MuscleAction.CONTRACT : MuscleAction.EXPAND;
      muscle.currentForce =
        Math.max(0.05, Math.abs(drive)) * muscle.data.strength;
    }
  };

  /* ------------------------------------------------------------------ *
   * Recording playback (the best creatures of previous generations)
   * ------------------------------------------------------------------ */
  Creature.prototype.setRecordingPlayer = function (player) {
    this.recordingPlayer = player;
    if (player) {
      // Kinematic playback: the joints are moved directly.
      for (var i = 0; i < this.joints.length; i++) {
        this.joints[i].body.fixed = true;
      }
    } else {
      for (var j = 0; j < this.joints.length; j++) {
        this.joints[j].body.fixed = false;
      }
    }
  };

  Creature.prototype.updateRecordingPlayback = function (time) {
    if (!this.recordingPlayer) return;
    this.recordingPlayer.seekPlaybackToAbsoluteTime(time);
    for (var i = 0; i < this.joints.length; i++) {
      var position = this.recordingPlayer.getRecordedJointPosition(i);
      this.joints[i].body.x = position.x;
      this.joints[i].body.y = position.y;
      this.joints[i].body.vx = 0;
      this.joints[i].body.vy = 0;
    }
    for (var m = 0; m < this.muscles.length; m++) {
      var signedForce = this.recordingPlayer.getRecordedMuscleForce(m);
      this.muscles[m].muscleAction = signedForce >= 0 ? MuscleAction.CONTRACT : MuscleAction.EXPAND;
      this.muscles[m].currentForce = Math.abs(signedForce);
    }
    this.updateGeometry(1 / 60);
  };

  Creature.prototype.createRecorder = function (recordingDurationInSeconds) {
    this.recorder = new EVO.CreatureRecorder(
      recordingDurationInSeconds,
      this.joints.length,
      this.muscles.length
    );
    return this.recorder;
  };

  Creature.prototype.recordSample = function () {
    if (!this.recorder) return;
    if (this.recorder.currentSampleIndex >= this.recorder.sampleCount) return;
    var jointPositions = [];
    for (var i = 0; i < this.joints.length; i++) {
      jointPositions.push({ x: this.joints[i].body.x, y: this.joints[i].body.y });
    }
    var muscleForces = [];
    for (var m = 0; m < this.muscles.length; m++) {
      var signedForce = this.muscles[m].currentForce;
      if (this.muscles[m].muscleAction === MuscleAction.EXPAND) {
        signedForce *= -1;
      }
      muscleForces.push(signedForce);
    }
    this.recorder.recordSample(this.currentTime, jointPositions, muscleForces);
  };

  /* ------------------------------------------------------------------ *
   * Queries (port of the Creature.cs helper methods)
   * ------------------------------------------------------------------ */
  Creature.prototype.getStatistics = function (simulationTime) {
    var stats = EVO.CreatureStats.create();

    var fitness = this.objectiveTracker
      ? this.objectiveTracker.evaluateFitness(simulationTime)
      : 0;

    // Apply the fitness penalty for joints that touched the ground.
    var penaltyIndices = Object.keys(this.jointIdsWithPenalty);
    if (penaltyIndices.length > 0) {
      for (var i = 0; i < this.joints.length; i++) {
        var joint = this.joints[i];
        if (this.jointIdsWithPenalty[joint.data.id]) {
          fitness -= joint.data.fitnessPenaltyForTouchingGround;
        }
      }
    }
    fitness = Math.max(0, fitness);

    stats.unclampedFitness = fitness;
    stats.fitness = Utils.clamp(fitness, 0, 1);
    stats.horizontalDistanceTravelled = this.getXPosition() - this.initialPosition.x;
    stats.verticalDistanceTravelled = this.getYPosition() - this.initialPosition.y;
    stats.averageSpeed = Math.sqrt(
      Math.pow(stats.horizontalDistanceTravelled / simulationTime, 2) +
        Math.pow(stats.verticalDistanceTravelled / simulationTime, 2)
    );
    stats.numberOfBones = this.bones.length;
    stats.numberOfMuscles = this.muscles.length;
    stats.simulationTime = Math.round(simulationTime);
    var weight = 0;
    for (var j = 0; j < this.joints.length; j++) {
      weight += this.joints[j].data.weight;
    }
    for (var b = 0; b < this.bones.length; b++) {
      weight += this.bones[b].data.weight;
    }
    stats.weight = weight;
    stats.maxJumpingHeight = this.maxJumpingHeight;

    return stats;
  };

  Creature.prototype.calculateBasicBrainInputs = function () {
    var joints = this.joints;
    var minJointY = joints.length ? joints[0].body.y : 0;
    var maxJointY = minJointY;
    var velocityX = 0;
    var velocityY = 0;
    var angularVelZ = 0;
    var jointsCountTouchingGround = 0;
    var rotationZ = 0;

    var jointCount = joints.length;
    var boneCount = this.bones.length;

    for (var i = 0; i < jointCount; i++) {
      var body = joints[i].body;
      if (body.y > maxJointY) maxJointY = body.y;
      else if (body.y < minJointY) minJointY = body.y;

      velocityX += body.vx;
      velocityY += body.vy;

      jointsCountTouchingGround += joints[i].isCollidingWithGround ? 1 : 0;
    }

    for (var b = 0; b < boneCount; b++) {
      var bone = this.bones[b];
      angularVelZ += bone.angularVelocity;

      if (this.usesLegacyRotationCalculation) {
        rotationZ += bone.angle;
      } else {
        // (eulerAngles.z - 180) * 1/360
        var degrees = Utils.repeat(bone.angle * Utils.Rad2Deg, 360);
        rotationZ += (degrees - 180) * 0.002778;
      }
    }

    var distFromFloor = minJointY;
    if (jointCount > 0) {
      velocityX /= jointCount;
      velocityY /= jointCount;
    }
    if (boneCount > 0) {
      angularVelZ /= boneCount;
      rotationZ /= boneCount;
    }

    return {
      DistanceFromFloor: distFromFloor,
      VelocityX: velocityX,
      VelocityY: velocityY,
      AngularVelocity: angularVelZ,
      PointsTouchingGroundCount: jointsCountTouchingGround,
      Rotation: rotationZ,
    };
  };

  Creature.prototype.raycastDistance = function (origin, direction, maxDistance, mask) {
    if (maxDistance === undefined) maxDistance = Infinity;
    var hit = this.world.raycast(origin.x, origin.y, direction.x, direction.y, maxDistance, mask);
    return hit ? hit.distance : 0;
  };

  Creature.prototype.distanceFromGround = function (position) {
    var origin = position || this.getLowestPoint();
    var hit = this.world.raycast(origin.x, origin.y + 0.05, 0, -1, Infinity, ['static']);
    if (!hit) return 0;
    return Math.max(0, hit.distance - 0.05);
  };

  Creature.prototype.semiSafeDistanceFromGround = function (sceneContainsStairs) {
    var jointCount = Math.min(5, this.joints.length);
    var sorted = this.joints.slice().sort(function (lhs, rhs) {
      return lhs.body.y - rhs.body.y;
    });
    var minDistance = Infinity;
    for (var i = 0; i < jointCount; i++) {
      var distance = this.distanceFromGround({ x: sorted[i].body.x, y: sorted[i].body.y });
      minDistance = Math.min(minDistance, distance);
    }
    if (sceneContainsStairs && this.joints.length > 0) {
      var sin45 = Math.sin(-0.25 * Math.PI);
      var cos45 = Math.cos(-0.25 * Math.PI);
      var lowestIndex = 0;
      var lowestY = Infinity;
      for (var j = 0; j < this.joints.length; j++) {
        var body = this.joints[j].body;
        var rotatedY = body.y * cos45 + body.x * sin45;
        if (rotatedY < lowestY) {
          lowestY = rotatedY;
          lowestIndex = j;
        }
      }
      var position = this.joints[lowestIndex].body;
      var stairHeight = 3.36 + position.x;
      minDistance = Math.min(minDistance, position.y - stairHeight);
    }
    return minDistance;
  };

  /**
   * Moves the creature upwards until none of its joints overlaps the static
   * geometry.  Used when placing a creature so that it can never spawn inside
   * the ground (which would make the physics explode).
   */
  Creature.prototype.resolveStaticOverlap = function (maxIterations) {
    maxIterations = maxIterations || 40;
    if (!this.scene || !this.scene.world) return;
    for (var iteration = 0; iteration < maxIterations; iteration++) {
      var push = 0;
      for (var i = 0; i < this.joints.length; i++) {
        var body = this.joints[i].body;
        var penetration = this.scene.world.staticPenetration(body.x, body.y, body.radius);
        if (penetration > push) push = penetration;
      }
      if (push <= 0.001) return;
      this.translate(0, push + 0.01);
    }
  };

  Creature.prototype.getVelocity = function () {
    if (this.joints.length === 0) return { x: 0, y: 0 };
    var x = 0,
      y = 0;
    for (var i = 0; i < this.joints.length; i++) {
      x += this.joints[i].body.vx;
      y += this.joints[i].body.vy;
    }
    return { x: x / this.joints.length, y: y / this.joints.length };
  };

  Creature.prototype.getAngularVelocity = function () {
    if (this.bones.length === 0) return 0;
    var total = 0;
    for (var i = 0; i < this.bones.length; i++) {
      total += this.bones[i].angularVelocity;
    }
    return total / this.bones.length;
  };

  Creature.prototype.getNumberOfPointsTouchingGround = function () {
    var count = 0;
    for (var i = 0; i < this.joints.length; i++) {
      count += this.joints[i].isCollidingWithGround ? 1 : 0;
    }
    return count;
  };

  Creature.prototype.addObstacleCollidingJointsToSet = function (set) {
    for (var i = 0; i < this.joints.length; i++) {
      if (this.joints[i].isCollidingWithObstacle) {
        set.add(this.joints[i]);
      }
    }
  };

  Creature.prototype.getRotation = function () {
    if (this.bones.length === 0) return 0;
    var rotation = 0;
    for (var i = 0; i < this.bones.length; i++) {
      var bone = this.bones[i];
      if (this.usesLegacyRotationCalculation) {
        rotation += bone.angle;
      } else {
        rotation += (Utils.repeat(bone.angle * Utils.Rad2Deg, 360) - 180) * 0.002778;
      }
    }
    return rotation / this.bones.length;
  };

  Creature.prototype.getXPosition = function () {
    var total = 0;
    for (var i = 0; i < this.joints.length; i++) {
      total += this.joints[i].body.x;
    }
    return this.joints.length === 0 ? 0 : total / this.joints.length;
  };

  Creature.prototype.getYPosition = function () {
    var total = 0;
    for (var i = 0; i < this.joints.length; i++) {
      total += this.joints[i].body.y;
    }
    return this.joints.length === 0 ? 0 : total / this.joints.length;
  };

    <script>
      /* Source: js/sim/brain.js */
/*
 * Evolution (Web Edition) — sim/brain.js
 * ---------------------------------------------------------------
 * Port of the brains and the objective trackers of the original:
 *   Assets/Scripts/Creature/Brains/*.cs
 *   Assets/Scripts/Util/*ObjectiveTracker.cs
 *
 * The "Universal" brain is used for all new simulations.  It receives 11
 * input values (six distance sensor readings and five proprioceptive values)
 * and produces one output per unique muscle id plus one additional output
 * that rotates the direction of the custom distance sensor.
 */
(function (global) {
  'use strict';

  var EVO = (global.EVO = global.EVO || {});
  var Utils = EVO.Utils;

  var BrainType = {
    Universal: 0,
    LegacyRunningBrain: 1,
    LegacyJumpingBrain: 2,
    LegacyObstacleJumpBrain: 3,
    LegacyClimbingBrain: 4,
  };

  /* ------------------------------------------------------------------ *
   * Brain
   * ------------------------------------------------------------------ */
  function Brain(creature) {
    this.creature = creature;
    this.network = null;
    this.muscles = [];
    this.muscleToOutputIndex = [];
    this.numberOfUniqueMuscleIds = 0;
    this.additionalOutputs = 0;
    this.numberOfInputs = 0;
  }

  Brain.prototype.getNumberOfOutputs = function () {
    return this.numberOfUniqueMuscleIds + this.additionalOutputs;
  };

  Brain.prototype.init = function (networkSettings, muscles, uniqueMusclesContext, chromosome) {
    this.muscles = muscles;
    this.muscleToOutputIndex = uniqueMusclesContext.muscleToOutputIndex;
    this.numberOfUniqueMuscleIds = uniqueMusclesContext.numberOfUniqueMuscleIds;

    this.network = new EVO.FeedForwardNetwork(
      this.numberOfInputs,
      this.getNumberOfOutputs(),
      networkSettings,
      chromosome
    );
  };

  Brain.prototype.update = function (dt) {
    if (!this.network || !this.creature.alive || this.creature.recordingPlayer) return;
    this.updateInputs();
    var outputs = this.network.calculateOutputs();
    this.applyOutputs(outputs);
  };

  Brain.prototype.applyOutputs = function (outputs) {
    for (var i = 0; i < this.muscles.length; i++) {
      var outputIndex = this.muscleToOutputIndex[i];
      var output = outputs[outputIndex];
      if (isNaN(output)) output = 0;
      this.applyOutputToMuscle(output, this.muscles[i]);
    }
  };

  Brain.prototype.applyOutputToMuscle = function (output, muscle) {
    // Maps the sigmoid output from [0, 1] to a range of [-1, 1].
    var percent = 2 * output - 1;
    if (percent < 0) {
      muscle.muscleAction = EVO.Creature.MuscleAction.CONTRACT;
    } else {
      muscle.muscleAction = EVO.Creature.MuscleAction.EXPAND;
    }
    this.setContractionForce(muscle, Math.abs(percent));
  };

  Brain.prototype.setContractionForce = function (muscle, percent) {
    var maxForce = muscle.data.strength;
    muscle.currentForce = Math.max(0.01, Math.min(maxForce, percent * maxForce));
  };

  Brain.prototype.toChromosomeString = function () {
    return this.network.toBinaryString();
  };

  /* --- Legacy brains (6 inputs, used for simulations started with v2) --- */
  function SimpleBrain(creature, numberOfInputs) {
    Brain.call(this, creature);
    this.numberOfInputs = numberOfInputs;
  }
  SimpleBrain.prototype = Object.create(Brain.prototype);
  SimpleBrain.prototype.constructor = SimpleBrain;

  SimpleBrain.prototype.updateInputs = function () {
    var inputs = this.network.inputs;
    var basicInputs = this.creature.calculateBasicBrainInputs();
    inputs[0] = basicInputs.DistanceFromFloor;
    inputs[1] = basicInputs.VelocityX;
    inputs[2] = basicInputs.VelocityY;
    inputs[3] = basicInputs.AngularVelocity;
    inputs[4] = basicInputs.PointsTouchingGroundCount;
    inputs[5] = basicInputs.Rotation;
  };

  function RunningBrain(creature) {
    SimpleBrain.call(this, creature, 6);
  }
  RunningBrain.prototype = Object.create(SimpleBrain.prototype);

  function JumpingBrain(creature) {
    SimpleBrain.call(this, creature, 6);
  }
  JumpingBrain.prototype = Object.create(SimpleBrain.prototype);
  JumpingBrain.prototype.updateInputs = function () {
    var inputs = this.network.inputs;
    inputs[0] = this.creature.distanceFromGround();
    var velocity = this.creature.getVelocity();
    inputs[1] = velocity.x;
    inputs[2] = velocity.y;
    inputs[3] = this.creature.getAngularVelocity();
    inputs[4] = this.creature.getNumberOfPointsTouchingGround();
    inputs[5] = this.creature.getRotation();
  };

  function ClimbingBrain(creature) {
    JumpingBrain.call(this, creature);
    this.numberOfInputs = 6;
  }
  ClimbingBrain.prototype = Object.create(JumpingBrain.prototype);

  function ObstacleJumpingBrain(creature) {
    JumpingBrain.call(this, creature);
    this.numberOfInputs = 7;
    this.obstacle = null;
  }
  ObstacleJumpingBrain.prototype = Object.create(JumpingBrain.prototype);
  ObstacleJumpingBrain.prototype.updateInputs = function () {
    JumpingBrain.prototype.updateInputs.call(this);
    // An obstacle course can keep extending, so refresh the target after a
    // block is cleared instead of holding on to the first block forever.
    this.obstacle = this.creature.getObstacle();
    this.network.inputs[6] = this.creature.getDistanceFromObstacle(this.obstacle);
  };

  /* --- The universal brain ------------------------------------------- */
  function UniversalBrain(creature) {
    Brain.call(this, creature);
    this.numberOfInputs = UniversalBrain.NUMBER_OF_INPUTS;
    this.additionalOutputs = UniversalBrain.NUMBER_OF_ADDITIONAL_OUTPUTS;
    this.customRaycastAngle = 0;
  }
  UniversalBrain.prototype = Object.create(Brain.prototype);

  UniversalBrain.NUMBER_OF_INPUTS = 11;
  UniversalBrain.NUMBER_OF_ADDITIONAL_OUTPUTS = 1;
  UniversalBrain.MAX_RAYCAST_DISTANCE = 20;
  UniversalBrain.ANGLE_SMOOTHING_WEIGHT = 0.1;

  UniversalBrain.prototype.updateInputs = function () {
    var creature = this.creature;
    var inputs = this.network.inputs;
    var basicInputs = creature.calculateBasicBrainInputs();

    var center = { x: creature.getXPosition(), y: creature.getYPosition() };

    inputs[0] = creature.distanceFromGround();
    inputs[1] = creature.raycastDistance(center, { x: 1, y: 0 }, UniversalBrain.MAX_RAYCAST_DISTANCE);
    inputs[2] = creature.raycastDistance(center, { x: 1, y: -1 }, UniversalBrain.MAX_RAYCAST_DISTANCE);
    inputs[3] = creature.raycastDistance(center, { x: -1, y: -1 }, UniversalBrain.MAX_RAYCAST_DISTANCE);
    inputs[4] = creature.raycastDistance(center, { x: -1, y: 0 }, UniversalBrain.MAX_RAYCAST_DISTANCE);

    var direction = {
      x: Math.cos(this.customRaycastAngle),
      y: Math.sin(this.customRaycastAngle),
    };
    inputs[5] = creature.raycastDistance(center, direction, UniversalBrain.MAX_RAYCAST_DISTANCE);

    inputs[6] = basicInputs.VelocityX;
    inputs[7] = basicInputs.VelocityY;
    inputs[8] = basicInputs.AngularVelocity;
    inputs[9] = basicInputs.PointsTouchingGroundCount;
    inputs[10] = basicInputs.Rotation;
  };

  UniversalBrain.prototype.applyOutputs = function (outputs) {
    Brain.prototype.applyOutputs.call(this, outputs);
    var newRaycastAngle = outputs[outputs.length - 1] * 2 * Math.PI;
    this.customRaycastAngle =
      UniversalBrain.ANGLE_SMOOTHING_WEIGHT * newRaycastAngle +
      (1 - UniversalBrain.ANGLE_SMOOTHING_WEIGHT) * this.customRaycastAngle;
  };

  /* ------------------------------------------------------------------ *
   * Unique muscles context (Brain.CalculateUniqueMusclesContext)
   * ------------------------------------------------------------------ */
  function calculateUniqueMusclesContext(muscles) {
    var numberOfUniqueMuscleIds = 0;
    var muscleToOutputIndex = new Array(muscles.length);
    // User-supplied muscle ids can be strings like "__proto__" or "constructor".
    // A null-prototype map keeps those ids from colliding with Object.prototype.
    var userIdToIndex = Object.create(null);

    for (var i = 0; i < muscles.length; i++) {
      var muscle = muscles[i];
      var outputIndex = numberOfUniqueMuscleIds;
      if (!muscle.userId) {
        numberOfUniqueMuscleIds++;
      } else {
        if (userIdToIndex[muscle.userId] === undefined) {
          outputIndex = numberOfUniqueMusclesIdAssign(userIdToIndex, muscle.userId, numberOfUniqueMuscleIds);
          numberOfUniqueMuscleIds++;
        } else {
          outputIndex = userIdToIndex[muscle.userId];
        }
      }
      muscleToOutputIndex[i] = outputIndex;
    }

    return {
      numberOfUniqueMuscleIds: numberOfUniqueMuscleIds,
      muscleToOutputIndex: muscleToOutputIndex,
    };
  }

  function numberOfUniqueMusclesIdAssign(map, userId, index) {
    map[userId] = index;
    return index;
  }

  /* ------------------------------------------------------------------ *
   * Objective trackers
   * ------------------------------------------------------------------ */
  var ObjectiveTracker = {
    create: function (objective, creature) {
      switch (objective) {
        case EVO.Objective.Running:
          return new RunningObjectiveTracker(creature);
        case EVO.Objective.Jumping:
          return new JumpingObjectiveTracker(creature);
        case EVO.Objective.ObstacleJump:
          return new ObstacleJumpObjectiveTracker(creature);
        case EVO.Objective.Climbing:
          return new ClimbingObjectiveTracker(creature);
        case EVO.Objective.Flying:
          return new FlyingObjectiveTracker(creature);
      }
      return new RunningObjectiveTracker(creature);
    },
  };

  function RunningObjectiveTracker(creature) {
    this.creature = creature;
  }
  /** The optimal distance a perfect creature could travel in 10 seconds. */
  RunningObjectiveTracker.MAX_DISTANCE = 55;

  RunningObjectiveTracker.prototype.fixedUpdate = function () {};

  RunningObjectiveTracker.prototype.evaluateFitness = function (simulationTime) {
    return (
      (this.creature.getXPosition() - this.creature.initialPosition.x) /
      (RunningObjectiveTracker.MAX_DISTANCE * simulationTime)
    );
  };

  function JumpingObjectiveTracker(creature) {
    this.creature = creature;
    this.maxHeightJumped = 0;
    this.maxWeightedAverageHeight = 0;
  }
  JumpingObjectiveTracker.MAX_HEIGHT = 20;

  JumpingObjectiveTracker.prototype.fixedUpdate = function () {
    var creature = this.creature;
    var distanceFromGround = creature.distanceFromGround();
    var maxHeight =
      creature.getHighestPoint().y - creature.getLowestPoint().y + distanceFromGround;
    this.maxHeightJumped = Math.max(distanceFromGround, this.maxHeightJumped);
    this.maxWeightedAverageHeight = Math.max(
      (4 * distanceFromGround + maxHeight) / 5,
      this.maxWeightedAverageHeight
    );
  };

  JumpingObjectiveTracker.prototype.evaluateFitness = function () {
    return this.maxWeightedAverageHeight / JumpingObjectiveTracker.MAX_HEIGHT;
  };

  function ClimbingObjectiveTracker(creature) {
    this.creature = creature;
  }
  ClimbingObjectiveTracker.MAX_HEIGHT = 100;

  ClimbingObjectiveTracker.prototype.fixedUpdate = function () {};

  ClimbingObjectiveTracker.prototype.evaluateFitness = function (simulationTime) {
    var maxHeight = (ClimbingObjectiveTracker.MAX_HEIGHT * simulationTime) / 10;
    var verticalDistanceFromSpawn = this.creature.getYPosition() - this.creature.initialPosition.y;
    return verticalDistanceFromSpawn / maxHeight + 0.5;
  };

  function FlyingObjectiveTracker(creature) {
    this.creature = creature;
    this.maxHeightJumped = 0;
    this.totalFrameCount = 0;
    this.framesSpentNotTouchingGround = 0;
    this.settledOnGround = false;
    this.currentAirborneTime = 0;
    this.totalAirborneTime = 0;
    this.maxSustainedAirborneTime = 0;
    this.totalAirborneHeight = 0;
  }
  FlyingObjectiveTracker.MAX_HEIGHT = 40;

  FlyingObjectiveTracker.prototype.fixedUpdate = function (dt) {
    var creature = this.creature;
    var touchingGroundCount = creature.getNumberOfPointsTouchingGround();
    if (!this.settledOnGround) {
      // Ignore the initial drop from the spawn position. Start measuring only
      // after at least one ground contact proves the creature has settled.
      if (touchingGroundCount > 0) this.settledOnGround = true;
      return;
    }

    this.totalFrameCount += 1;
    if (touchingGroundCount > 0) {
      this.currentAirborneTime = 0;
      return;
    }

    var distanceFromGround = Math.max(0, creature.distanceFromGround());
    this.maxHeightJumped = Math.max(distanceFromGround, this.maxHeightJumped);
    this.framesSpentNotTouchingGround += 1;
    this.totalAirborneHeight += distanceFromGround;
    this.currentAirborneTime += dt || 0;
    this.totalAirborneTime += dt || 0;
    this.maxSustainedAirborneTime = Math.max(
      this.maxSustainedAirborneTime,
      this.currentAirborneTime
    );
  };

  FlyingObjectiveTracker.prototype.evaluateFitness = function (simulationTime) {
    if (!this.settledOnGround || this.totalFrameCount === 0) return 0;
    simulationTime = Math.max(0.001, simulationTime || 0);
    var durationScale = Math.min(1, simulationTime / 10.0);
    var maxHeightFitness = Utils.clamp(
      (this.maxHeightJumped / FlyingObjectiveTracker.MAX_HEIGHT) * durationScale,
      0,
      1
    );
    var averageAirborneHeight = this.framesSpentNotTouchingGround
      ? this.totalAirborneHeight / this.framesSpentNotTouchingGround
      : 0;
    var averageHeightFitness = Utils.clamp(
      (averageAirborneHeight / FlyingObjectiveTracker.MAX_HEIGHT) * durationScale,
      0,
      1
    );
    var airtimeFitness = this.framesSpentNotTouchingGround / this.totalFrameCount;
    var sustainedAirtimeFitness = Utils.clamp(
      this.maxSustainedAirborneTime / simulationTime,
      0,
      1
    );

    // Max height still matters, but average airborne height and continuous
    // airtime make a brief jump less valuable than controlled sustained flight.
    return Utils.clamp(
      0.2 * maxHeightFitness +
        0.1 * averageHeightFitness +
        0.35 * airtimeFitness +
        0.35 * sustainedAirtimeFitness,
      0,
      1
    );
  };

  function ObstacleJumpObjectiveTracker(creature) {
    this.creature = creature;
    this.collisionDurations = new Map();
    this.collidedJoints = new Set();

    this.blocks = creature.scene && Array.isArray(creature.scene.blocks) ? creature.scene.blocks : [];
    this.passedBlockIndices = Object.create(null);
    this.passedBlockCount = 0;
    this.initialX = creature.initialPosition ? creature.initialPosition.x : creature.getXPosition();

  ObstacleJumpObjectiveTracker.MAX_COLLISION_DURATION_PER_JOINT = 0.4;

  ObstacleJumpObjectiveTracker.prototype.getLeadingEdgeX = function () {
    var joints = this.creature.joints || [];
    var maxX = -Infinity;
    for (var i = 0; i < joints.length; i++) {
      var body = joints[i].body || joints[i];
      maxX = Math.max(maxX, body.x + (body.radius || 0));
    }
    return maxX === -Infinity ? this.creature.getXPosition() : maxX;
  };

  ObstacleJumpObjectiveTracker.prototype.getTrailingEdgeX = function () {
    var joints = this.creature.joints || [];
    var minX = Infinity;
    for (var i = 0; i < joints.length; i++) {
      var body = joints[i].body || joints[i];
      minX = Math.min(minX, body.x - (body.radius || 0));
    }
    return minX === Infinity ? this.creature.getXPosition() : minX;
  };

  ObstacleJumpObjectiveTracker.prototype.fixedUpdate = function (dt) {
    var creature = this.creature;
    this.maxHeightJumped = Math.max(creature.distanceFromGround(), this.maxHeightJumped);

    if (this.blocks.length) {
      this.maxForwardX = Math.max(this.maxForwardX, this.getLeadingEdgeX());
      var trailingEdgeX = this.getTrailingEdgeX();
      for (var i = 0; i < this.blocks.length; i++) {
        var block = this.blocks[i];
        var blockIndex = block.index === undefined ? i : block.index;
        if (this.passedBlockIndices[blockIndex]) continue;
        var rightEdge = block.right === undefined ? block.x + block.width / 2 : block.right;
        // Count a block only after the whole creature has cleared its far edge.
        if (trailingEdgeX > rightEdge + 0.05) {
          this.passedBlockIndices[blockIndex] = true;
          this.passedBlockCount++;
        }
      }
    }

    creature.addObstacleCollidingJointsToSet(this.collidedJoints);
    var self = this;
    this.collidedJoints.forEach(function (joint) {
      var duration = self.collisionDurations.get(joint) || 0;
      duration += dt;
      self.collisionDurations.set(joint, duration);
    });
    this.collidedJoints.clear();
  };

  ObstacleJumpObjectiveTracker.prototype.evaluateFitness = function () {
    var heightFitness = Utils.clamp(
      this.maxHeightJumped / ObstacleJumpObjectiveTracker.MAX_HEIGHT,
      0,
      1
    );
    var totalCollisionDuration = 0;
    this.collisionDurations.forEach(function (duration) {
      totalCollisionDuration += duration;
    });
    var jointCount = this.creature.joints ? this.creature.joints.length : 0;
    var averageCollisionDuration = jointCount ? totalCollisionDuration / jointCount : 0;

    var collisionFitness =
      1 -
      Utils.clamp(
        averageCollisionDuration / ObstacleJumpObjectiveTracker.MAX_COLLISION_DURATION_PER_JOINT,
        0,
        1
      );

    if (this.blocks.length) {
      // There is deliberately no final block. A saturating score keeps the
      // evolutionary selection range bounded while every additional clear and
      // every bit of forward travel continues to improve the reward.
      var spacing = this.blocks.length > 1
        ? Math.max(1, this.blocks[1].x - this.blocks[0].x)
        : 6;
      var passedFitness = 1 - Math.exp(-this.passedBlockCount / 3);
      var forwardDistance = Math.max(0, this.maxForwardX - this.initialX);
      var progressFitness = 1 - Math.exp(-forwardDistance / (spacing * 4));
      // Clearing a block is the main signal; progress and avoiding prolonged
      // contact still help a creature discover the next jump.
      return Utils.clamp(
        0.8 * passedFitness + 0.15 * progressFitness + 0.05 * collisionFitness,
        0,
        1
      );
    }

    // Preserve the legacy rolling-obstacle scoring for old saved scenes.
    return Math.max(
      0.5 * collisionFitness,
      0.3 * heightFitness + 0.7 * collisionFitness
    );
  };

  /* ------------------------------------------------------------------ *
   * Brain factory (Evolution.GetBrainTypeForSimulation)
   * ------------------------------------------------------------------ */
  var Brains = {
    BrainType: BrainType,

    numberOfInputsForBrainType: function (brainType) {
      switch (brainType) {
        case BrainType.LegacyRunningBrain:
        case BrainType.LegacyJumpingBrain:
        case BrainType.LegacyClimbingBrain:
          return 6;
        case BrainType.LegacyObstacleJumpBrain:
          return 7;
        case BrainType.Universal:
          return UniversalBrain.NUMBER_OF_INPUTS;
      }
      return UniversalBrain.NUMBER_OF_INPUTS;
    },

    numberOfOutputsForBrainType: function (brainType, uniqueMusclesContext) {
      if (brainType === BrainType.Universal) {
        return (
          uniqueMusclesContext.numberOfUniqueMuscleIds + UniversalBrain.NUMBER_OF_ADDITIONAL_OUTPUTS
        );
      }
      return uniqueMusclesContext.numberOfUniqueMuscleIds;
    },

    brainTypeForSimulation: function (objective, lastV2SimulatedGeneration) {
      var useLegacyBrains = lastV2SimulatedGeneration > 0;
      if (!useLegacyBrains) return BrainType.Universal;
      switch (objective) {
        case EVO.Objective.Running:
          return BrainType.LegacyRunningBrain;
        case EVO.Objective.Jumping:
          return BrainType.LegacyJumpingBrain;
        case EVO.Objective.ObstacleJump:
          return BrainType.LegacyObstacleJumpBrain;
        case EVO.Objective.Climbing:
          return BrainType.LegacyClimbingBrain;
      }
      return BrainType.Universal;
    },

    create: function (brainType, creature) {
      switch (brainType) {
        case BrainType.LegacyRunningBrain:
          return new RunningBrain(creature);
        case BrainType.LegacyJumpingBrain:
          return new JumpingBrain(creature);
        case BrainType.LegacyObstacleJumpBrain:
          return new ObstacleJumpingBrain(creature);
        case BrainType.LegacyClimbingBrain:
          return new ClimbingBrain(creature);
        case BrainType.Universal:
        default:
          return new UniversalBrain(creature);
      }
    },
  };

  EVO.Brain = Brain;
  EVO.UniversalBrain = UniversalBrain;
  EVO.CalculateUniqueMusclesContext = calculateUniqueMusclesContext;
  EVO.ObjectiveTracker = ObjectiveTracker;
  EVO.Brains = Brains;
  EVO.BrainType = BrainType;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = EVO;
  }
})(typeof window !== 'undefined' ? window : globalThis);

      /* Source: js/sim/builder.js */
/*
 * Evolution (Web Edition) — sim/builder.js
 * ---------------------------------------------------------------
 * Port of Assets/Scripts/Controllers/CreatureBuilder.cs — the model behind
 * the creature editor.  All editing operations work on a CreatureDesign and
 * return whether the design was modified.
 */
(function (global) {
  'use strict';

  var EVO = (global.EVO = global.EVO || {});
  var Utils = EVO.Utils;

  /** The minimum distance between two joints when they are placed. */
  var JOINT_NON_OVERLAP_RADIUS = 0.6;
  /** The thickness of a bone. */
  var CONNECTION_WIDTH = 0.5;

  function CreatureBuilder(design) {
    this.design = design ? EVO.CreatureDesign.decode(EVO.CreatureDesign.encode(design)) : EVO.CreatureDesign.empty();
    this.name = this.design.name === 'Unnamed' ? '' : this.design.name;
    this.idCounter = EVO.CreatureDesign.nextFreeId(this.design);
    // The component that is currently being placed.
    this.currentBone = null; // {id, startJointID, endJointID}
    this.currentMuscle = null;
    this.currentDecoration = null;
  }

  CreatureBuilder.JOINT_NON_OVERLAP_RADIUS = JOINT_NON_OVERLAP_RADIUS;
  CreatureBuilder.CONNECTION_WIDTH = CONNECTION_WIDTH;

  CreatureBuilder.prototype.design_ = function () {
    return this.design;
  };

  /* ------------------------------------------------------------------ *

    var actualBatchSize = this.Settings.SimulateInBatches
      ? this.Settings.BatchSize
      : this.Settings.PopulationSize;
    this.actualBatchSize = actualBatchSize;
    this.numberOfBatches = Math.ceil(this.Settings.PopulationSize / actualBatchSize);

    // Make sure the chromosome pool is complete.
    if (this.data.CurrentChromosomes.length < populationSize) {
      var brainType = EVO.Brains.brainTypeForSimulation(
        this.Settings.Objective,
        this.data.LastV2SimulatedGeneration
      );
      var inputCount = EVO.Brains.numberOfInputsForBrainType(brainType);
      var outputCount = EVO.Brains.numberOfOutputsForBrainType(brainType, this.uniqueMusclesContext);
      var chromosomeLength = EVO.FeedForwardNetwork.chromosomeLength(
        inputCount,
        outputCount,
        this.NetworkSettings
      );
      while (this.data.CurrentChromosomes.length < populationSize) {
        var weights = new Array(chromosomeLength);
        EVO.FeedForwardNetwork.populateRandomWeights(weights);
        this.data.CurrentChromosomes.push(weights);
      }
    }

    if (!suppressEvents) this.onEvent('newGenerationDidBegin', this.currentGenerationNumber);
    this.beginBatch(suppressEvents);
  };

  /** Rebuilds the prepared next generation while its previous replay is showing. */
  Evolution.prototype.reconfigurePendingGeneration = function () {
    if (!this.isRunning || !this.paused || !this.playbackPending || !this.completedSolutions) {
      return false;
    }
    var nextSettings = this.SettingsForNextGeneration;
    this.data.CurrentChromosomes = this.createNewChromosomes(
      nextSettings.PopulationSize,
      this.completedSolutions,
      nextSettings.KeepBestCreatures,
      nextSettings
    );
    this.state = 'idle';
    this.beginGeneration(true);
    return true;
  };

  Evolution.prototype.beginBatch = function (suppressEvents) {
    this.teardownBatch();

    var remainingCreatures =
      this.Settings.PopulationSize - (this.currentBatchNumber - 1) * this.actualBatchSize;
    var currentBatchSize = Math.min(this.actualBatchSize, remainingCreatures);
    this.currentBatchSize = currentBatchSize;

    this.world = new EVO.PhysicsWorld();
    this.scene = new EVO.Scene(this.world, this.SceneDescription);

    var batch = [];
    for (var i = 0; i < currentBatchSize; i++) {
      var creature = new EVO.Creature(this.world, this.data.CreatureDesign, {
        scene: this.scene,
        creatureIndex: i,
      });
      creature.objectiveTracker = EVO.ObjectiveTracker.create(this.Settings.Objective, creature);
      creature.usesLegacyRotationCalculation = this.data.LastV2SimulatedGeneration > 0;
      creature.autoFlap = !EVO.Settings || EVO.Settings.AutoFlapEnabled !== false;
      creature.initialPosition = { x: creature.getXPosition(), y: creature.getYPosition() };
      batch.push(creature);
    }
    this.currentCreatureBatch = batch;

    // Position the creatures on the ground and apply their brains.
    this.placeCreatures(batch);

    var chromosomeCount = Math.min(this.data.CurrentChromosomes.length, batch.length);
    var chromosomes = [];
    for (var c = 0; c < chromosomeCount; c++) {
      chromosomes.push(this.data.CurrentChromosomes[c + this.chromosomeOffset]);
    }
    this.chromosomeOffset += batch.length;
    this.applyBrains(batch, chromosomes);

    // Recorders (one per creature of a batch, reused between batches).
    var numberOfJoints = batch.length ? batch[0].joints.length : 0;
    var numberOfMuscles = batch.length ? batch[0].muscles.length : 0;
    var recordingDurationInSeconds = Math.min(10, this.Settings.SimulationTime);
    for (var r = 0; r < this.actualBatchSize; r++) {
      var recorder = this.recorders[r];
      var needsNewRecorder =
        !recorder ||
        recorder.recordingDurationInSeconds !== recordingDurationInSeconds ||
        recorder.numberOfJoints !== numberOfJoints ||
        recorder.numberOfMuscles !== numberOfMuscles;
      if (needsNewRecorder && batch.length) {
        this.recorders[r] = new EVO.CreatureRecorder(
          recordingDurationInSeconds,
          numberOfJoints,
          numberOfMuscles
        );
      } else if (this.recorders[r]) {
        this.recorders[r].reset();
      }
    }
    for (var j = 0; j < batch.length; j++) {
      batch[j].recorder = this.recorders[j] || null;
    }

    for (var b = 0; b < batch.length; b++) {
      batch[b].prepareForEvolution();
    }
    // Reset the dynamic structures (obstacles) for a fresh batch.
    this.scene.reset();

    this.batchElapsed = 0;
    this.accumulator = 0;
    this.tickCount = 0;

    if (!suppressEvents) {
      this.onEvent('newBatchDidBegin', {
        generation: this.currentGenerationNumber,
        batch: this.currentBatchNumber,
        batchCount: this.numberOfBatches,
      });
    }
  };

  Evolution.prototype.placeCreatures = function (batch) {
    var dropHeight = this.SceneDescription.DropHeight;
    var sceneContainsStairs = this.Settings.Objective === EVO.Objective.Climbing;

    for (var i = 0; i < batch.length; i++) {
      var creature = batch[i];
      var distance = creature.semiSafeDistanceFromGround(sceneContainsStairs);
      if (!isFinite(distance)) distance = 0;
      creature.translate(0, dropHeight - distance);
      // Horizontal offset so that the creatures do not overlap visually.
      creature.translate(i * 0.15 - (batch.length - 1) * 0.075, 0);
      // Never spawn inside the geometry (large designs or steep scenes).
      creature.resolveStaticOverlap();
      creature.initialPosition = {
        x: creature.getXPosition(),
        y: creature.getYPosition(),
      };
      creature.updateGeometry(0);
    }

  Evolution.prototype.applyBrains = function (creatures, chromosomes) {
    var self = this;
    creatures.forEach(function (creature, index) {
      var chromosome = index < chromosomes.length ? chromosomes[index] : null;
      self.applyBrain(creature, chromosome);
    });
  };

  Evolution.prototype.applyBrain = function (creature, chromosome) {
    var brainType = EVO.Brains.brainTypeForSimulation(
      this.Settings.Objective,
      this.data.LastV2SimulatedGeneration
    );
    var brain = EVO.Brains.create(brainType, creature);
    brain.init(
      this.NetworkSettings,
      creature.muscles,
      this.uniqueMusclesContext,
      chromosome || null

  /* ------------------------------------------------------------------ *
   * Simulation stepping
   * ------------------------------------------------------------------ */
  /** Advances the simulation by `dt` seconds of simulated time. */
  Evolution.prototype.update = function (dt) {
    if (!this.isRunning || this.paused) return;

    if (this.state === 'idle') {
      this.state = 'simulating';
    }

    this.accumulator += dt;

    // Upper bound per frame to avoid death spirals on slow devices.
    var maxSteps = 40;
    var steps = 0;
    while (this.accumulator >= FIXED_TIMESTEP && steps < maxSteps) {
      this.tick(FIXED_TIMESTEP);
      this.accumulator -= FIXED_TIMESTEP;
      steps++;
      if (this.state !== 'simulating') break;
    }
    if (steps >= maxSteps) this.accumulator = 0;
  };

  Evolution.prototype.getLeadingEdgeX = function (batch) {
    var leadingX = -Infinity;
    for (var i = 0; i < batch.length; i++) {
      var joints = batch[i].joints || [];
      for (var j = 0; j < joints.length; j++) {
        var body = joints[j].body || joints[j];
        leadingX = Math.max(leadingX, body.x + (body.radius || 0));
      }
    }
    return leadingX;
  };

  Evolution.prototype.tick = function (dt) {
    var batch = this.currentCreatureBatch;
    if (!batch.length || !this.world) {
      this.finishBatch();
      return;
    }

    // Populate an endless obstacle course before this physics step so a fast
    // creature always has its next progressive block ready to collide with.
    if (this.scene && this.scene.extendObstacleBlocksAhead) {
      this.scene.extendObstacleBlocksAhead(this.getLeadingEdgeX(batch));
    }

    var i;
    var self = this;

    // 1. Brains (Unity: FixedUpdate)
    for (i = 0; i < batch.length; i++) {
      batch[i].updateBrain(dt);
    }

    // 2. Physics — every creature contributes its muscle and wing forces.
    var forceCallback = function (world, subDt) {
      for (var c = 0; c < batch.length; c++) {
        batch[c].applyForces(world, subDt);
      }
    };
    this.world.addForceCallback(forceCallback);
    this.world.simulate(dt, PHYSICS_SUBSTEPS, PHYSICS_ITERATIONS);
    this.world.forceCallbacks.pop();

    // 3. Scene updates legacy dynamic structures. The obstacle course itself
    // has already been extended ahead of the active batch for this step.
    this.scene.update(dt);

    // 4. Book keeping
    for (i = 0; i < batch.length; i++) {
      var creature = batch[i];
      creature.syncContacts();
      creature.updateBoneVelocities();
      creature.update(dt);

      // Record two samples per tick to get the original 30 samples/second.
      if (this.tickCount % 2 === 0) {
        creature.recordSample();
      }
    }

    this.tickCount++;
    this.batchElapsed += dt;

    if (this.batchElapsed >= this.Settings.SimulationTime) {
      this.finishBatch();
    }
  };

  Evolution.prototype.finishBatch = function () {
    var batch = this.currentCreatureBatch;
    var simulationTime = this.Settings.SimulationTime;

    for (var i = 0; i < batch.length; i++) {
      var creature = batch[i];
      var solution = {
        chromosome: creature.brain ? creature.brain.network.toFloatArray() : [],
        stats: creature.getStatistics(simulationTime),
        numberOfNetworkOutputs: creature.brain ? creature.brain.network.numberOfOutputs() : 0,
        recorder: creature.recorder,
        // Snapshot the recording immediately: the recorders are reused (and
        // therefore reset) for the next batch of the same generation.
        recordingMovementData: creature.recorder
          ? creature.recorder.toRecordingMovementData()
          : null,
        creatureIndex: i,
      };
      this.solutions[this.solutionIndex++] = solution;
    }

    this.currentCreatureBatch = [];

    if (this.currentBatchNumber < this.numberOfBatches) {
      this.currentBatchNumber++;
      this.beginBatch();
    } else {
      this.evaluateSolutions();
    }
  };

  Evolution.prototype.teardownBatch = function () {
    this.currentCreatureBatch = [];
    if (this.world) {
      this.world.clear();
    }
    this.world = null;
    this.scene = null;
  };

  /* ------------------------------------------------------------------ *
   * Evaluation, selection and breeding
   * ------------------------------------------------------------------ */
  Evolution.prototype.evaluateSolutions = function () {
    var solutions = this.solutions;
    var self = this;

    // Sort by fitness (descending)
    solutions.sort(function (lhs, rhs) {
      return rhs.stats.unclampedFitness - lhs.stats.unclampedFitness;
    });

    var best = solutions[0];
    this.bestSolution = best;

    this.data.BestCreatures.push(
      EVO.ChromosomeData.create(
        best.chromosome.map(function (value) {
          return value;
        }),
        best.stats
      )
    );

    // Create a recording of the best creature of this generation.
    var recording = null;
    var movementData = best.recordingMovementData || (best.recorder ? best.recorder.toRecordingMovementData() : null);
    if (movementData) {
      recording = EVO.CreatureRecording.create(
        EVO.CreatureDesign.clone(this.data.CreatureDesign),
        this.SceneDescription,
        movementData,
        this.Settings.Objective,
        this.currentGenerationNumber,
        best.stats,
        this.getNumberOfCurrentBrainInputs(),
        best.numberOfNetworkOutputs,
        this.NetworkSettings
      );
      this.recordings.push(recording);
      this.generationFitness.push(best.stats.unclampedFitness);
    }

    // Keep the evaluated population until playback ends: the pending next
    // generation can be rebuilt if the user changes its settings during replay.
    this.completedSolutions = solutions.slice();
    this.playbackPending = true;
    this.onEvent('generationDidEnd', {
      generation: this.currentGenerationNumber,
      best: best,
      recording: recording,
    });

    var nextSettings = this.SettingsForNextGeneration;
    this.data.CurrentChromosomes = this.createNewChromosomes(
      nextSettings.PopulationSize,
      solutions,
      nextSettings.KeepBestCreatures,
      nextSettings
    );
    this.currentGenerationNumber++;
    this.state = 'idle';
    this.beginGeneration();
  };

  Evolution.prototype.createNewChromosomes = function (nextGenerationSize, solutions, keepBest, settingsOverride) {
    var settings = settingsOverride || this.Settings;
    var result = new Array(nextGenerationSize);

    var lazyChromosomes = solutions.map(function (solution) {
      return {
        chromosome: solution.chromosome,
        stats: solution.stats,
        getFitness: function () {
          return this.stats.fitness;
        },
      };
    });

    var selection = new EVO.Selection(settings.SelectionAlgorithm, lazyChromosomes);

    var start = 0;
    if (keepBest && lazyChromosomes.length >= 2) {
      // Keep the two best creatures of the previous generation.
      var best = selection.selectBest(2);
      result[0] = best[0].chromosome;
      result[1] = best[1].chromosome;
      start = 2;
    } else if (keepBest && lazyChromosomes.length === 1) {
      result[0] = lazyChromosomes[0].chromosome;
      start = 1;
    }

    var recombinationResult = [null, null];
    for (var i = start; i < result.length; i += 2) {
      var parent1 = selection.select();
      var parent2 = selection.select();
      if (!parent1 || !parent2) {
        var random = new Array(result.length ? result[0].length : 0);
        EVO.FeedForwardNetwork.populateRandomWeights(random);
        result[i] = random;
        continue;
      }

      EVO.Recombination.recombine(
        parent1.chromosome,
        parent2.chromosome,
        recombinationResult,
        settings.RecombinationAlgorithm
      );

      result[i] = this.mutated(recombinationResult[0], settings);
      if (i + 1 < result.length) {
        result[i + 1] = this.mutated(recombinationResult[1], settings);
      }
    }

    return result;
  };

  Evolution.prototype.mutated = function (chromosome, settingsOverride) {
    var settings = settingsOverride || this.Settings;
    var shouldMutate = Utils.randomRange(0, 100) < settings.MutationRate * 100;
    if (!shouldMutate) return chromosome.slice();
    return EVO.Mutation.mutate(chromosome.slice(), settings.MutationAlgorithm);
  };

  Evolution.prototype.getNumberOfCurrentBrainInputs = function () {
    var brainType = EVO.Brains.brainTypeForSimulation(
      this.Settings.Objective,
      this.data.LastV2SimulatedGeneration
    );
    return EVO.Brains.numberOfInputsForBrainType(brainType);
  };

  Evolution.prototype.getLegacySimulationOptions = function () {
    return {
      LegacyRotationCalculation: this.data.LastV2SimulatedGeneration > 0,
      LegacyClimbingDropCalculation:
        this.data.LastV2SimulatedGeneration > 0 && this.Settings.Objective === EVO.Objective.Climbing,
    };
  };

  /** The creature that the camera focuses on in the current batch. */
  Evolution.prototype.getWatchingCreature = function (index) {
    var batch = this.currentCreatureBatch;
    if (!batch.length) return null;
    return batch[Utils.clamp(index, 0, batch.length - 1)];
  };

  Evolution.prototype.getRecordingForGeneration = function (generation) {
    for (var i = this.recordings.length - 1; i >= 0; i--) {
      if (this.recordings[i].generation === generation) return this.recordings[i];
    }
    return null;
  };

  EVO.Evolution = Evolution;
  EVO.FIXED_TIMESTEP = FIXED_TIMESTEP;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = EVO;
  }
})(typeof window !== 'undefined' ? window : globalThis);

/*
 * Evolution (Web Edition) — sim/ecosystem.js
 * ---------------------------------------------------------------
 * Runs several saved creature designs together in one shared physics scene.
 */
(function (global) {
  'use strict';

  var EVO = (global.EVO = global.EVO || {});
  var FIXED_TIMESTEP = 1 / 60;
  var PHYSICS_SUBSTEPS = 3;
  var PHYSICS_ITERATIONS = 4;

  function objectiveBrainKey(objective) {
    var name = EVO.ObjectiveUtil.stringRepresentation(objective).replace(/[^a-z0-9]/gi, '');
    return name ? name.charAt(0).toLowerCase() + name.substr(1) : 'running';
  }

  function EcosystemSimulation() {
    this.world = null;
    this.scene = null;
    this.creatures = [];
    this.sceneDescription = null;
    this.entries = [];
    this.objective = EVO.Objective.Running;
    this.isRunning = false;
    this.paused = false;
    this.complete = false;
    this.elapsed = 0;
    this.duration = Infinity;
    this.accumulator = 0;
    this.speed = 1;
  }

  EcosystemSimulation.prototype.start = function (entries, objective, sceneDescription, duration) {
    this.stop();
    if (!entries || entries.length < 2) {
      throw new Error('Choose at least two creatures to start an ecosystem.');
    }

    this.entries = entries.slice();
    this.objective = objective;
    this.sceneDescription = sceneDescription || EVO.DefaultSimulationScenes.defaultSceneForObjective(objective);
    this.world = new EVO.PhysicsWorld();
    this.world.interCreatureCollisions = true;
    this.scene = new EVO.Scene(this.world, this.sceneDescription);
    this.creatures = [];
    this.elapsed = 0;
    this.duration = isFinite(duration) && duration > 0 ? duration : Infinity;
    this.accumulator = 0;
    this.paused = false;
    this.complete = false;

    var cursorX = -0.5 * (entries.length - 1);
    for (var i = 0; i < entries.length; i++) {
      var entry = entries[i];
      if (!entry || !entry.design || !entry.design.joints || !entry.design.joints.length) {
        this.stop();
        throw new Error('A selected creature has no joints to simulate.');
      }

      var design = EVO.CreatureDesign.clone(entry.design);
      var creature = new EVO.Creature(this.world, design, {
        scene: this.scene,
        creatureIndex: i,
        name: entry.name || design.name,
      });
      creature.objectiveTracker = EVO.ObjectiveTracker.create(objective, creature);
      creature.usesLegacyRotationCalculation = !!(
        entry.evolvedCreature && entry.evolvedCreature.lastV2SimulatedGeneration > 0
      );

      var minX = Infinity;
      var maxX = -Infinity;
      for (var joint = 0; joint < creature.joints.length; joint++) {
        var x = creature.joints[joint].body.x;
        minX = Math.min(minX, x);
        maxX = Math.max(maxX, x);
      }
      var width = Math.max(0, maxX - minX);
      var groundDistance = creature.semiSafeDistanceFromGround(objective === EVO.Objective.Climbing);
      if (!isFinite(groundDistance)) groundDistance = 0;
      creature.translate(cursorX - minX, this.sceneDescription.DropHeight - groundDistance);
      creature.resolveStaticOverlap();
      creature.prepareForEvolution();
      creature.initialPosition = { x: creature.getXPosition(), y: creature.getYPosition() };
      creature.updateGeometry(0);

      this.applyBrain(creature, entry);
      creature.autoFlap = !EVO.Settings || EVO.Settings.AutoFlapEnabled !== false;
      this.creatures.push(creature);
      cursorX += width + 1.5;
    }

    this.scene.reset();
    var creatures = this.creatures;
    this.world.addForceCallback(function (world, subDt) {
      for (var index = 0; index < creatures.length; index++) {
        creatures[index].applyForces(world, subDt);
      }
    });
    this.isRunning = true;
    return this;
  };

  EcosystemSimulation.prototype.applyBrain = function (creature, entry) {
    var profile = entry.evolvedBrains && entry.evolvedBrains[objectiveBrainKey(this.objective)];
    if (!profile && entry.evolvedCreature && entry.evolvedCreature.task === this.objective) {
      profile = entry.evolvedCreature;
    }
    var brainObjective = profile ? profile.task : this.objective;
    var lastV2Generation = profile ? profile.lastV2SimulatedGeneration || 0 : 0;
    var brainType = EVO.Brains.brainTypeForSimulation(brainObjective, lastV2Generation);
    var brain = EVO.Brains.create(brainType, creature);
    var uniqueMusclesContext = EVO.CalculateUniqueMusclesContext(creature.muscles);
    var networkSettings = profile && profile.networkSettings
      ? EVO.NeuralNetworkSettings.decode(profile.networkSettings)
      : EVO.NeuralNetworkSettings.defaultSettings();
    var chromosome = profile && profile.chromosome && profile.chromosome.length
      ? profile.chromosome
      : null;

    brain.init(networkSettings, creature.muscles, uniqueMusclesContext, chromosome);
    creature.brain = brain;
  };

  EcosystemSimulation.prototype.update = function (deltaTime, speed) {
    if (!this.isRunning || this.paused) return;
    this.speed = speed === undefined ? this.speed : speed;
    this.accumulator += Math.min(0.1, Math.max(0, deltaTime || 0)) * this.speed;
    var steps = 0;
    while (this.accumulator >= FIXED_TIMESTEP && steps < 40 && !this.complete) {
      var stepSize = Math.min(FIXED_TIMESTEP, this.duration - this.elapsed);
      if (stepSize <= 0) {
        this.complete = true;
        this.paused = true;
        break;
      }
      this.tick(stepSize);
      this.accumulator -= FIXED_TIMESTEP;
      steps++;
    }
    if (steps >= 40 || this.complete) this.accumulator = 0;
  };

  EcosystemSimulation.prototype.tick = function (deltaTime) {
    if (!this.world || !this.scene) return;
    var creatures = this.creatures;
    for (var i = 0; i < creatures.length; i++) creatures[i].updateBrain(deltaTime);

    this.world.simulate(deltaTime, PHYSICS_SUBSTEPS, PHYSICS_ITERATIONS);
    this.scene.update(deltaTime);
    for (var c = 0; c < creatures.length; c++) {
      creatures[c].syncContacts();
      creatures[c].updateBoneVelocities();
      creatures[c].update(deltaTime);
    }
    this.elapsed += deltaTime;
    if (this.elapsed >= this.duration - 1e-8) {
      this.elapsed = this.duration;
      this.complete = true;
      this.paused = true;
    }
  };

  EcosystemSimulation.prototype.togglePaused = function () {
    if (this.complete) return true;
    this.paused = !this.paused;
    return this.paused;
  };

  /**
   * Shocks every resident, interrupting whatever each creature is doing
   * right now (see `Creature.prototype.shock`).
   */
  EcosystemSimulation.prototype.shock = function (duration) {
    if (!this.isRunning || this.complete) return 0;
    var stunned = 0;
    for (var i = 0; i < this.creatures.length; i++) {
      if (this.creatures[i].shock(duration)) stunned++;
    }
    return stunned;
  };

  EcosystemSimulation.prototype.stop = function () {
    if (this.world) this.world.clear();
    this.world = null;
    this.scene = null;
    this.creatures = [];
    this.isRunning = false;
    this.paused = false;
    this.complete = false;
    this.elapsed = 0;
    this.duration = Infinity;
    this.accumulator = 0;
  };

  EVO.EcosystemSimulation = EcosystemSimulation;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = EVO;
  }
})(typeof window !== 'undefined' ? window : globalThis);

/*
 * Evolution (Web Edition) — sim/playback.js
 * ---------------------------------------------------------------
 * Plays back a recorded creature (the best creature of a generation).
 * Port of Assets/Scripts/Controllers/GalleryPlaybackController.cs and
 * the playback part of CreatureRecording.cs.
 */
(function (global) {
  'use strict';

  var EVO = (global.EVO = global.EVO || {});

  function PlaybackCreature(recording) {
    this.recording = recording;
    var design = recording.creatureDesign;
    var movementData = recording.movementData;

    this.numberOfJoints = design.joints.length;
    this.player = new EVO.CreatureRecordingPlayer(
      movementData,
      this.numberOfJoints,
      design.muscles.length
    );

    this.jointIndexById = Object.create(null);
    var self = this;
    design.joints.forEach(function (joint, index) {
      self.jointIndexById[joint.id] = index;
    });

    this.joints = design.joints.map(function (joint) {
      return { x: joint.x, y: joint.y };
    });

    this.bones = design.bones.map(function (bone) {
      return {
        data: bone,
        startIndex: self.jointIndexById[bone.startJointID],
        endIndex: self.jointIndexById[bone.endJointID],
        start: { x: 0, y: 0 },
        end: { x: 0, y: 0 },
        center: { x: 0, y: 0 },
        angle: 0,
        inverted: !!bone.inverted,
        isWing: !!bone.isWing,
        wingChord: bone.wingChord === undefined ? 1 : bone.wingChord,
      };
    });

    this.boneById = Object.create(null);
    this.bones.forEach(function (bone) {
      self.boneById[bone.data.id] = bone;
    });

    this.muscles = design.muscles.map(function (muscle) {
      return {

    /** The distance markers ("5", "10", ...) of the simulation scenes. */
    drawDistanceMarkers: function (ctx, scene, camera) {
      if (!scene || !scene.distanceMarkers || !scene.distanceMarkers.length) return;

      ctx.save();
      ctx.fillStyle = COLORS.marker;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

          var end = muscle.endBone;

              muscle.currentForce / Math.max(muscle.data.strength, 0.000001),

      var x = camera.worldToScreenX(body.x);
      var y = camera.worldToScreenY(body.y);

      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);

      var debug = bone.wingDebug;
      if (!debug) return;
      var magnitude = Math.sqrt(debug.forceX * debug.forceX + debug.forceY * debug.forceY);

      var endY = origin.y + (debug.forceY / magnitude) * length;

      var y1 = camera.worldToScreenY(origin.y);

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));

        { x: cx + 0.45, y: topY + 2.8 },
        { x: cx - 0.4, y: topY + 1.7 },
        { x: cx + 0.15, y: topY + 1.45 },
        { x: cx - 0.2, y: topY + 0.1 },
      ];
      ctx.globalAlpha = 0.5 + 0.5 * intensity;
      ctx.strokeStyle = COLORS.shock;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(2.5, 0.14 * scale);
      ctx.beginPath();
      ctx.moveTo(camera.worldToScreenX(bolt[0].x), camera.worldToScreenY(bolt[0].y));
      for (var p = 1; p < bolt.length; p++) {

    },

    /* ---------------------------------------------------------------- *
     * Decorations (v4 cosmetics)
     * ---------------------------------------------------------------- */
    drawDecoration: function (ctx, decoration, camera, opacity) {
      var bone = decoration.bone;
      if (!bone) return;
      var center = bone.center;
      var angle = bone.angle;
      var scale = camera.pixelsPerUnit();
      var px = camera.worldToScreenX(center.x);
      var py = camera.worldToScreenY(center.y);

      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.translate(px, py);

      ctx.rotate(-(angle + decoration.rotation * Utils.Deg2Rad));

      ctx.scale(decoration.flipX ? -1 : 1, decoration.flipY ? -1 : 1);
      ctx.translate(decoration.offset.x * scale, -decoration.offset.y * scale);
      EVO.DecorationShapes.draw(ctx, decoration.decorationType, s);
      ctx.restore();
    },

    /* ---------------------------------------------------------------- *
     * Recording playback
     * ---------------------------------------------------------------- */
    drawPlaybackCreature: function (ctx, playback, camera, options) {
      options = options || {};
      var opacity = options.opacity === undefined ? 1 : options.opacity;
      var scale = camera.pixelsPerUnit();
      ctx.save();

      // in both simulation playback and the gallery.
      if (playback.decorations) {
        for (var d = 0; d < playback.decorations.length; d++) {

          ctx.lineCap = 'round';

            camera.worldToScreenX(muscle.start.x),
            camera.worldToScreenY(muscle.start.y)
